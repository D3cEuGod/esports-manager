name: Multi-Platform Release (Windows / macOS / Android / Web)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend CLI dependencies
        run: npm install
      - name: Build Windows Portable EXE & NSIS Setup Installer
        run: npx tauri build --bundles nsis
      - name: Collect Windows release artifacts
        shell: pwsh
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path out-win | Out-Null
          Copy-Item "src-tauri/target/release/rift-manager.exe" "out-win/RiftManager-$env:TAG-Windows-Portable.exe" -Force
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "out-win/RiftManager-$env:TAG-Windows-Setup.exe" -Force
          }
          Get-ChildItem out-win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out-win/*

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend CLI dependencies
        run: npm install
      - name: Build macOS Universal (.app)
        run: npx tauri build --target universal-apple-darwin --bundles app
      - name: Package macOS Universal DMG (headless-safe drag-to-Applications)
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          mkdir -p out-mac dmg_stage
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 2 | head -n 1)
          test -n "$APP"
          cp -R "$APP" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "RiftManager-${TAG}" -srcfolder dmg_stage -ov -format UDZO "out-mac/RiftManager-${TAG}-macOS-Universal.dmg"
          ls -lh out-mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: out-mac/*

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build web bundle & copy into Android assets
        run: |
          python build_web.py
          mkdir -p mobile-android/app/src/main/assets
          cp dist/index.html mobile-android/app/src/main/assets/index.html
      - name: Generate Android release signing keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/rift-release.jks \
            -storepass riftmanager2026 -keypass riftmanager2026 \
            -alias riftmanager -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RiftManager, OU=Game, O=D3cEuGod, L=Shanghai, S=Shanghai, C=CN"
      - name: Build signed Android release APK
        working-directory: mobile-android
        env:
          RELEASE_STORE_FILE: /tmp/rift-release.jks
          RELEASE_STORE_PASSWORD: riftmanager2026
          RELEASE_KEY_ALIAS: riftmanager
          RELEASE_KEY_PASSWORD: riftmanager2026
        run: gradle assembleRelease --no-daemon
      - name: Collect Android & Offline Web artifacts
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          mkdir -p out-mobile
          cp mobile-android/app/build/outputs/apk/release/app-release.apk "out-mobile/RiftManager-${TAG}-Android.apk"
          cp dist/index.html "out-mobile/RiftManager-${TAG}-Web-Offline.html"
          ls -lh out-mobile
      - uses: actions/upload-artifact@v4
        with:
          name: release-mobile
          path: out-mobile/*

  publish-release:
    needs: [resolve-version, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          cat > release_notes.md <<'EOF'
          ## 峡谷经理人（Rift Manager）${TAG} 全平台正式发布

          ### 📥 各平台下载与安装指引

          | 平台 | 推荐安装包 | 说明 |
          | :--- | :--- | :--- |
          | **Windows** | `RiftManager-${TAG}-Windows-Portable.exe`（优先推荐）<br>`RiftManager-${TAG}-Windows-Setup.exe` | 绿色版双击即玩无需安装；Setup 版提供标准安装向导与快捷方式 |
          | **macOS（M 芯片 & Intel 通用）** | `RiftManager-${TAG}-macOS-Universal.dmg` | 原生 Universal 客户端；首次打开若提示“无法验证开发者”，**右键点击应用 → 打开**，或在「系统设置 → 隐私与安全性」点击「仍要打开」 |
          | **Android 手机** | `RiftManager-${TAG}-Android.apk` | 原生安卓安装包，下载直接安装；内置账号云同步与触控适配 |
          | **iPhone (iOS) / 在线全屏版** | 👉 [在线畅玩 / 添加到主屏幕 (PWA)](https://d3ceugod.github.io/esports-manager/) | iPhone 用 Safari 打开后点「分享 → 添加到主屏幕」，即可全屏离线运行并自动云同步 |
          | **全平台离线单文件版** | `RiftManager-${TAG}-Web-Offline.html` | 任意浏览器离线直接双击打开游玩 |

          ---

          ### ✨ 本版本主要更新亮点
          - **团队化学反应系统**：基于队员两两搭档磨合计算默契值；双子星 / 铁三角 / 整队原班留队或打包转会可完整保留羁绊；年中转会与跨赛区挖角符合真实生态。
          - **选手特质缓慢动态演化**：开档延续 Leaguepedia 现实历史特质，随多赛季夺冠/大赛硬仗或长期低迷逐步演进。
          - **一屏全览 BP 与 5v5 实时观战**：桌面端单屏自适应无外层滚动；1 秒自动消失 LoL 原版斜切过场动画、BP 倒计时归零自动锁定首推英雄；重绘拟真召唤师峡谷小地图与蓝红 OB 资源优势对比条；桌面按住 `Tab` 查看装备（松开关闭）、触控/鼠标点击常驻开关。
          - **分位置严格定额版本强度**：每位置恒定 2 T0 + 3 T1，彻底修复多赛季 T0/T1 英雄膨胀问题；新增休赛期版本预告与定向冬训。
          - **云存档双向自动同步 & 版本云端自动检测**：跨 Windows / Mac / 手机登录同一邮箱账号自动无缝衔接进度。
          EOF
          sed -i "s/\${TAG}/${TAG}/g" release_notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "峡谷经理人 ${TAG}（Windows / macOS / 手机全平台）" --notes-file release_notes.md
            gh release upload "${TAG}" all-assets/* --clobber
          else
            gh release create "${TAG}" all-assets/* \
              --title "峡谷经理人 ${TAG}（Windows / macOS / 手机全平台）" \
              --notes-file release_notes.md \
              --latest
          fi
