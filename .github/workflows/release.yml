name: Multi-Platform Release (Windows / macOS / Android / Web)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.1)'
        required: true
        default: 'v2.1.1'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend CLI dependencies
        run: npm install
      - name: Build Windows Portable EXE & NSIS Setup Installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 没配置更新签名密钥时照常出包，只是不生成应用内更新文件
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --bundles nsis
          } else {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY 未配置：跳过应用内更新签名"
            Set-Content -Path no-updater.json -Value '{"bundle":{"createUpdaterArtifacts":false}}'
            npx tauri build --bundles nsis --config no-updater.json
          }
      - name: Collect Windows release artifacts
        shell: pwsh
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path out-win | Out-Null
          Copy-Item "src-tauri/target/release/rift-manager.exe" "out-win/RiftManager-$env:TAG-Windows-Portable.exe" -Force
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "out-win/RiftManager-$env:TAG-Windows-Setup.exe" -Force
            if (Test-Path "$($nsis.FullName).sig") {
              Copy-Item "$($nsis.FullName).sig" "out-win/RiftManager-$env:TAG-Windows-Setup.exe.sig" -Force
            }
          }
          Get-ChildItem out-win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out-win/*

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend CLI dependencies
        run: npm install
      - name: Build macOS Universal (.app)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target universal-apple-darwin --bundles app
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置：跳过应用内更新签名"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > no-updater.json
            npx tauri build --target universal-apple-darwin --bundles app --config no-updater.json
          fi
      - name: Package macOS Universal DMG (headless-safe drag-to-Applications)
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          mkdir -p out-mac dmg_stage
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" -maxdepth 2 | head -n 1)
          test -n "$APP"
          cp -R "$APP" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "RiftManager-${TAG}" -srcfolder dmg_stage -ov -format UDZO "out-mac/RiftManager-${TAG}-macOS-Universal.dmg"
          # 应用内更新包（.app.tar.gz + 签名）
          TGZ=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" -maxdepth 2 | head -n 1)
          if [ -n "$TGZ" ] && [ -f "$TGZ.sig" ]; then
            cp "$TGZ" "out-mac/RiftManager-${TAG}-macOS-Universal.app.tar.gz"
            cp "$TGZ.sig" "out-mac/RiftManager-${TAG}-macOS-Universal.app.tar.gz.sig"
          fi
          ls -lh out-mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: out-mac/*

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build web bundle & copy into Android assets
        run: |
          python build_web.py
          mkdir -p mobile-android/app/src/main/assets
          cp dist/index.html mobile-android/app/src/main/assets/index.html
      - name: Prepare Android release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 固定签名密钥：新版 APK 才能覆盖安装旧版。未配置时退回临时密钥（不能覆盖安装）。
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/rift-release.jks
            echo "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            ALIAS=$(keytool -list -v -keystore /tmp/rift-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)
            test -n "$ALIAS"
            echo "RELEASE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置：使用临时签名，APK 无法覆盖安装旧版"
            keytool -genkeypair -v -keystore /tmp/rift-release.jks \
              -storepass riftmanager2026 -keypass riftmanager2026 \
              -alias riftmanager -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RiftManager, OU=Game, O=D3cEuGod, L=Shanghai, S=Shanghai, C=CN"
            echo "RELEASE_STORE_PASSWORD=riftmanager2026" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=riftmanager2026" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=riftmanager" >> "$GITHUB_ENV"
          fi
      - name: Build signed Android release APK
        working-directory: mobile-android
        env:
          RELEASE_STORE_FILE: /tmp/rift-release.jks
        run: gradle assembleRelease --no-daemon
      - name: Collect Android & Offline Web artifacts
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          mkdir -p out-mobile
          cp mobile-android/app/build/outputs/apk/release/app-release.apk "out-mobile/RiftManager-${TAG}-Android.apk"
          cp dist/index.html "out-mobile/RiftManager-${TAG}-Web-Offline.html"
          ls -lh out-mobile
      - uses: actions/upload-artifact@v4
        with:
          name: release-mobile
          path: out-mobile/*

  publish-release:
    needs: [resolve-version, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true
      - name: Generate updater manifest (latest.json)
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, pathlib
          tag = os.environ['TAG']; repo = os.environ['REPO']
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          d = pathlib.Path('all-assets')
          plat = {}
          def add(keys, name):
              sig = d / (name + '.sig')
              if (d / name).exists() and sig.exists():
                  entry = {'signature': sig.read_text().strip(), 'url': base + name}
                  for k in keys: plat[k] = entry
          add(['windows-x86_64'], f'RiftManager-{tag}-Windows-Setup.exe')
          add(['darwin-aarch64', 'darwin-x86_64'], f'RiftManager-{tag}-macOS-Universal.app.tar.gz')
          if plat:
              notes = ''
              try: notes = json.load(open('version.json', encoding='utf-8')).get('notes', '')
              except Exception: pass
              (d / 'latest.json').write_text(json.dumps({
                  'version': tag.lstrip('v'), 'notes': notes,
                  'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'platforms': plat}, ensure_ascii=False, indent=2), encoding='utf-8')
              print('latest.json platforms:', list(plat))
          else:
              print('no updater signatures found; skip latest.json')
          PY
          rm -f all-assets/*.sig
          ls -lh all-assets
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          cat > release_notes.md <<'EOF'
          ## 峡谷经理人（Rift Manager）${TAG} 全平台正式发布

          ### 📥 各平台下载与安装指引

          | 平台 | 推荐安装包 | 说明 |
          | :--- | :--- | :--- |
          | **Windows** | `RiftManager-${TAG}-Windows-Portable.exe`（优先推荐）<br>`RiftManager-${TAG}-Windows-Setup.exe` | 绿色版双击即玩无需安装；Setup 版提供标准安装向导与快捷方式 |
          | **macOS（M 芯片 & Intel 通用）** | `RiftManager-${TAG}-macOS-Universal.dmg` | 原生 Universal 客户端；首次打开若提示“无法验证开发者”，**右键点击应用 → 打开**，或在「系统设置 → 隐私与安全性」点击「仍要打开」 |
          | **Android 手机** | `RiftManager-${TAG}-Android.apk` | 原生安卓安装包，下载直接安装；内置账号云同步与触控适配 |
          | **iPhone (iOS) / 在线全屏版** | 👉 [在线畅玩 / 添加到主屏幕 (PWA)](https://d3ceugod.github.io/esports-manager/) | iPhone 用 Safari 打开后点「分享 → 添加到主屏幕」，即可全屏离线运行并自动云同步 |
          | **全平台离线单文件版** | `RiftManager-${TAG}-Web-Offline.html` | 任意浏览器离线直接双击打开游玩 |

          ---

          EOF
          sed -i "s/\${TAG}/${TAG}/g" release_notes.md
          # 每个版本的更新说明放在 docs/releases/<tag>.md
          if [ -f "docs/releases/${TAG}.md" ]; then
            cat "docs/releases/${TAG}.md" >> release_notes.md
          else
            echo "（本版本暂无单独的更新说明）" >> release_notes.md
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "峡谷经理人 ${TAG}（Windows / macOS / 手机全平台）" --notes-file release_notes.md
            gh release upload "${TAG}" all-assets/* --clobber
          else
            gh release create "${TAG}" all-assets/* \
              --title "峡谷经理人 ${TAG}（Windows / macOS / 手机全平台）" \
              --notes-file release_notes.md \
              --latest
          fi
