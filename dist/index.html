<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="峡谷经理人">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>峡谷经理人</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/*
VOICE  主站：赛事转播记分牌；比赛/BP：英雄联盟海克斯科技客户端 + 职业转播顶栏
COLOUR 主站纸白 #f4f2ee / 墨黑 #111 / 信号红 #e8213a；
       BP 海克斯深海 #010a13 / 鎏金 #c89b3c / 羊皮纸 #f0e6d2 / 蓝方 #0ac8b9 / 红方 #e84057
*/
:root{--bg:#f4f2ee;--pn:#fff;--ink:#111;--mu:#76726b;--ln:#e3dfd8;--ln2:#cfc9bf;--ac:#e8213a;--bl:#1f5bff;--rd:#e8213a;--gr:#14833b;--yl:#b7791f;
 --hex-bg:#010a13;--hex-pn:#091428;--hex-pn2:#0d1c33;--hex-gold:#c89b3c;--hex-gold-d:#785a28;--hex-gold-l:#f0e6d2;--hex-mu:#a09b8c;
 --hex-blue:#0ac8b9;--hex-blue2:#1e78ff;--hex-red:#e84057;--hex-red2:#9e182d;
 --num:"Barlow Condensed","DIN Condensed","Arial Narrow",sans-serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);min-height:100vh;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
a{color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--ac);text-underline-offset:3px}
small{color:var(--mu)}h1,h2,h3,h4{font-weight:900;letter-spacing:.5px}
/* 顶栏 */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px max(3vw,16px);background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:900;font-size:22px;letter-spacing:4px;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:10px;height:22px;background:var(--ac);display:inline-block}
.hinfo{display:flex;gap:22px;flex-wrap:wrap}.hinfo>div{display:flex;flex-direction:column;line-height:1.2}
.hinfo small{color:#8d8a84;font-size:11px}.hinfo b{font-family:var(--num);font-size:18px;font-weight:700}
.top .tt b{color:#fff}.top .ovr.ovr{background:none;color:#fff;font-size:18px;padding:0}.top .ovr.s.s{color:#ff5a6e}
.tabs{display:flex;gap:4px;padding:0 max(3vw,16px);background:var(--pn);border-bottom:1px solid var(--ln2);overflow-x:auto}
.tabs a{padding:12px 14px;color:var(--mu);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--ink);border-color:var(--ac);font-weight:700}
main{padding:20px max(3vw,16px);max-width:1280px;margin:0 auto}
.card{background:var(--pn);border:1px solid var(--ln);padding:20px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:24px}.card h3{margin:16px 0 8px;font-size:17px}.card h3:first-child{margin-top:0}.card h4{margin:6px 0;font-size:14px;color:var(--mu)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:16px}
.cols>.card{margin:0}
/* 主页（精简聚焦） */
.evcard{border-top:4px solid var(--ink)}
.season-strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--ln)}
.ss-item{font-size:11px;padding:3px 9px;background:var(--bg);color:var(--mu);white-space:nowrap;border:1px solid var(--ln)}
.ss-item.past{color:var(--ink);border-color:var(--ln2)}
.ss-item.now{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ac)}
.home-grid{align-items:start}
.evh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}.evh h2{font-size:30px;margin:0}.evh span{color:var(--mu)}
.fmtd{margin:8px 0 4px}.fmtd summary{cursor:pointer;color:var(--mu);font-size:13px}
.fmt{color:#3d3a35;background:var(--bg);padding:12px 14px;white-space:pre-wrap;font-size:13px;margin:8px 0;border-left:3px solid var(--ln2)}
.nextm{margin:18px 0 8px;background:var(--ink);color:#fff;padding:22px}
.nextm .lbl{color:#8d8a84;font-size:13px;text-align:center}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:8px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:2px}.vs .side:first-child{align-items:flex-end}.vs .side:last-child{align-items:flex-start}
.vs .side span{color:#8d8a84;font-size:13px}.vs em{font-style:normal;font-family:var(--num);font-weight:800;font-size:28px;color:var(--ac)}
.nextm .tt b{color:#fff}.nextm .tt.me b{color:#fff;box-shadow:inset 0 -4px 0 var(--ac)}
.stage{color:var(--mu);margin-top:10px}.stage b{color:var(--ink)}
.done{font-size:17px;margin:12px 0;font-weight:700}
/* 按钮 */
.btn{background:var(--ink);color:#fff;border:2px solid var(--ink);padding:9px 16px;font-weight:700;cursor:pointer;font:700 14px var(--sans);display:inline-flex;align-items:center;gap:6px;min-height:40px;text-decoration:none}
.btn:hover{background:var(--ac);border-color:var(--ac)}.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--hex-gold);outline-offset:2px}
.btn.big{padding:12px 26px;font-size:16px;min-height:48px;background:var(--ac);border-color:var(--ac)}.btn.big:hover{background:var(--ink);border-color:var(--ink)}
.btn.sm{padding:3px 10px;font-size:12px;min-height:28px;margin:1px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ln2)}.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
/* 队伍/数值 */
.tt{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}.tt b{font-family:var(--num);font-weight:700;font-size:16px;letter-spacing:.5px}
.tt i{font-style:normal;font-size:9px;color:var(--mu);font-weight:500;letter-spacing:.5px}
.tt.me b{color:var(--ac)}.tt.big b{font-size:clamp(28px,4vw,44px);font-weight:800;line-height:1}.tt.big i{font-size:11px}
.ovr{font-family:var(--num);font-weight:700;font-size:16px;display:inline-block;min-width:26px}.ovr.s{color:var(--ac)}.ovr.a{color:var(--ink)}.ovr.b{color:#55514b}.ovr.c{color:#9a958d}
/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--mu);font-weight:500;text-align:left;border-bottom:2px solid var(--ink);padding:6px 8px;font-size:12px;white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}.tbl tr:hover td{background:#faf9f6}
.tbl tr.me td{background:#fdecee}.tbl td small{font-size:12px}
.news{list-style:none;padding:0;margin:0}.news li{padding:8px 0;border-bottom:1px solid var(--ln)}
.tl{list-style:none;padding:0;margin:0;counter-reset:t}.tl li{padding:7px 0 7px 30px;color:var(--mu);border-bottom:1px solid var(--ln);position:relative;counter-increment:t}
.tl li::before{content:counter(t);position:absolute;left:0;font-family:var(--num);font-weight:700;color:var(--ln2);font-size:18px;line-height:1.3}
.tl li.now{color:var(--ink)}.tl li.now::before{color:var(--ac)}.tl li.now b{color:var(--ac)}.tl li.past b{color:var(--ink)}
.warn{color:var(--ac);font-weight:500}.muted{color:var(--mu)}
/* 统一矢量 SVG 图标与语义着色 */
.ico{width:14px;height:14px;display:inline-block;vertical-align:-2px;flex-shrink:0}
.ico.lg{width:22px;height:22px;vertical-align:-4px}
.ico.gold,.c-gold{color:#e6b84c}.ico.c-t0{color:#ff7b47}.ico.c-t1{color:#0ac8b9}.ico.c-bar{color:#b78cff}.ico.c-drk{color:#ff9f52}.ico.c-red{color:#ff5c72}.ico.c-teal{color:#5ef2e4}.ico.c-ice{color:#9cc4ff}
/* 主页逐行赛事速报（与最新赛场动态统一风格） */
.ev-bulletin{list-style:none;padding:0;margin:10px 0 6px;border-top:1px solid var(--ln)}
.ev-bulletin li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 4px;border-bottom:1px solid var(--ln);font-size:14px}
.eb-lbl{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-weight:600}
.eb-val{font-weight:700}
/* 团队化学反应与跨赛区提示 */
.chem-top{display:inline-flex;align-items:center;gap:4px}
.chem-top.c4,.chem-pill.c4{color:#15803d}.chem-top.c3,.chem-pill.c3{color:#0d9488}.chem-top.c2,.chem-pill.c2{color:#b45309}.chem-top.c1,.chem-pill.c1{color:#c2410c}.chem-top.c0,.chem-pill.c0{color:#dc2626}
.top .chem-top.c4{color:#4ade80}.top .chem-top.c3{color:#2dd4bf}.top .chem-top.c2{color:#fbbf24}.top .chem-top.c1{color:#fb923c}.top .chem-top.c0{color:#f87171}
.chem-pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1px solid var(--ln2);background:#faf9f6;font-size:13px;font-weight:700}
.chem-bar-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;font-size:12px}
.chem-core{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#eef9f6;border:1px solid #96d8cb;color:#0b6156;font-weight:700}
.chem-pv{padding:8px 11px;margin:8px 0;background:#f7f5f0;border-left:3px solid var(--ink);font-size:13px}
.bd-val{font-family:var(--num);font-weight:800;font-size:15px}
.bd-val.hi{color:var(--gr)}.bd-val.mid{color:#555}.bd-val.lo{color:var(--ac)}
.cr-tag{display:inline-flex;align-items:center;gap:2px;margin-left:5px;padding:0 5px;font-size:10px;font-weight:700;background:#fff1f2;color:#be123c;border:1px solid #fecdd3;vertical-align:1px}
.cr-tag .ico{width:11px;height:11px;vertical-align:-1px}
/* 云端新版本更新提示横幅 */
.upd-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px max(3vw,16px);background:linear-gradient(90deg,#0c2848,#133d6b);color:#f0e6d2;font-size:13px;border-bottom:2px solid var(--hex-gold)}
.upd-banner span{display:inline-flex;align-items:center;gap:6px}
.upd-acts{display:flex;gap:8px;align-items:center}
.upd-acts .btn.ghost{color:#f0e6d2;border-color:rgba(240,230,210,.45)}
.chip.t0{border-color:#d9532f;background:#fff4f0}.chip.t1{border-color:#0e8c82;background:#eefbf9}
/* 开始页 */
.start{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,64px) max(3vw,16px)}
.start h1{font-size:clamp(48px,8vw,96px);margin:0;line-height:1;letter-spacing:8px;display:flex;align-items:center;gap:16px}
.start h1::before{content:"";width:18px;height:.9em;background:var(--ac)}
.sub{color:var(--mu);font-size:17px;margin:12px 0 28px}.start h3{border-top:2px solid var(--ink);padding-top:14px;margin-top:28px}
.start>.btn{margin-bottom:8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:0;margin:12px 0;border-left:1px solid var(--ln2);border-top:1px solid var(--ln2)}
.tcard{background:var(--pn);border-right:1px solid var(--ln2);border-bottom:1px solid var(--ln2);padding:16px;cursor:pointer;position:relative;transition:background .15s}
.tcard:hover{background:var(--ink);color:#fff}.tcard:hover .tp,.tcard:hover .tf,.tcard:hover small{color:#a9a59e}
.tn{font-family:var(--num);font-size:34px;font-weight:800;line-height:1}.tf{color:var(--mu);font-size:12px;margin:2px 0 10px}
.tov{position:absolute;top:14px;right:16px;font-family:var(--num);font-size:30px;font-weight:700;line-height:1;text-align:right}.tov small{display:block;font-size:10px;font-family:var(--sans)}
.tp{font-size:12px;color:var(--mu)}.note{color:var(--mu);font-size:13px}
/* 阵容 */
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:14px 0;border:2px solid var(--ink)}
.slot{padding:12px;text-align:center;border-right:1px solid var(--ln2)}.slot:last-child{border-right:0}.slot .r{color:var(--mu);font-size:12px}
.slot b{display:block;font-family:var(--num);font-size:22px;line-height:1.1}.slot em{display:block;color:var(--ac);font-size:11px;font-style:normal}
.pool span{display:inline-block;font-size:11px;border:1px solid var(--ln2);padding:0 5px;margin:1px;color:#55514b;background:#faf9f6}
.pool span.sig,.pool span.pl-sig{border-color:#9e6e11;background:#fff8e6;color:#724d05;font-weight:800}
.pool span.pl-mas{border-color:#0e7a70;background:#ebfbf8;color:#0a5e56;font-weight:700}
.pool span.pl-pro{border-color:#3a5680;background:#eef3fa;color:#233b5e;font-weight:600}
.pool span.pl-fam{border-color:var(--ln2);color:#6e6a63}
.pool span.pl-new{border-style:dashed;color:#9a958d}
.tagon{color:var(--gr);font-size:12px;margin-right:4px;font-weight:700}.fx{color:var(--yl);margin-left:4px}.act{white-space:nowrap}
.nft-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;background:#f4f1ec;border:1px solid var(--ln2);color:#6b655c;white-space:nowrap}
/* 筛选与主页内嵌模块（清爽紧凑） */
.mk-hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.mk-hd h3{margin:0;font-size:19px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
select,input,textarea{background:var(--pn);color:var(--ink);border:1px solid var(--ln2);padding:7px 10px;font:15px var(--sans);min-height:38px}
h2 .on,h2 .off,.mk-hd h3 .on,.mk-hd h3 .off{font-size:12px;margin-left:10px;padding:2px 8px;vertical-align:middle;color:#fff}
h2 .on,.mk-hd h3 .on{background:var(--gr)}h2 .off,.mk-hd h3 .off{background:var(--mu)}
.win-lineup-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--ln2)}
.wl-slot{display:inline-flex;align-items:baseline;gap:5px;padding:4px 9px;background:var(--pn);border:1px solid var(--ln)}
.wl-slot small{font-size:11px}.wl-slot b{font-family:var(--num);font-size:17px}
.wl-link{font-size:13px;font-weight:700;margin-left:6px}
.compact-news{padding:14px 20px}.compact-news h4{margin:0 0 6px}.compact-news .news li{padding:5px 0;font-size:13px}
/* 休赛期一站式清爽标签面板 */
.off-hub{margin-top:12px}
.off-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.off-tabs{display:flex;gap:6px;flex-wrap:wrap}
.off-tabs a{padding:8px 14px;text-decoration:none;border:1px solid var(--ln2);background:var(--bg);color:var(--mu);font-weight:700;font-size:14px}
.off-tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.patch-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;margin-top:10px}
.pp-col{border:1px solid var(--ln2);padding:12px 14px;background:#faf9f6}
.pp-col.buff{border-top:3px solid var(--gr)}.pp-col.nerf{border-top:3px solid var(--mu)}
.pp-col h4{margin:0 0 8px;color:var(--ink);font-size:15px}
.pp-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.pp-list li{display:flex;align-items:flex-start;gap:9px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.pp-list li:last-child{border-bottom:0;padding-bottom:0}
.pp-txt{flex:1;font-size:13px}.pp-desc{color:#4b4740;font-size:12px;margin-top:2px}
.pp-tag{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;margin:0 3px}
.pp-tag.up{background:#e6f6ec;color:var(--gr);border:1px solid #9ad6b0}
.pp-tag.dn{background:#f2eee9;color:#6e685f;border:1px solid var(--ln2)}
.train-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;margin-top:10px;align-items:start}
.train-roster{display:flex;flex-direction:column;gap:6px}
.tr-pl{text-align:left;padding:9px 12px;background:var(--bg);border:1px solid var(--ln2);cursor:pointer;font:14px var(--sans)}
.tr-pl b{font-family:var(--num);font-size:18px}
.tr-pl.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tr-pl.on small,.tr-pl.on .muted{color:#b7b2a9}
.tr-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;font-size:11px}
.tr-tags span{padding:1px 6px;background:rgba(232,33,58,.12);color:var(--ac);font-weight:700}
.tr-pl.on .tr-tags span{background:var(--ac);color:#fff}
.train-picker{border:1px solid var(--ln2);padding:14px;background:#faf9f6}
.tp-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.tp-sub{font-size:13px;font-weight:700;margin-bottom:8px}
.train-cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;max-height:310px;overflow-y:auto;padding-right:4px}
.tc-chip{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--pn);border:1px solid var(--ln2);cursor:pointer;font:600 12px var(--sans);text-align:left}
.tc-chip small{display:block;font-size:10px;color:var(--mu);font-weight:500}
.tc-chip:hover{border-color:var(--ink)}
.tc-chip.on{background:var(--ink);color:#fff;border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.tc-chip.on small{color:#d5d0c8}
@media(max-width:720px){.train-layout{grid-template-columns:1fr}}
.tabs a.on{background:none}.evtabs a.on,.filters a.on{background:none}
/* 弹窗 */
.mask{position:fixed;inset:0;background:#111b;z-index:20}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;background:var(--pn);border-top:5px solid var(--ac);padding:22px;width:min(760px,94vw);max-height:88vh;overflow:auto;max-height:88dvh;overscroll-behavior:contain}
.modal>.btns,.modal .btns:last-child{position:sticky;bottom:-22px;margin:12px -22px -22px;padding:12px 22px;background:var(--pn);border-top:1px solid rgba(0,0,0,.08);z-index:2}
@media(max-width:600px){.modal{padding:16px;width:96vw}.modal>.btns,.modal .btns:last-child{bottom:-16px;margin:12px -16px -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
.modal h3{margin-top:0}.modal label{display:block;margin:10px 0}.g{color:var(--gr)}.y{color:var(--yl)}.r{color:var(--ac)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#091428;color:var(--hex-gold-l);padding:11px 22px;z-index:40;border:1px solid var(--hex-gold);box-shadow:0 8px 28px rgba(0,0,0,.55);font-weight:700;letter-spacing:.5px}
/* 赛事 */
.evtabs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--ink)}
.evtabs a{padding:8px 12px;color:var(--mu);text-decoration:none;font-size:14px}.evtabs a.on{color:#fff;background:var(--ink)}
.bracket{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}.bcol{display:flex;flex-direction:column;gap:10px;justify-content:space-around;min-width:190px}
.mc{background:var(--pn);border:1px solid var(--ln2);padding:6px 10px;font-size:13px}.mc.me{border-color:var(--ac);border-width:2px}.mc[data-a]{cursor:pointer}.mc[data-a]:hover{border-color:var(--ink)}
.mc>div{display:flex;justify-content:space-between;align-items:baseline}.mc>div>b{font-family:var(--num);font-size:17px}.mc .win .tt b,.mc .win>b{color:var(--ink)}.mc>div:not(.win) .tt b{color:#9a958d}
.mc small{font-size:11px;display:block;border-top:1px solid var(--ln);margin-top:3px;padding-top:2px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
details>summary{cursor:pointer;color:var(--mu);margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--ink);padding:3px 10px;font-size:13px}
.gd{border-top:2px solid var(--ink);padding:10px 0;margin:10px 0}.gp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;font-size:13px}
.evlog-sm{list-style:none;padding:6px 10px;margin:8px 0 0;background:var(--bg);font-size:12px;border-left:3px solid var(--ln2)}.evlog-sm li{padding:2px 0}.evlog-sm b{font-family:var(--num);margin-right:6px;color:var(--ink)}
/* 账号与云同步 */
.cloud-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font:600 12px var(--sans);cursor:pointer;white-space:nowrap}
.cloud-pill:hover{border-color:var(--hex-gold);background:rgba(200,155,60,.22)}
.cloud-pill b{font-size:13px;font-family:var(--sans)}.cloud-pill small{color:#b7b4ad;font-size:11px}
.cloud-pill.synced{border-color:#26a868;background:rgba(20,131,59,.25)}.cloud-pill.syncing{border-color:var(--hex-gold)}.cloud-pill.offline{border-color:#d97706}
.start-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.start-acct .cloud-pill{background:var(--ink);color:#fff;border-color:var(--ink)}
.acct-box h3{margin-top:0}.acct-user{padding:12px 14px;background:var(--bg);border-left:4px solid var(--gr);margin:10px 0}
.acct-subtabs{display:flex;gap:14px;margin:8px 0 4px;border-bottom:1px solid var(--ln2)}
.acct-subtabs a{padding:6px 2px;text-decoration:none;color:var(--mu);font-weight:600;border-bottom:2px solid transparent}
.acct-subtabs a.on{color:var(--ink);border-color:var(--ac);font-weight:800}
.acct-form .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.acct-form input{width:100%}
hr.sep{border:none;border-top:1px solid var(--ln2);margin:20px 0}
.conflict-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.cf-card{border:1px solid var(--ln2);padding:14px;background:#faf9f6;display:flex;flex-direction:column;gap:6px}
.cf-card.cloud{border-color:var(--ac);background:#fff8f9}
.cf-hd{font-weight:900;font-size:15px;border-bottom:1px solid var(--ln);padding-bottom:6px;margin-bottom:4px}
.cf-card .btn{margin-top:8px;justify-content:center}
/* 第 1 屏：海克斯科技风格独立登录 / 游客门户页 */
.gate-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(ellipse at 50% 15%,#102a46 0%,#061326 48%,#010a13 100%);
  color:var(--hex-gold-l)
}
.gate-card{
  width:min(440px,100%);padding:34px 30px 28px;
  background:linear-gradient(180deg,rgba(9,20,40,.96),rgba(3,10,20,.98));
  border:1px solid var(--hex-gold-d);border-top:3px solid var(--hex-gold);
  box-shadow:0 24px 64px rgba(0,0,0,.7),inset 0 0 40px rgba(10,200,185,.06);
  text-align:center
}
.gate-eyebrow{display:inline-block;font-size:11px;font-weight:800;letter-spacing:2.2px;color:var(--hex-gold);margin-bottom:8px;text-transform:uppercase}
.gate-brand h1{margin:0;font-size:clamp(38px,7vw,50px);letter-spacing:6px;line-height:1.1;color:#fff;text-shadow:0 2px 18px rgba(200,155,60,.35)}
.gate-sub{margin:6px 0 24px;color:var(--hex-mu);font-size:14px;letter-spacing:2px}
.gate-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--hex-gold-d);margin-bottom:16px;background:rgba(1,10,19,.6)}
.gate-tabs button{background:transparent;border:none;color:var(--hex-mu);padding:10px;font:700 14px var(--sans);cursor:pointer;transition:background .15s,color .15s}
.gate-tabs button.on{background:rgba(200,155,60,.22);color:#fff;box-shadow:inset 0 -2px 0 var(--hex-gold)}
.gate-form{display:flex;flex-direction:column;gap:11px;text-align:left}
.gate-form input{
  width:100%;background:#040d1a;color:#fff;border:1px solid #2b4263;padding:11px 13px;font:15px var(--sans);min-height:44px
}
.gate-form input::placeholder{color:#6d7e96}
.gate-form input:focus{border-color:var(--hex-gold);outline:none;box-shadow:0 0 0 2px rgba(200,155,60,.22)}
.gate-primary{
  width:100%;padding:12px 18px;min-height:46px;font:900 15px var(--sans);letter-spacing:1px;cursor:pointer;
  color:#f0e6d2;background:linear-gradient(180deg,#118596 0%,#094657 100%);
  border:1.5px solid var(--hex-gold);box-shadow:0 0 20px rgba(10,200,185,.28);margin-top:4px;
  transition:filter .15s,transform .12s
}
.gate-primary:hover:not(:disabled){filter:brightness(1.15);color:#fff;transform:translateY(-1px)}
.gate-primary:disabled{opacity:.45;cursor:not-allowed}
.gate-hint{margin:2px 0 0;font-size:12px;color:var(--hex-mu);text-align:center}
.gate-div{display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:#5f738f;font-size:12px}
.gate-div::before,.gate-div::after{content:"";flex:1;height:1px;background:rgba(200,155,60,.25)}
.gate-guest{
  width:100%;padding:11px 16px;min-height:44px;font:700 14px var(--sans);cursor:pointer;
  background:rgba(255,255,255,.04);color:var(--hex-gold-l);border:1px solid #354c6b;transition:border-color .15s,background .15s
}
.gate-guest:hover{border-color:var(--hex-gold);background:rgba(200,155,60,.14);color:#fff}
.gate-foot{margin:10px 0 0;font-size:11px;color:#7888a0}
.gate-logged{padding:12px 0}.gate-user-line{font-size:15px;color:#fff;margin-bottom:6px}
.gate-tip{font-size:12px;color:var(--hex-blue);margin:0 0 18px}
.gate-btns{display:flex;flex-direction:column;gap:10px}
.gate-secondary{width:100%;padding:10px;background:transparent;border:1px solid #354c6b;color:var(--hex-mu);font:600 13px var(--sans);cursor:pointer}
.gate-secondary:hover:not(:disabled){border-color:var(--hex-gold-l);color:#fff}
.gate-secondary:disabled{opacity:.45;cursor:not-allowed}
.gate-otp{padding:6px 0}
.otp-badge{display:inline-block;padding:3px 12px;margin-bottom:10px;border:1px solid var(--hex-gold);background:rgba(200,155,60,.18);color:var(--hex-gold-l);font-size:12px;font-weight:800;letter-spacing:1.2px}
.otp-input{text-align:center;font-family:var(--num)!important;font-size:28px!important;font-weight:800;letter-spacing:10px}
.otp-input.light{background:var(--pn);color:var(--ink);border:2px solid var(--ink);letter-spacing:8px;max-width:280px}
.otp-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
/* 第 2 屏：存档继续卡片 & 选队标题 */
.resume-card{border-top:4px solid var(--ac);display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-top:20px}
.resume-eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--ac);text-transform:uppercase;margin-bottom:4px}
.resume-info h2{margin:0 0 4px;font-size:28px}
.pick-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:2px solid var(--ink);padding-top:14px;margin-top:24px}
.pick-hd h3{border-top:none;padding-top:0;margin:0}
@media(max-width:640px){.conflict-grid{grid-template-columns:1fr}.gate-card{padding:26px 20px}}

/* =====================================================================
   比赛 / BP 界面：英雄联盟海克斯科技客户端 + 职业赛事顶栏
   ===================================================================== */
@keyframes hexPulseRed{0%,100%{box-shadow:0 0 0 0 rgba(232,64,87,.65),inset 0 0 14px rgba(232,64,87,.35)}50%{box-shadow:0 0 18px 2px rgba(232,64,87,.9),inset 0 0 20px rgba(232,64,87,.55)}}
@keyframes hexPulseGold{0%,100%{box-shadow:0 0 0 0 rgba(200,155,60,.5),inset 0 0 12px rgba(10,200,185,.25)}50%{box-shadow:0 0 18px 2px rgba(200,155,60,.85),inset 0 0 22px rgba(10,200,185,.45)}}
@keyframes hexPulseBlue{0%,100%{box-shadow:0 0 0 0 rgba(10,200,185,.45)}50%{box-shadow:0 0 16px 2px rgba(10,200,185,.85)}}

.match.hex{
  min-height:100vh;color:var(--hex-gold-l);padding:10px max(1.6vw,10px) 18px;
  background:radial-gradient(ellipse at 50% 0%,#0f2744 0%,#061224 46%,#010a13 100%);
  position:relative;transition:background .35s ease
}
/* Ban（鲜明猩红背景） / Pick（海克斯深蓝背景）阶段全屏氛围强烈分化 */
.match.hex.mode-ban{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(194,24,54,.62) 0%,rgba(92,12,28,.75) 38%,#1a050b 72%,#0a0205 100%);
}
.match.hex.mode-pick{
  background:
    radial-gradient(ellipse at 50% 0%,rgba(18,96,196,.62) 0%,rgba(9,44,102,.78) 40%,#04152e 74%,#010915 100%);
}

/* LoL 原版风格 Ban <-> Pick 阶段切换加强横幅动画（独立挂载，严格 1 秒自动消失，绝不挡点击） */
@keyframes bpSplashWrap{0%{opacity:0}14%{opacity:1}76%{opacity:1}100%{opacity:0}}
@keyframes bpBeamExpand{0%{transform:scaleX(.05) scaleY(.4);opacity:0}18%{transform:scaleX(1.04) scaleY(1);opacity:1}80%{transform:scaleX(1) scaleY(1);opacity:.92}100%{transform:scaleX(1.16) scaleY(.2);opacity:0}}
@keyframes bpSlashSweep{0%{transform:translateX(-110%) skewX(-24deg);opacity:0}25%{opacity:.85}85%{opacity:.4}100%{transform:translateX(120%) skewX(-24deg);opacity:0}}
@keyframes bpCorePop{0%{transform:scale(.76);letter-spacing:9px;opacity:0}20%{transform:scale(1.04);letter-spacing:3px;opacity:1}78%{transform:scale(1);letter-spacing:2.5px;opacity:1}100%{transform:scale(1.1);opacity:0}}
@keyframes bpLockBurst{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.03)}80%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
.bp-splash{
  position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  animation:bpSplashWrap 1.0s cubic-bezier(.16,1,.3,1) forwards
}
.bp-splash.ban{background:radial-gradient(circle at 50% 50%,rgba(232,64,87,.36),rgba(40,4,12,.6) 62%,transparent)}
.bp-splash.pick{background:radial-gradient(circle at 50% 50%,rgba(30,136,255,.36),rgba(4,18,46,.6) 62%,transparent)}
.bps-slash{
  position:absolute;top:50%;left:0;width:45%;height:140px;margin-top:-70px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:bpSlashSweep .95s cubic-bezier(.16,1,.3,1) forwards
}
.bps-beam{
  position:absolute;left:0;right:0;height:106px;
  animation:bpBeamExpand 1.0s cubic-bezier(.16,1,.3,1) forwards
}
.bp-splash.ban .bps-beam{
  background:linear-gradient(90deg,transparent 2%,rgba(176,18,44,.94) 20%,rgba(232,64,87,.98) 50%,rgba(176,18,44,.94) 80%,transparent 98%);
  border-top:2px solid #ff99a8;border-bottom:2px solid #ff99a8;
  box-shadow:0 0 54px rgba(232,64,87,.9),inset 0 0 28px rgba(255,190,200,.38)
}
.bp-splash.pick .bps-beam{
  background:linear-gradient(90deg,transparent 2%,rgba(12,68,148,.94) 20%,rgba(22,144,242,.98) 50%,rgba(12,68,148,.94) 80%,transparent 98%);
  border-top:2px solid var(--hex-gold);border-bottom:2px solid var(--hex-blue);
  box-shadow:0 0 54px rgba(24,148,255,.9),inset 0 0 28px rgba(10,200,185,.42)
}
.bps-core{
  position:relative;z-index:1;text-align:center;padding:10px 44px;
  animation:bpCorePop 1.0s cubic-bezier(.16,1,.3,1) forwards
}
.bps-sub{display:block;font-family:var(--num);font-size:13px;font-weight:800;letter-spacing:3px;color:var(--hex-gold-l);opacity:.92;margin-bottom:2px}
.bps-core b{font-size:clamp(24px,3.6vw,34px);color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.85);display:inline-flex;align-items:center;gap:8px}
/* Ban / Pick 锁定瞬时打击感反馈 */
.bp-lock-fx{
  position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:68;pointer-events:none;
  animation:bpLockBurst .45s cubic-bezier(.16,1,.3,1) forwards
}
.bp-lock-fx .blf-tag{
  display:inline-flex;align-items:center;gap:6px;padding:7px 20px;font-size:15px;font-weight:900;letter-spacing:1.2px;color:#fff;
  box-shadow:0 8px 28px rgba(0,0,0,.65)
}
.bp-lock-fx.ban .blf-tag{background:linear-gradient(90deg,#9e1329,#e84057,#9e1329);border:1px solid #ff9aa8}
.bp-lock-fx.pick .blf-tag{background:linear-gradient(90deg,#0c4b7a,#1892e6,#0c4b7a);border:1px solid var(--hex-gold)}
/* BP 极简状态点与侧栏默契小标 */
.st-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.st-dot.hot{background:#ff9447;box-shadow:0 0 6px #ff9447}
.st-dot.cold{background:#66a3ff;box-shadow:0 0 5px #66a3ff}
.st-dot.tilt{background:#ff4f67;box-shadow:0 0 6px #ff4f67}
.chem-mini{display:inline-flex;align-items:center;gap:2px;font-family:var(--num);font-size:12px;font-weight:800;padding:1px 5px;border:1px solid rgba(200,155,60,.4);background:rgba(1,10,19,.7);color:var(--hex-gold-l)}
.chem-mini .ico{width:11px;height:11px}
.chem-mini.c4{color:#4ade80;border-color:rgba(74,222,128,.5)}.chem-mini.c3{color:#2dd4bf;border-color:rgba(45,212,191,.45)}.chem-mini.c0{color:#ff7285;border-color:rgba(232,64,87,.5)}
/* 桌面端 BP 全屏单视口适配（全部塞入初始窗口框，不滚动外层页面） */
@media(min-width:1024px) and (min-height:600px){
  .match.hex.bp-fit{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:6px 12px 8px}
  .match.hex.bp-fit .mh-lol{padding:4px 12px;margin-bottom:6px;flex-shrink:0}
  .match.hex.bp-fit .mh-score{font-size:36px}
  .match.hex.bp-fit .ban-bar{margin-bottom:6px;flex-shrink:0}
  .match.hex.bp-fit .ban-side{padding:4px 6px}
  .match.hex.bp-fit .ban-slot{width:40px;height:40px}
  .match.hex.bp-fit .phase-banner{padding:5px 12px}
  .match.hex.bp-fit .pb-msg{font-size:15px}
  .match.hex.bp-fit #bp-clock-num{font-size:24px}
  /* 行高锁定为剩余高度，三栏各自内部滚动：内容再多也不会把按钮挤出屏幕外 */
  .match.hex.bp-fit .draft-lol{flex:1;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr)}
  .match.hex.bp-fit .hex-side{display:flex;flex-direction:column;padding:8px;overflow:hidden auto;min-height:0}
  .match.hex.bp-fit .side-head{padding-bottom:5px;margin-bottom:6px}
  .match.hex.bp-fit .pk-list{gap:5px;flex:1;justify-content:space-between}
  .match.hex.bp-fit .pk-slot{padding:5px 8px;gap:8px}
  .match.hex.bp-fit .pk-slot .c-ava.sm{width:40px;height:40px;font-size:13px}
  .match.hex.bp-fit .side-intel{margin-top:6px;padding-top:6px}
  .match.hex.bp-fit .hex-center{min-height:0;height:100%;padding:8px 10px;gap:6px;overflow:hidden}
  .match.hex.bp-fit .cgrid-lol{flex:1;min-height:0;max-height:none;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
  .match.hex.bp-fit .lock-dock{padding-top:6px;flex-shrink:0}
  .match.hex.bp-fit .ready-stage,.match.hex.bp-fit .result-stage{overflow-y:auto;overscroll-behavior:contain}
}
.hex-side.active-pick.blue{border-color:rgba(36,156,255,.85)}
.hex-center.stage-pick{border-color:rgba(36,156,255,.78);box-shadow:inset 0 0 32px rgba(24,132,255,.16)}
.phase-banner.is-pick{
  border-color:#3a9dff;
  background:linear-gradient(90deg,rgba(8,36,82,.92),rgba(18,88,184,.66) 50%,rgba(8,36,82,.92));
  box-shadow:inset 0 0 26px rgba(36,156,255,.32),0 0 18px rgba(24,132,255,.28)
}
.match.hex small,.match.hex .muted{color:var(--hex-mu)}
.match.hex .tt b{color:var(--hex-gold-l)}.match.hex .tt i{color:var(--hex-mu)}
.match.hex .tt.me b{color:#fff;text-shadow:0 0 12px rgba(200,155,60,.65)}

/* 顶部海克斯比分 HUD */
.mh-lol{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:8px 16px;margin-bottom:10px;
  background:linear-gradient(180deg,rgba(9,20,40,.92),rgba(4,12,24,.94));
  border:1px solid var(--hex-gold-d);border-top:2px solid var(--hex-gold);
  box-shadow:0 6px 24px rgba(0,0,0,.55)
}
.mh-team{display:flex;align-items:center;gap:16px}
.mh-team.left{justify-content:flex-start}
.mh-team.right{justify-content:flex-end}
.mh-tmeta{display:flex;flex-direction:column;gap:2px}
.mh-team.right .mh-tmeta{align-items:flex-end}
.side-mini{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.side-mini.blue{color:var(--hex-blue)}.side-mini.red{color:var(--hex-red)}
.mh-score{font-family:var(--num);font-size:clamp(38px,4.5vw,58px);font-weight:800;line-height:.95;color:#fff;min-width:34px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.mh-team.is-blue .mh-score{color:var(--hex-blue)}
.mh-team.is-red .mh-score{color:var(--hex-red)}
.mh-center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.mh-title{font-size:13px;font-weight:700;color:var(--hex-gold-l);letter-spacing:1px}
.ph-track{display:flex;gap:4px;align-items:center}
.ph-step{font-size:11px;padding:2px 9px;border:1px solid #2b3a4f;color:#6c7b8f;background:rgba(1,10,19,.6);font-weight:700;letter-spacing:.5px}
.ph-step.done{border-color:var(--hex-gold-d);color:var(--hex-gold);background:rgba(120,90,40,.18)}
.ph-step.cur.is-ban{border-color:var(--hex-red);color:#fff;background:var(--hex-red);box-shadow:0 0 12px rgba(232,64,87,.7)}
.ph-step.cur.is-pick{border-color:var(--hex-blue);color:#010a13;background:var(--hex-blue);box-shadow:0 0 12px rgba(10,200,185,.7)}
.fearless-row{margin-top:1px}
.fl-btn{background:rgba(116,58,196,.18);border:1px solid rgba(168,116,255,.45);color:#d7bcff;font:600 11px var(--sans);padding:2px 10px;cursor:pointer}
.fl-btn:hover,.fl-btn.on{background:rgba(116,58,196,.38);border-color:#c69eff;color:#fff}
.fl-drawer{background:rgba(18,12,34,.92);border:1px solid rgba(168,116,255,.4);padding:10px 14px;margin-bottom:10px}
.fl-drawer-hd{font-size:12px;color:#cfb0ff;margin-bottom:8px;font-weight:700}
.fl-chips{display:flex;flex-wrap:wrap;gap:6px}
.fl-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid rgba(168,116,255,.35);padding:2px 8px 2px 3px;font-size:12px;color:#eadbff}

/* 英雄头像组件（含离线海克斯首字降级） */
.c-ava{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h,210),42%,22%),hsl(var(--h,210),50%,10%));border:1px solid var(--hex-gold-d);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.c-ava img{width:100%;height:100%;object-fit:cover;display:block}
.c-ava .c-fb{width:100%;height:100%;align-items:center;justify-content:center;font-weight:900;color:var(--hex-gold-l);text-shadow:0 1px 4px rgba(0,0,0,.8);letter-spacing:1px;background:radial-gradient(circle at 30% 25%,hsl(var(--h,210),48%,32%),hsl(var(--h,210),55%,12%))}
.c-ava.empty{background:rgba(6,16,30,.75);border:1px dashed #2c3f59;color:#4a5f7a}
.c-ava.xs{width:22px;height:22px;font-size:10px}
.c-ava.sm{width:46px;height:46px;font-size:15px}
.c-ava.md{width:54px;height:54px;font-size:17px}
.c-ava.grid{width:100%;aspect-ratio:1/1;font-size:18px;border:none}
.c-ava.preview{opacity:.72;filter:saturate(1.2)}
.c-ava .role-ico{width:24px;height:24px;opacity:.55;display:flex;align-items:center;justify-content:center}
.c-ava .role-ico svg{width:100%;height:100%}

/* ===== 独立顶置 Ban 栏 + 中央阶段大横幅 ===== */
.ban-bar{
  display:grid;grid-template-columns:284px minmax(0,1fr) 284px;gap:12px;align-items:stretch;margin-bottom:10px
}
.ban-side{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;
  background:rgba(9,20,40,.88);border:1px solid #26364d;position:relative
}
.ban-side.blue{border-left:3px solid var(--hex-blue)}
.ban-side.red{border-right:3px solid var(--hex-red)}
.ban-side.turn-ban{border-color:var(--hex-red);background:rgba(58,12,24,.88);box-shadow:0 0 18px rgba(232,64,87,.35)}
.ban-grp{display:flex;gap:5px}
.ban-sep{width:2px;height:30px;background:var(--hex-gold-d);opacity:.7;display:inline-block}
.ban-slot{
  width:46px;height:46px;position:relative;overflow:hidden;
  background:rgba(1,10,19,.82);border:1px solid #2a3a50;
  display:flex;align-items:center;justify-content:center
}
.ban-slot.filled{border-color:#7d2635}
.ban-slot.filled .c-ava{width:100%;height:100%;border:none;filter:grayscale(.95) brightness(.48)}
.ban-slash{
  position:absolute;inset:-4px;pointer-events:none;
  background:linear-gradient(135deg,transparent 44%,#e84057 46%,#ff5970 50%,#e84057 54%,transparent 56%)
}
.ban-lbl{
  position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);
  font-size:9px;line-height:1.25;text-align:center;color:#f5cfd5;padding:1px 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.ban-empty{font-family:var(--num);font-size:13px;font-weight:700;color:#4e6078}
.ban-slot.pulsing{border:2px solid var(--hex-red);animation:hexPulseRed 1.3s infinite}
.ban-slot.pulsing .ban-empty{color:#ff7285;letter-spacing:.8px}

/* 中央阶段大横幅（Ban 红 vs Pick 金青） */
.phase-banner{
  display:grid;grid-template-columns:120px 1fr 78px;align-items:center;gap:10px;
  padding:8px 16px;border:1px solid var(--hex-gold-d);background:rgba(9,20,40,.92);
  position:relative;overflow:hidden
}
.phase-banner.is-ban{
  border-color:var(--hex-red);
  background:linear-gradient(90deg,rgba(110,16,32,.85),rgba(178,24,48,.48) 50%,rgba(110,16,32,.85));
  box-shadow:inset 0 0 24px rgba(232,64,87,.3),0 0 18px rgba(232,64,87,.25)
}
.phase-banner.is-pick{
  border-color:var(--hex-gold);
  background:linear-gradient(90deg,rgba(8,38,54,.9),rgba(14,72,92,.58) 50%,rgba(8,38,54,.9));
  box-shadow:inset 0 0 24px rgba(10,200,185,.22),0 0 16px rgba(200,155,60,.2)
}
.phase-banner.is-ready,.phase-banner.is-result{grid-template-columns:1fr;text-align:center;border-color:var(--hex-gold)}
.phase-banner.is-result.win{border-color:var(--hex-blue);background:linear-gradient(90deg,rgba(6,44,56,.9),rgba(10,200,185,.22),rgba(6,44,56,.9))}
.phase-banner.is-result.lose{border-color:var(--hex-red);background:linear-gradient(90deg,rgba(64,12,24,.9),rgba(232,64,87,.24),rgba(64,12,24,.9))}
.pb-dir{font-size:12px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.pb-dir.left{color:var(--hex-blue)}.pb-dir.right{color:#ff798b}
.pb-main{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pb-tag{font-size:11px;font-weight:900;letter-spacing:2px;padding:1px 10px;border-radius:1px}
.phase-banner.is-ban .pb-tag{background:var(--hex-red);color:#fff}
.phase-banner.is-pick .pb-tag{background:var(--hex-gold);color:#091428}
.phase-banner.is-ready .pb-tag{background:var(--hex-blue);color:#010a13}
.pb-msg{font-size:17px;color:#fff;letter-spacing:.6px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pb-clock{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#bp-clock-num{font-family:var(--num);font-size:28px;font-weight:800;line-height:.95;color:var(--hex-gold-l)}
#bp-clock-num.urgent{color:#ff586e}
.pb-level{font-size:11px;font-weight:700;letter-spacing:.8px;color:rgba(255,255,255,.7);white-space:nowrap}
.pb-clock-bar{width:100%;height:4px;background:rgba(255,255,255,.15);overflow:hidden}
#bp-clock-fill{display:block;height:100%;background:var(--hex-gold);transition:width .9s linear}
.phase-banner.is-ban #bp-clock-fill{background:var(--hex-red)}
.phase-banner.is-pick #bp-clock-fill{background:var(--hex-blue)}

/* ===== 三栏海克斯选人舞台 ===== */
.draft-lol{display:grid;grid-template-columns:284px minmax(0,1fr) 284px;gap:12px;align-items:start}

/* 左右两侧阵营面板 */
.hex-side{
  background:linear-gradient(180deg,rgba(9,20,40,.92),rgba(4,11,22,.96));
  border:1px solid #26364d;padding:10px;position:relative
}
.hex-side.blue{border-top:3px solid var(--hex-blue)}
.hex-side.red{border-top:3px solid var(--hex-red)}
.hex-side.active-ban{border-color:rgba(232,64,87,.7);box-shadow:0 0 18px rgba(232,64,87,.22)}
.hex-side.active-pick.blue{border-color:rgba(10,200,185,.75);box-shadow:0 0 20px rgba(10,200,185,.25)}
.hex-side.active-pick.red{border-color:rgba(232,64,87,.75);box-shadow:0 0 20px rgba(232,64,87,.25)}
.side-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid rgba(200,155,60,.25)}
.side-id{display:flex;gap:5px;align-items:center}
.side-badge{font-size:10px;font-weight:900;letter-spacing:.8px;padding:2px 6px}
.side-badge.blue{background:rgba(10,200,185,.18);color:var(--hex-blue);border:1px solid rgba(10,200,185,.5)}
.side-badge.red{background:rgba(232,64,87,.18);color:#ff7285;border:1px solid rgba(232,64,87,.5)}
.ord-badge{font-size:10px;color:var(--hex-gold);border:1px solid var(--hex-gold-d);padding:2px 5px}
.side-team{display:flex;align-items:center;gap:5px}.side-team .tt b{font-size:18px}
.me-pill{font-style:normal;font-size:10px;background:var(--hex-gold);color:#091428;font-weight:900;padding:1px 5px}

/* 5 个大号 Pick 槽位 */
.pk-list{display:flex;flex-direction:column;gap:7px}
.pk-slot{
  display:flex;align-items:center;gap:10px;padding:7px 9px;position:relative;
  background:rgba(13,28,51,.72);border:1px solid #22344d;border-left:3px solid #2a3f5c;
  transition:border-color .18s,background .18s,transform .15s
}
.hex-side.red .pk-slot{border-left:1px solid #22344d;border-right:3px solid #2a3f5c}
.hex-side.blue .pk-slot.locked{border-left-color:var(--hex-blue);background:linear-gradient(90deg,rgba(10,200,185,.15),rgba(13,28,51,.78))}
.hex-side.red .pk-slot.locked{border-right-color:var(--hex-red);background:linear-gradient(270deg,rgba(232,64,87,.16),rgba(13,28,51,.78))}
.pk-slot.picking{border-color:var(--hex-gold);animation:hexPulseGold 1.4s infinite;background:linear-gradient(90deg,rgba(200,155,60,.16),rgba(10,200,185,.14))}
.pk-slot.swappable{cursor:pointer}.pk-slot.swappable:hover{border-color:var(--hex-gold);background:rgba(200,155,60,.12)}
.pk-slot.swap-src{border:2px dashed var(--hex-gold)!important;background:rgba(200,155,60,.2)!important}
.pk-slot.swap-dst{border:1px dashed rgba(10,200,185,.7)}
.pk-ava-wrap{position:relative;flex-shrink:0}
.preview-tag{position:absolute;left:0;right:0;bottom:0;background:rgba(200,155,60,.92);color:#010a13;font-size:9px;font-weight:900;text-align:center;line-height:1.3}
.pk-meta{flex:1;min-width:0}
.pk-top{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.pk-role{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--hex-mu)}
.pk-role svg{width:13px;height:13px;color:var(--hex-gold)}
.pk-player{font-family:var(--num);font-size:16px;color:var(--hex-gold-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-ovr{margin-left:auto;font-family:var(--num);font-size:13px;font-weight:700;color:var(--hex-mu)}
.pk-bot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pk-champ{font-weight:800;font-size:15px;color:#fff}
.pk-champ.preview-txt{color:var(--hex-gold)}
.pk-waiting{font-size:12px;color:var(--hex-gold);font-weight:700}
.pk-idle{font-size:12px;color:#52647d}
.fit-badge{font-size:10px;font-weight:800;padding:1px 5px;border-radius:2px}
.fit-badge.sig{background:rgba(200,155,60,.25);color:#f4cf72;border:1px solid rgba(200,155,60,.65)}
.fit-badge.ok{background:rgba(10,200,185,.18);color:#65efe3;border:1px solid rgba(10,200,185,.45)}
.fit-badge.fam{background:rgba(140,165,195,.16);color:#c3d4ea;border:1px solid rgba(140,165,195,.4)}
.fit-badge.flex{background:rgba(168,116,255,.22);color:#e3ccff;border:1px solid rgba(168,116,255,.65)}
.fit-badge.low{background:rgba(232,64,87,.18);color:#ff8b9b;border:1px solid rgba(232,64,87,.45)}
.fit-badge.bad{background:#c21833;color:#fff;border:1px solid #ff6b80}
.swap-pill{position:absolute;bottom:4px;right:6px;background:var(--hex-gold);color:#091428;font-size:9px;font-weight:900;padding:1px 5px;pointer-events:none}

/* 侧栏底部实时阵容情报 */
.side-intel{margin-top:10px;padding-top:9px;border-top:1px solid rgba(200,155,60,.2);font-size:11px}
.intel-row{display:flex;justify-content:space-between;color:var(--hex-mu);margin-bottom:4px}
.c-ad{color:#f59e56}.c-ap{color:#56c2ff}
.dmg-bar{height:5px;display:flex;overflow:hidden;background:#0a1322;margin-bottom:7px}
.dmg-bar .ad{background:linear-gradient(90deg,#d96b27,#f59e56)}.dmg-bar .ap{background:linear-gradient(90deg,#2575fc,#56c2ff)}
.intel-tags{display:flex;flex-wrap:wrap;gap:4px}
.style-chip{background:rgba(200,155,60,.18);border:1px solid var(--hex-gold-d);color:var(--hex-gold-l);padding:1px 6px;font-weight:700}
.note-chip{background:rgba(255,255,255,.06);border:1px solid #2b3c54;color:#c3cedc;padding:1px 6px}
.note-chip.warn{background:rgba(232,64,87,.2);border-color:rgba(232,64,87,.6);color:#ff9ba8}
.swap-hint{margin-top:7px;font-size:11px;color:var(--hex-gold);opacity:.9}

/* ===== 中央海克斯英雄池与锁定台 ===== */
.hex-center{
  background:linear-gradient(180deg,rgba(9,20,40,.92),rgba(4,12,24,.96));
  border:1px solid var(--hex-gold-d);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:540px
}
.hex-center.stage-ban{border-color:rgba(232,64,87,.72);box-shadow:inset 0 0 28px rgba(232,64,87,.1)}
.hex-center.stage-pick{border-color:rgba(200,155,60,.75);box-shadow:inset 0 0 28px rgba(10,200,185,.08)}

/* 教练推荐条 */
.coach-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;background:rgba(1,10,19,.62);border:1px solid rgba(200,155,60,.3)}
.coach-lbl{font-size:11px;font-weight:800;color:var(--hex-gold);white-space:nowrap}
.coach-list{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.coach-chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;cursor:pointer;
  background:rgba(15,32,58,.9);border:1px solid #2c4363;color:var(--hex-gold-l);font:600 12px var(--sans);text-align:left
}
.coach-chip:hover,.coach-chip.sel{border-color:var(--hex-gold);background:rgba(200,155,60,.2)}
.coach-chip small{display:block;font-size:10px;color:var(--hex-mu);line-height:1.1}

/* 位置图标筛选 + 搜索 */
.pool-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.role-tabs{display:flex;gap:4px;flex-wrap:wrap}
.rtab{
  display:inline-flex;align-items:center;gap:4px;padding:5px 10px;cursor:pointer;
  background:rgba(4,12,24,.8);border:1px solid #263954;color:var(--hex-mu);font:600 12px var(--sans)
}
.rtab svg{width:15px;height:15px}
.rtab:hover{border-color:var(--hex-gold-d);color:var(--hex-gold-l)}
.rtab.on{background:rgba(200,155,60,.22);border-color:var(--hex-gold);color:#fff}
.pool-search{display:flex;align-items:center;gap:8px}
.avail-chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--hex-mu);cursor:pointer;white-space:nowrap}
.avail-chk input{min-height:auto;accent-color:var(--hex-gold)}
.match.hex input[data-d=q]{background:#040d1a;color:var(--hex-gold-l);border:1px solid #2a405e;padding:5px 10px;min-height:32px;font-size:13px;width:165px}
.match.hex input[data-d=q]:focus{border-color:var(--hex-gold)}
.fallback-tip{background:rgba(232,64,87,.2);border:1px solid var(--hex-red);color:#ffc2ca;padding:6px 10px;font-size:12px;font-weight:700}

/* 英雄头像网格 */
.cgrid-lol{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;
  max-height:368px;overflow-y:auto;padding:4px 4px 6px 2px;
  scrollbar-width:thin;scrollbar-color:var(--hex-gold-d) #040d1a
}
.ch-card{
  cursor:pointer;background:#071324;border:1px solid #22354f;padding:2px;
  transition:transform .12s,border-color .15s,box-shadow .15s;user-select:none
}
.ch-card.my-prof{border-color:rgba(200,155,60,.62);box-shadow:inset 0 0 10px rgba(200,155,60,.16)}
.ch-card:hover:not(.dis){border-color:var(--hex-gold);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.ch-card.dis{opacity:.28;cursor:not-allowed;filter:grayscale(.9)}
.ch-thumb{position:relative;overflow:hidden;border:1px solid rgba(200,155,60,.25)}
.ch-name{font-size:11px;font-weight:700;text-align:center;color:var(--hex-gold-l);padding:3px 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 卡片角标（同时展示本方 👑招牌 / ◆精通 / ✦熟练） */
.meta-dot{position:absolute;top:2px;right:2px;font-size:10px;line-height:1;padding:1px 3px;background:rgba(1,10,19,.85);border-radius:2px}
.meta-dot.t1{color:var(--hex-blue);font-weight:900}
.sig-dot{position:absolute;top:2px;left:2px;font-size:10px;line-height:1;padding:2px 3px;background:rgba(1,10,19,.88);border-radius:2px;font-weight:900}
.sig-dot.mine{color:#ffd86b;border:1px solid rgba(244,207,114,.55)}
.sig-dot.mine.mas{color:#5ef2e4;border-color:rgba(10,200,185,.55)}
.sig-dot.mine.pro{color:#bdd6ff;border-color:rgba(130,175,255,.45)}
.sig-dot.opp{color:#ff6b7d;border:1px solid rgba(232,64,87,.5)}
.sig-dot.opp.shift{left:21px}
.c-stamp{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:900;text-align:center;padding:1px 0;letter-spacing:.5px}
.c-stamp.fl{background:rgba(124,58,237,.92);color:#f3e8ff}
.c-stamp.bn{background:rgba(194,24,51,.92);color:#ffd5dc}
.c-stamp.pk{background:rgba(15,35,62,.92);color:#9cc2e6}

/* 英雄卡 Ban / Pick 选中遮罩强烈对比 */
.ch-card.sel-ban{border:2px solid var(--hex-red);box-shadow:0 0 16px rgba(232,64,87,.85);background:#2e0a14}
.ch-card.sel-pick{border:2px solid var(--hex-gold);box-shadow:0 0 16px rgba(200,155,60,.85),0 0 8px rgba(10,200,185,.6);background:#0c2d3f}
.sel-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:18px;font-weight:900;letter-spacing:2px}
.sel-overlay.ban{
  background:linear-gradient(135deg,rgba(232,64,87,.45),rgba(130,12,30,.72));
  color:#fff;text-shadow:0 1px 6px #000
}
.sel-overlay.ban::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 46%,#ff5970 48%,#ff5970 52%,transparent 54%);opacity:.85}
.sel-overlay.ban span{position:relative;z-index:1;background:rgba(160,15,38,.9);padding:0 5px;border:1px solid #ff8b9b}
.sel-overlay.pick{
  background:radial-gradient(circle,rgba(10,200,185,.18),rgba(200,155,60,.45));
  color:#fff;text-shadow:0 1px 6px #000
}
.sel-overlay.pick span{background:rgba(9,20,40,.86);color:var(--hex-gold);padding:0 5px;border:1px solid var(--hex-gold)}

/* 底部海克斯锁定台 */
.lock-dock{
  margin-top:auto;padding-top:10px;border-top:1px solid rgba(200,155,60,.3);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap
}
.dock-empty{font-size:13px;color:var(--hex-mu)}
.dock-sel{display:flex;align-items:center;gap:10px;flex:1;min-width:210px}
.dock-name{font-size:15px;color:#fff}.dock-name small{margin-left:4px;font-size:11px}
.dock-fit{font-size:12px;color:var(--hex-gold);margin-top:2px}
.dock-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.dbadge{font-size:11px;padding:2px 7px;border:1px solid #2b4260;background:rgba(1,10,19,.75);color:var(--hex-gold-l)}
.dbadge.t0{border-color:rgba(255,120,60,.65);color:#ffb38a;background:rgba(120,38,12,.35)}
.dbadge.t1{border-color:rgba(10,200,185,.5);color:#7bf2e7}
.dbadge.mine{border-color:rgba(200,155,60,.75);color:#f7d77e;background:rgba(120,90,20,.3)}
.dbadge.opp{border-color:rgba(232,64,87,.7);color:#ff9ba8;background:rgba(120,16,32,.35)}

/* 桌面端英雄悬停海克斯情报浮层 */
.ch-tip{
  position:fixed;z-index:60;pointer-events:none;width:255px;padding:10px 12px;
  background:linear-gradient(180deg,rgba(9,20,40,.98),rgba(2,10,20,.98));
  border:1px solid var(--hex-gold);box-shadow:0 12px 32px rgba(0,0,0,.8);color:var(--hex-gold-l)
}
.ct-hd{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid rgba(200,155,60,.28);padding-bottom:5px;margin-bottom:6px}
.ct-hd b{font-size:15px;color:#fff}.ct-hd small{font-size:11px;color:var(--hex-mu)}
.ct-meta{font-size:11px;color:#9db2cc;margin-bottom:6px}
.ct-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
.ct-list li{display:flex;align-items:baseline;gap:5px;line-height:1.35}
.ct-list li.t0{color:#ffb38a}.ct-list li.t1{color:#7bf2e7}.ct-list li.mine{color:#f7d77e}.ct-list li.opp{color:#ff9ba8}
.ct-none{font-size:11px;color:var(--hex-mu)}

/* ===== 赛前峡谷 1v1 SOLO 选边赛 ===== */
.hex-panel.solo-panel,.hex-panel.solo-watch-panel{
  max-width:960px;margin:20px auto;padding:24px;
  background:linear-gradient(180deg,rgba(9,20,40,.95),rgba(3,10,20,.98));
  border:1px solid var(--hex-gold-d);border-top:3px solid var(--hex-gold);
  box-shadow:0 18px 50px rgba(0,0,0,.65)
}
.solo-panel{text-align:center}.solo-panel h2{margin:0 0 8px;color:#fff;font-size:25px}
.solo-setup{display:grid;grid-template-columns:270px 1fr;gap:16px;text-align:left;margin-top:16px}
.solo-box{background:rgba(1,10,19,.55);border:1px solid #22354f;padding:14px}
.solo-box h4{margin:0 0 10px;font-size:13px;color:var(--hex-gold)}
.solo-players{display:flex;flex-direction:column;gap:7px}
.sp-btn{
  display:flex;align-items:center;justify-content:space-between;padding:8px 11px;cursor:pointer;
  background:rgba(13,28,51,.85);border:1px solid #2a3f5c;color:var(--hex-gold-l);font-family:var(--sans)
}
.sp-btn .sp-r{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--hex-mu)}
.sp-btn .sp-r svg{width:14px;height:14px;color:var(--hex-gold)}
.sp-btn b{font-family:var(--num);font-size:17px}
.sp-btn:hover{border-color:var(--hex-gold)}.sp-btn.on{border-color:var(--hex-blue);background:rgba(10,200,185,.18);color:#fff}
.solo-champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;max-height:260px;overflow-y:auto}
.sc-btn{
  display:flex;align-items:center;gap:7px;padding:6px 8px;cursor:pointer;text-align:left;
  background:rgba(13,28,51,.82);border:1px solid #263b57;color:var(--hex-gold-l);font:600 12px var(--sans)
}
.sc-btn:hover{border-color:var(--hex-gold)}.sc-btn.on{border-color:var(--hex-gold);background:rgba(200,155,60,.25);color:#fff}
.solo-go-row{margin-top:20px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}

/* 1v1 观战界面 */
.solo-watch-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.speed-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sp-lbl{font-size:12px;color:var(--hex-mu)}
.spd-btn{
  background:rgba(13,28,51,.9);border:1px solid #354d6e;color:var(--hex-gold-l);
  padding:4px 11px;font:700 12px var(--sans);cursor:pointer
}
.spd-btn.on{background:var(--hex-gold);color:#091428;border-color:var(--hex-gold)}
.spd-btn.skip{border-color:var(--hex-blue);color:var(--hex-blue)}.spd-btn.skip:hover{background:rgba(10,200,185,.2);color:#fff}
.solo-done-tag{font-size:12px;font-weight:800;color:var(--hex-blue);border:1px solid rgba(10,200,185,.5);padding:3px 10px;background:rgba(10,200,185,.12)}
.solo-arena{display:grid;grid-template-columns:1fr 140px 1fr;gap:14px;align-items:center;margin-bottom:14px}
.solo-fighter{padding:14px;background:rgba(1,10,19,.68);border:1px solid #263b57}
.solo-fighter.left{border-left:3px solid var(--hex-blue)}.solo-fighter.right{border-right:3px solid var(--hex-red)}
.solo-fighter.winner{border-color:var(--hex-gold);box-shadow:0 0 22px rgba(200,155,60,.35)}
.solo-fighter.loser{opacity:.65}
.sf-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sf-team{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sf-name{font-size:15px;color:#fff}.sf-name b{font-family:var(--num);font-size:19px;margin-right:3px}
.sf-role{font-size:11px;color:var(--hex-mu)}
.sf-bar-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--hex-mu);margin-bottom:4px}
.sf-bar{height:10px;background:#0a1524;border:1px solid #253852;overflow:hidden}
.sf-bar .hp{display:block;height:100%;transition:width .35s ease}
.sf-bar .hp.hi{background:linear-gradient(90deg,#16a34a,#4ade80)}
.sf-bar .hp.mid{background:linear-gradient(90deg,#d97706,#fbbf24)}
.sf-bar .hp.lo{background:linear-gradient(90deg,#be123c,#fb7185)}
.sf-substats{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--hex-gold-l)}
.sf-substats b{font-family:var(--num);font-size:15px;color:#fff}
.solo-clock-box{text-align:center;padding:12px 8px;background:rgba(1,10,19,.75);border:1px solid var(--hex-gold-d)}
.solo-time{font-family:var(--num);font-size:32px;font-weight:800;color:#fff;line-height:1}
.solo-vs{font-family:var(--num);font-size:15px;font-weight:800;color:var(--hex-gold);margin:4px 0}
.solo-event-pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;background:rgba(200,155,60,.2);border:1px solid var(--hex-gold-d);color:var(--hex-gold-l)}
.solo-feed{max-height:220px;overflow-y:auto;background:rgba(1,10,19,.62);border:1px solid #20324a;padding:10px;display:flex;flex-direction:column;gap:6px}
.solo-line{display:flex;align-items:baseline;gap:8px;padding:6px 9px;font-size:13px;background:rgba(255,255,255,.02);border-left:3px solid #354c6b;color:#c9c3b6}
.solo-line.sa{border-left-color:var(--hex-blue)}.solo-line.sb{border-left-color:var(--hex-red)}
.solo-line.latest{background:rgba(200,155,60,.14);color:#fff;font-weight:600}
.sl-t{font-family:var(--num);font-size:14px;color:var(--hex-gold);min-width:38px}
.sl-tag{font-size:10px;font-weight:800;padding:1px 6px;background:rgba(255,255,255,.08);color:var(--hex-gold-l);white-space:nowrap}
.solo-result-bar{margin-top:16px;padding-top:16px;border-top:1px solid rgba(200,155,60,.3);text-align:center}
.solo-result-bar h3{margin:0 0 8px;color:var(--hex-gold-l);font-size:18px}
@media(max-width:780px){.solo-setup,.solo-arena{grid-template-columns:1fr}}
.rolesel-lol{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap;font-size:11px;color:var(--hex-mu)}
.rs-btn{background:#091428;border:1px solid #354e70;color:var(--hex-gold-l);padding:2px 8px;font:700 11px var(--sans);cursor:pointer}
.rs-btn.on{background:var(--hex-gold);color:#091428;border-color:var(--hex-gold)}
.dock-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dock-sub-btns{display:flex;gap:6px;flex-wrap:wrap}

/* LoL 经典海克斯斜切锁定按钮（Ban 猩红 vs Pick 青金） */
.lock-btn{
  padding:11px 28px;min-height:46px;font:900 16px var(--sans);letter-spacing:1.2px;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  transition:transform .12s,filter .15s,box-shadow .15s;border:2px solid transparent
}
.lock-btn:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.7)}
.lock-btn.is-ban{
  background:linear-gradient(180deg,#d92b46 0%,#8f1125 100%);
  color:#fff;border-color:#ff7b8e;box-shadow:0 0 20px rgba(232,64,87,.55)
}
.lock-btn.is-ban:hover:not(:disabled){filter:brightness(1.14);transform:scale(1.02)}
.lock-btn.is-pick{
  background:linear-gradient(180deg,#118596 0%,#094657 100%);
  color:#f0e6d2;border-color:var(--hex-gold);box-shadow:0 0 20px rgba(10,200,185,.45)
}
.lock-btn.is-pick:hover:not(:disabled){background:linear-gradient(180deg,#16a8bc 0%,#0b5d72 100%);color:#fff;transform:scale(1.02)}
.lock-btn.big-go{padding:14px 36px;font-size:18px}
.ai-wait-pill{padding:9px 20px;border:1px solid var(--hex-gold-d);background:rgba(200,155,60,.1);color:var(--hex-gold);font-weight:700;font-size:13px}
.hex-btn{background:rgba(15,32,58,.9);color:var(--hex-gold-l);border:1px solid var(--hex-gold-d);padding:7px 14px;font:700 13px var(--sans);cursor:pointer}
.hex-btn:hover{border-color:var(--hex-gold);color:#fff;background:rgba(200,155,60,.2)}
.hex-btn.sm{padding:4px 10px;font-size:12px}
.hex-btn.ghost{background:transparent;border-color:#324663;color:var(--hex-mu)}
.hex-btn.ghost:hover{border-color:var(--hex-gold-l);color:#fff}

/* ===== 选边界面（2026 先手选择权） ===== */
.hex-panel.choose-panel{
  max-width:860px;margin:28px auto;padding:28px;text-align:center;
  background:linear-gradient(180deg,rgba(9,20,40,.95),rgba(3,10,20,.98));
  border:1px solid var(--hex-gold-d);border-top:3px solid var(--hex-gold);
  box-shadow:0 16px 48px rgba(0,0,0,.6)
}
.hex-eyebrow{font-size:12px;letter-spacing:2px;color:var(--hex-gold);font-weight:800;margin-bottom:6px}
.choose-panel h2{margin:0 0 8px;font-size:26px;color:#fff}
.hex-sub{color:var(--hex-mu);font-size:13px;margin:0 0 18px}
.choose-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.choose-group{background:rgba(1,10,19,.55);border:1px solid #22354f;padding:16px}
.choose-group h4{margin:0 0 12px;font-size:13px;color:var(--hex-gold-l)}
.choose-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose-cards.single{max-width:480px;margin:0 auto}
.hex-choice{
  padding:16px 12px;cursor:pointer;text-align:center;border:1px solid var(--hex-gold-d);
  background:rgba(13,28,51,.85);color:#fff;font-family:var(--sans);transition:transform .12s,box-shadow .15s
}
.hex-choice b{display:block;font-size:17px;margin-bottom:4px}
.hex-choice small{display:block;font-size:11px;color:var(--hex-mu)}
.hex-choice:hover{transform:translateY(-2px)}
.hex-choice.blue{border-color:var(--hex-blue);background:linear-gradient(180deg,rgba(10,200,185,.22),rgba(7,26,46,.92))}
.hex-choice.blue:hover{box-shadow:0 0 20px rgba(10,200,185,.45)}
.hex-choice.red{border-color:var(--hex-red);background:linear-gradient(180deg,rgba(232,64,87,.22),rgba(38,10,20,.92))}
.hex-choice.red:hover{box-shadow:0 0 20px rgba(232,64,87,.45)}
.hex-choice.gold{border-color:var(--hex-gold);background:linear-gradient(180deg,rgba(200,155,60,.24),rgba(28,22,12,.92))}
.hex-choice.gold:hover{box-shadow:0 0 20px rgba(200,155,60,.45)}
.hex-choice.dark{border-color:#4b6282;background:rgba(12,24,42,.9)}
.hex-choice.dark:hover{border-color:var(--hex-gold-l)}
.choose-foot{margin-top:20px}

/* ===== Ready 赛前深度分析 & Result 战报 ===== */
.ready-stage{align-items:center;text-align:center;padding:22px 18px}
.ready-stage h3{margin:0;font-size:22px;color:var(--hex-gold-l);letter-spacing:1px}
.prob-box{width:100%;max-width:540px}
.prob-lbls{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14px}
.prob-lbls .bl{color:var(--hex-blue)}.prob-lbls .rd{color:var(--hex-red)}
.prob-lbls b{font-family:var(--num);font-size:24px}
.prob-track{height:12px;display:flex;overflow:hidden;border:1px solid var(--hex-gold-d);background:#040d1a}
.prob-track .bl{background:linear-gradient(90deg,#1e78ff,#0ac8b9)}.prob-track .rd{background:linear-gradient(90deg,#e84057,#9e182d)}
.ready-compare{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:100%;max-width:600px;margin:4px 0}
.rc-card{padding:10px 12px;border:1px solid #263a56;background:rgba(1,10,19,.6);text-align:left}
.rc-card.blue{border-left:3px solid var(--hex-blue)}.rc-card.red{border-right:3px solid var(--hex-red);text-align:right}
.rc-card h4{margin:0 0 4px;font-size:14px;color:#fff}.rc-card p{margin:0;font-size:12px;color:var(--hex-mu)}
.rc-vs{font-size:12px;font-weight:800;color:var(--hex-gold);padding:4px 8px;border:1px solid var(--hex-gold-d);background:rgba(200,155,60,.12)}
.curve-box{width:100%;max-width:540px;display:flex;flex-direction:column;gap:7px;padding:10px 14px;background:rgba(1,10,19,.55);border:1px solid #22354f}
.curve-row{display:grid;grid-template-columns:125px 1fr 78px;align-items:center;gap:10px;font-size:12px;color:var(--hex-mu)}
.curve-row span:first-child{text-align:left;color:var(--hex-gold-l)}.curve-row span:last-child{font-family:var(--num);font-size:13px;text-align:right}
.curve-bar{height:7px;display:flex;overflow:hidden;background:#091428}.curve-bar .bl{background:var(--hex-blue)}.curve-bar .rd{background:var(--hex-red)}
/* 赛前 BP 复盘 */
.bp-review{width:100%;max-width:760px;text-align:left;padding:10px 14px;background:rgba(1,10,19,.55);border:1px solid #22354f}
.bp-review h4{margin:0 0 8px;font-size:15px;color:var(--hex-gold-l)}.bp-review h4 small{font-size:11px;color:var(--hex-mu);font-weight:400;margin-left:6px}
.rv-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:10px}
.rc-chips .fb-chip,.rv-why .fb-chip{white-space:normal;line-height:16px;padding:1px 6px}
.rv-box{padding:7px 9px;border:1px solid #263a56;background:rgba(4,14,28,.7);font-size:12px;color:#cdd6e0}
.rv-box>b{display:block;font-size:12px;margin-bottom:3px}.rv-box.good>b{color:#9bf5ed}.rv-box.bad>b{color:#ff9ba8}.rv-box.hurt>b{color:var(--hex-gold)}
.rv-box ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}.rv-box li{line-height:1.45}.rv-box li b{color:#fff}
.rv-box .rv-none{list-style:none;margin-left:-16px;color:var(--hex-mu)}
.rv-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.rv-row{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border:1px solid #1c2c44;border-left:3px solid #4b6282;background:rgba(3,12,24,.65)}
.rv-row.g-good{border-left-color:#0ac8b9}.rv-row.g-bad{border-left-color:#e84057}.rv-row.g-ok{border-left-color:#c89b3c}
.rv-row .c-ava.sm{width:36px;height:36px;flex-shrink:0}
.rv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rv-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12px;color:var(--hex-mu)}
.rv-top b{color:#fff;font-size:13px}.rv-top em{font-style:normal;color:var(--hex-gold-l)}
.rv-lbl{font-size:11px;padding:0 5px;border:1px solid #33496a;color:#9fb3c8}.rv-row.is-ban .rv-lbl{border-color:rgba(232,64,87,.5);color:#ff9ba8}
.rv-grade{font-weight:800;font-size:12px}.g-good .rv-grade{color:#0ac8b9}.g-ok .rv-grade{color:#c89b3c}.g-bad .rv-grade{color:#e84057}
.rv-num{font-family:var(--num);font-size:12px}.rv-gap{margin-left:auto;font-size:11px}
.rv-why{display:flex;flex-wrap:wrap;gap:3px}
.rv-better{font-size:12px;color:#f0e6d2;padding:3px 7px;background:rgba(200,155,60,.1);border:1px dashed rgba(200,155,60,.45)}.rv-better b{color:var(--hex-gold-l)}
@media (max-width:760px){.rv-gap{margin-left:0}}
.ready-actions{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:10px}
/* 赛后结算/赛前确认的操作按钮吸底：无论屏幕多矮、内容多长，“确认/下一局”始终在可视区内可点 */
.result-stage .ready-actions,.ready-stage .ready-actions{position:sticky;bottom:0;z-index:5;align-self:stretch;margin-top:auto;padding:12px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(4,12,24,0) 0,rgba(4,12,24,.97) 12px,#040c18);flex-shrink:0}
.ready-actions .hex-btn.ghost{background:#0b1a2e}
.result-stage .ready-actions{flex-direction:row;flex-wrap:wrap;justify-content:center}
.result-stage .ready-actions .series-fin{flex-basis:100%;text-align:center}

/* 赛果与关键时间轴 */
.result-stage{padding:14px}
.res-hero{text-align:center;padding:12px;border:1px solid var(--hex-gold-d);background:rgba(1,10,19,.6)}
.res-hero.win{border-color:var(--hex-blue);background:linear-gradient(180deg,rgba(10,200,185,.18),rgba(1,10,19,.75))}
.res-hero.lose{border-color:var(--hex-red);background:linear-gradient(180deg,rgba(232,64,87,.2),rgba(1,10,19,.75))}
.res-hero h2{margin:0 0 8px;font-family:var(--num);font-size:34px;letter-spacing:2px}
.res-hero.win h2{color:var(--hex-blue)}.res-hero.lose h2{color:#ff6b7d}
.res-objs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--hex-gold-l)}
.res-objs span{background:rgba(255,255,255,.06);padding:2px 8px;border:1px solid rgba(200,155,60,.25)}
.res-tables{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res-team{background:rgba(1,10,19,.55);border:1px solid #243650;padding:8px}
.res-team.blue{border-top:2px solid var(--hex-blue)}.res-team.red{border-top:2px solid var(--hex-red)}
.res-th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:800;color:var(--hex-mu)}
.hex-tbl{width:100%;border-collapse:collapse;font-size:12px}
.hex-tbl th{color:var(--hex-mu);font-weight:600;text-align:left;padding:4px;border-bottom:1px solid rgba(200,155,60,.3);font-size:11px}
.hex-tbl td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.06);color:var(--hex-gold-l)}
.hex-tbl tr.is-mvp td{background:rgba(200,155,60,.14)}
.td-ch{display:flex;align-items:center;gap:5px}
.td-kda{font-family:var(--num);font-size:14px;font-weight:700;letter-spacing:.4px}
.mvp-b{background:var(--hex-gold);color:#091428;font-size:9px;font-weight:900;padding:0 4px;border-radius:2px}

.timeline-box{background:rgba(1,10,19,.6);border:1px solid #243854;padding:10px 12px}
.timeline-box h4{margin:0 0 8px;font-size:13px;color:var(--hex-gold)}
.ev-timeline{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.ev-timeline li{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:4px 8px;border-left:3px solid #3a4f6b;background:rgba(255,255,255,.03)}
.ev-timeline li.blue{border-left-color:var(--hex-blue)}.ev-timeline li.red{border-left-color:var(--hex-red)}
.ev-t{font-family:var(--num);font-size:13px;font-weight:700;color:var(--hex-gold);min-width:36px}
.ev-tag{font-size:10px;font-weight:800;padding:1px 5px;background:rgba(200,155,60,.18);color:var(--hex-gold-l);white-space:nowrap}
.ev-txt{color:#e6e0d2}
.impact-box{display:flex;flex-wrap:wrap;gap:6px}
.imp-chip{background:rgba(10,200,185,.14);border:1px solid rgba(10,200,185,.45);color:#9bf5ed;font-size:12px;padding:3px 9px}
.series-fin{font-size:18px;font-weight:800;color:var(--hex-gold-l)}.series-fin b{font-family:var(--num);font-size:26px;color:#fff;margin:0 6px}

/* 响应式适配 */
@media(max-width:1120px){
  .ban-bar,.draft-lol{grid-template-columns:236px minmax(0,1fr) 236px;gap:8px}
  .ban-slot{width:38px;height:38px}
  .c-ava.md{width:44px;height:44px}
}
@media(max-width:920px){
  .ban-bar,.draft-lol,.res-tables,.choose-grid,.ready-compare{grid-template-columns:1fr}
  .phase-banner{grid-template-columns:1fr;text-align:center}
  .pb-clock{align-items:center}
  .lineup{grid-template-columns:repeat(2,minmax(0,1fr))}.slot{border-bottom:1px solid var(--ln2)}
}
@media(max-width:600px){.hinfo{gap:12px}.vs{gap:8px}.card{padding:14px}.tbl{font-size:13px}.cgrid-lol{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 实时观战：5v5 召唤师峡谷（海克斯职业赛事 OB 风 + 桌面端一屏全览） ===== */
.match.hex.mode-live{background:radial-gradient(ellipse at 50% 0%,#0d2238 0%,#050f1e 50%,#010a13 100%)}
.watch5{position:relative;max-width:1460px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.w5-score{
  display:flex;flex-direction:column;gap:5px;padding:6px 12px;
  background:linear-gradient(180deg,rgba(9,20,40,.97),rgba(2,11,22,.97));
  border:1px solid var(--hex-gold-d);border-top:2px solid var(--hex-gold)
}
.w5-ob-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.w5-tm{display:flex;align-items:center;gap:10px;min-width:0}
.w5-tm.blue{justify-content:flex-start}.w5-tm.red{justify-content:flex-end}
.w5-tn{font-size:16px;color:#fff;letter-spacing:.6px;white-space:nowrap}
.w5-tm.blue .w5-tn{border-left:3px solid var(--hex-blue);padding-left:7px}.w5-tm.red .w5-tn{border-right:3px solid var(--hex-red);padding-right:7px}
.w5-res{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.w5-k{font-family:var(--num);font-size:32px;font-weight:800;line-height:1;color:#fff;min-width:34px;text-align:center}
.w5-tm.blue .w5-k{color:#8ff3ea;margin-left:auto}.w5-tm.red .w5-k{color:#ffb3bf;margin-right:auto}
.w5-st{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-size:16px;font-weight:700;color:#b8c4d4;padding:1px 6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.w5-st.lead{color:#fff;border-color:rgba(200,155,60,.6);background:rgba(200,155,60,.14)}
.w5-st b{font-weight:800}
.w5-dk{display:inline-flex;gap:4px;align-items:center}
.w5-dk .dk{width:10px;height:10px;transform:rotate(45deg);background:var(--c);border:1px solid rgba(0,0,0,.65);display:inline-block}
.w5-dk .dk.emp{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
.w5-dk .soul{font-size:10px;font-weight:800;color:#ffd27a;margin-left:2px;padding:0 4px;border:1px solid rgba(200,155,60,.5)}
.bf{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:1px 6px;border:1px solid}
.bf.bar{color:#d3b2ff;border-color:#7d4bd6;background:rgba(125,75,214,.25)}
.bf.eld{color:#ffe7a3;border-color:#b89545;background:rgba(184,149,69,.25)}
.w5-clock{font-family:var(--num);font-size:26px;font-weight:800;color:#fff;padding:2px 14px;background:#010a13;border:1px solid var(--hex-gold-d);letter-spacing:1px}
/* 双方经济与资源优势对比进度条 */
.w5-ob-adv{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.w5-tug{flex:1;min-width:140px;height:6px;display:flex;overflow:hidden;background:#0a1524;border:1px solid rgba(200,155,60,.3)}
.w5-tug .bl{background:linear-gradient(90deg,#1a72ff,#0ac8b9);transition:width .3s ease}
.w5-tug .rd{background:linear-gradient(90deg,#e84057,#9e182d);transition:width .3s ease}
.w5-adv-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.adv-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#c3cedc}
.adv-chip.blue{border-color:rgba(10,200,185,.55);color:#7bf2e7;background:rgba(10,200,185,.12)}
.adv-chip.red{border-color:rgba(232,64,87,.55);color:#ff9ba8;background:rgba(232,64,87,.14)}
.adv-chip.even{color:var(--hex-mu)}
.w5-mtabs{display:none}
/* 主舞台：小地图大幅扩容占主导，右侧紧凑侧栏容纳十人数据+精简事件播报 */
.w5-main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:10px;align-items:stretch}
.w5-mapcell{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.w5-mapbox{position:relative;aspect-ratio:1/1;width:100%;max-width:min(76vh,740px);flex-shrink:0;background:#010a13;border:1px solid var(--hex-gold-d);box-shadow:0 8px 28px rgba(0,0,0,.55)}
#w5-map{width:100%;height:100%;display:block;touch-action:manipulation}
.w5-goldcv{position:absolute;left:8px;bottom:8px;width:40%;height:58px;border:1px solid rgba(200,155,60,.45);pointer-events:none}
.w5-banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle,rgba(1,10,19,.82),rgba(1,10,19,.45));animation:wban .45s ease}
.w5-banner b{font-family:var(--num);font-size:46px;letter-spacing:6px;color:var(--hex-gold);text-shadow:0 0 22px rgba(200,155,60,.7)}
.w5-banner span{font-size:16px;color:#fff}
@keyframes wban{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
.w5-side{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.w5-feed-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(1,10,19,.78);border:1px solid #20324a}
.w5-feed-hd{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--hex-gold);padding:4px 8px;border-bottom:1px solid rgba(200,155,60,.22);background:rgba(9,20,40,.8);flex-shrink:0}
.w5-feed{flex:1;min-height:0;padding:6px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.w5-fl{display:grid;grid-template-columns:38px auto 1fr;gap:5px;align-items:baseline;font-size:12px;padding:4px 6px;border-left:3px solid #354c6b;background:rgba(255,255,255,.02);color:#c9c3b6}
.w5-fl.b{border-left-color:var(--hex-blue)}.w5-fl.r{border-left-color:var(--hex-red)}
.w5-fl.hl{background:rgba(200,155,60,.1);color:#f0e6d2}
.w5-fl.new{animation:wfl .5s ease}
.w5-fl .t{font-family:var(--num);color:var(--hex-mu)}
.w5-fl .tx:only-child{grid-column:1/-1}
.w5-fl .tg{font-size:10px;font-weight:800;padding:0 5px;color:#091428;background:var(--hex-gold);white-space:nowrap}
.w5-fl.b .tg{background:var(--hex-blue)}.w5-fl.r .tg{background:var(--hex-red);color:#fff}
@keyframes wfl{from{background:rgba(200,155,60,.35)}}
.w5-players{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0}
.w5-pcol{background:rgba(1,10,19,.78);border:1px solid #20324a;padding:3px 5px}
.w5-pcol.blue{border-top:2px solid var(--hex-blue)}.w5-pcol.red{border-top:2px solid var(--hex-red)}
.w5-ph,.w5-p{display:grid;grid-template-columns:24px 1fr 44px 28px 36px;gap:4px;align-items:center}
.w5-ph{font-size:10px;color:var(--hex-mu);padding:1px 0;border-bottom:1px solid #1b2b42}.w5-ph span:not(:first-child){text-align:center}.w5-ph span:first-child{grid-column:1/3}
.w5-p{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.w5-ava{display:block;position:relative;width:24px;height:24px}
.w5-ava .c-ava.xs{width:24px;height:24px}
.w5-ava .lv{position:absolute;right:-3px;bottom:-3px;font:800 9px var(--num);background:#010a13;color:var(--hex-gold);border:1px solid var(--hex-gold-d);padding:0 2px;line-height:1.1}
.w5-ava .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.68);color:#ff8090;font:800 12px var(--num)}
.w5-p.dead .w5-nm{opacity:.5}
.w5-nm{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.w5-nm b{color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.w5-nm small{display:none}
.w5-nm .hpb{display:block;height:3px;background:#1b2636;margin-top:2px}.w5-nm .hpb i{display:block;height:100%;background:#3ddc84}
.w5-kda,.w5-cs,.w5-g{font-family:var(--num);font-size:13px;font-weight:700;text-align:center;color:var(--hex-gold-l)}
/* 桌面端 5v5 实时观战单屏适配（整个对局画面严丝合缝塞入 100vh 初始框） */
@media(min-width:960px){
  .match.hex.mode-live{height:100vh;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:6px 12px 8px}
  .match.hex.mode-live>.mh-lol{padding:3px 12px;margin-bottom:5px;flex-shrink:0}
  .match.hex.mode-live>.mh-lol .mh-score{font-size:28px}
  .match.hex.mode-live>.mh-lol .tt.big b{font-size:22px}
  .match.hex.mode-live>.mh-lol .fearless-row{display:none}
  .match.hex.mode-live .watch5{flex:1;min-height:0}
  .match.hex.mode-live .w5-score,.match.hex.mode-live .w-ctrl{flex-shrink:0}
  .match.hex.mode-live{height:100dvh}
  .match.hex.mode-live .w5-main{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
  /* 小地图取所在格子宽高中较小者作为边长，任何窗口比例下都完整显示，不再被底部控制条压住 */
  .match.hex.mode-live .w5-mapcell{container-type:size;height:100%}
  .match.hex.mode-live .w5-mapbox{width:min(100cqw,100cqh);height:auto;max-width:none}
  .match.hex.mode-live .watch5>.w-ctrl{position:static}
  .match.hex.mode-live .w5-players{grid-template-columns:1fr}
}
.w-ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;background:rgba(1,10,19,.92);border:1px solid #2a405e}
.w-ctrl .spd-btn{min-height:32px;min-width:42px}
.w-seek{flex:1;min-width:140px;accent-color:var(--hex-gold)}
