function evolveChampPool(p, metaTable, isOffseason){
  p.champs = Array.isArray(p.champs) ? p.champs : [];
  // 1. 自然遗忘衰减（老英雄长期不练会缓慢流失熟练度）
  const decay=masteryDecay(p), learn=masteryGain(p);
  const baseDecay = (isOffseason ? 8 : 3)*decay;
  const history=professionalPicks(p);
  const ov=champOverride(p);
  const signatures=ov?.champs ? topChamps(ov.champs,2) : Object.keys(history).filter(c=>history[c]>=4).slice(0,2);
  p.champs.forEach(e=>{
    const d = Math.round(baseDecay + rnd() * (isOffseason ? 6 : 2)*decay);
    const prev=migrateChampProf(e.p);
    e.p = Math.max(signatures.includes(e.c)?Math.min(prev,78):0,prev-d);
  });
  p.champs = p.champs.filter(e=>e.p >= 15);
  for(const c of Object.keys(p.champPractice||{})){
    p.champPractice[c]-=Math.floor(baseDecay*0.5);
    if(p.champPractice[c]<15) delete p.champPractice[c];
  }

  // 2. 自动适应新版本：自发练习 1~2 个本位置英雄（倾向版本加强英雄）
  const rolePool=PROFESSIONAL_HEROES[p.role]||[];
  if(rolePool.length){
    const nLearn = isOffseason ? (p.age<=22 ? 2 : 1 + (rnd()<0.5?1:0)) : 1;
    const weighted = rolePool.map(c=>({c,w:(metaTable[c]||0)*1.6*proAffinity(p,c)+proAffinity(p,c)+rnd()*1.2})).sort((a,b)=>b.w-a.w);
    for(let i=0;i<nLearn && i<weighted.length;i++){
      const c = weighted[i].c;
      const gain = Math.round(((isOffseason ? 18 : 8) + rnd() * (isOffseason ? 14 : 6))*learn);
      const prev=champProfVal(p,c);
      rememberChampProf(p,c,prev?clamp(prev+gain,15,98):clamp(22+gain,25,68));
    }
  }

  // 3. 休赛期定向英雄池特训结算
  const trainedNames = [];
  if(isOffseason){
    let targets = Array.isArray(p.trainTargets) ? p.trainTargets.slice(0,2) : [];
    // AI 选手也会自动定向特训 1 个下版本强势英雄
    if(p.team !== S.user && !targets.length && rolePool.length){
      const strong = rolePool.filter(k=>(metaTable[k]||0)>=1).sort((a,b)=>proAffinity(p,b)-proAffinity(p,a)).slice(0,3);
      if(strong.length) targets = [pick(strong)];
    }
    for(const c of targets){
      if(!CH[c]) continue;
      const gain = Math.round((28 + (p.age<=22?6:0) + rnd()*10)*learn);
      const prev=champProfVal(p,c);
      const value=prev?clamp(prev+gain,30,99):clamp(24+gain,46,72);
      rememberChampProf(p,c,value);
      trainedNames.push(`${CH[c].cn}（${playerProfTier(p,c,value).name}）`);
    }
    p.trainTargets = [];
  }

  p.champs.sort((a,b)=>b.p - a.p);
  if(!p.champs.length) genChampPool(p);
  return trainedNames;
}

  {lane:.10,tf:.15,react:0,macro:.35,pool:.15,ment:.25}

const AGING_BY_AGE = [
  {lane:0,tf:0,react:0,macro:0,pool:0,ment:0},

  {lane:.25,tf:.15,react:.60,macro:0,pool:0,ment:0}

function settlePlayerDevelopment(p){
  if(!validAttrs(p.attrs)) openingAttrs(p);
  const games=p.development?.games||0;
  const team=p.team?T(p.team):null;
  const regionalStarter=team && team.region!=='LPL' && Object.values(team.lineup).includes(p.pid);
  const reps=Math.min(1,(games+(regionalStarter?5:0))/12);
  const quality=games?clamp(p.development.performance/games,-0.8,1.2):0;
  const ageFactor=p.age<=22?1:p.age<=26?0.55:p.age<=29?0.24:0.10;
  const room=Math.max(0,p.pot-p.rating);
  // 年度成长整体 ×1.15，再按潜力 ×0.9~1.1；达到潜力后成长降为四分之一，最多超出潜力 2 分
  let growth=(room*ageFactor*(0.035+reps*0.10)+quality*reps*ageFactor*0.80)*DEV_GROWTH_MUL*potentialGrowthMul(p.pot);
  if(growth>0 && Number.isFinite(p.pot) && p.rating>=p.pot) growth*=POT_OVER_RATE;
  const aging=p.age<27?0:(p.age-26)*0.13*(1-reps*0.42);
  let next=clamp(Math.round((p.rating+clamp(growth-aging,-1.6,3.5))*10)/10,45,98);
  if(next>p.rating && Number.isFinite(p.pot)) next=Math.min(next, Math.max(p.rating, p.pot+POT_OVER_CAP));
  p.ratingDelta=roundTenth(next-p.rating);
  const ageBand=p.age<=21?0:p.age<=25?1:2;
  const weights=attrWeights(p.role), grow=GROWTH_BY_AGE[ageBand], decline=AGING_BY_AGE[ageBand];
  const gainRate=growth/attrMean(grow,weights);
  const lossRate=aging ? aging/attrMean(decline,weights) : 0;
  const before=developmentAttrs(p);
  const after=Object.fromEntries(ATTR_KEYS.map(k=>[k,before[k]+gainRate*grow[k]-lossRate*decline[k]]));
  if(p.age>=26 && reps>=.5){
    after.macro+=.3;
    after.ment+=.3;
    after.react-=.3*(weights.macro+weights.ment)/weights.react;
  }
  const settled=setAttrProfile(p,after,next);
  const deltas=Object.fromEntries(ATTR_KEYS.map(k=>[k,roundTenth(settled[k]-before[k])]));
  if(ATTR_KEYS.some(k=>deltas[k]!==0)) p.attrDelta=deltas;
  else delete p.attrDelta;
  p.development={games:0,performance:0};
}

function stageMatches(ev){ // 当前可进行的比赛（含并行小组；循环赛严格按最早未完成轮次）
  const idxs = ev.parallel && ev.si<=Math.max(...ev.parallel) ? ev.parallel : [ev.si];
  const out=[];
  for(const i of idxs){
    const st=ev.stages[i]; if(!st) continue;
    if(st.kind==='br') resolveBR(st);
    let pending = st.matches.filter(m=>!m.w && m.a && m.b);
    if(st.kind==='rr' && pending.length && pending.some(m=>m.rnd!=null)){
      const minR = Math.min(...pending.filter(m=>m.rnd!=null).map(m=>m.rnd));
      pending = pending.filter(m=>m.rnd===minR);
    }
    for(const m of pending) out.push({m,st});
  }
  return out;
}
function nextReadyMatch(){ const ev=curEvent(); if(!ev||ev.done) return null; const a=stageMatches(ev); return a[0]||null; }
function stageDone(st){ if(st.kind==='br') resolveBR(st); return st.matches.every(m=>m.w); }
function startEvent(){ const ev=curEvent(); if(ev && !ev.started && !isRosterSetup(ev)){ ev.started=true; EV[ev.type].init(ev); } }
function afterMatch(st, m){
  if(st.kind==='swiss') swissReport(st,m);
  if(st.kind==='br') resolveBR(st);
  const ev=curEvent();
  let guard=0;
  while(!ev.done && guard++<10){
    const idxs = ev.parallel && ev.si<=Math.max(...ev.parallel) ? ev.parallel : [ev.si];
    const cur=ev.stages[ev.si];
    if(cur.kind==='swiss'){ if(cur.matches.every(x=>x.w)){ if(swissNextRound(cur)) break; } else break; }
    if(!idxs.every(i=>stageDone(ev.stages[i]))) break;
    if(ev.parallel && idxs.length>1){ ev.si=Math.max(...idxs); EV[ev.type].next(ev); ev.si++; delete ev.parallel; continue; }
    EV[ev.type].next(ev); if(!ev.done) ev.si++;
  }
  if(ev.parallel && ev.si>Math.max(...ev.parallel)) delete ev.parallel;
}
function playAI(item){ simSeries(item.m, isBig(item.st,item.m)); afterMatch(item.st,item.m); }
function isBig(st,m){ return m.a===S.user||m.b===S.user||/决赛/.test(m.label); }
function userInvolved(m){ return m.a===S.user||m.b===S.user; }
function simUntilUser(limitAll){
  startEvent();
  let n=0;
  while(true){ const it=nextReadyMatch(); if(!it) break;
    if(userInvolved(it.m) && !limitAll) return it;
    if(userInvolved(it.m) && limitAll){ simSeries(it.m,true); afterMatch(it.st,it.m); n++; continue; }
    playAI(it); n++; if(n>2000) break; }
  return null;
}

  const {label,stopsAt,first,count,kind}=EVENT_SKIP_PHASES[ev.type];
  if(!ev.started) return first===0 ? {label,stopsAt,stages:[]} : null;
  if(ev.si<first || ev.si>=first+count) return null;
  const stages=ev.stages.slice(first,first+count);
  if(stages.length!==count || stages.some(st=>st.kind!==kind || (kind==='br'&&!st.name?.startsWith('小组赛')))) return null;
  return {label,stopsAt,stages};
}
function canAutoSeries(m){
  const phase=eventSkipPhase();
  return !!m && !m.w && userInvolved(m) && !!phase && phase.stages.some(st=>st.matches.includes(m));
}
function playNextAiMatch(){
  const it=nextReadyMatch();
  if(!it || userInvolved(it.m)) return null;
  playAI(it);
  return it.m;
}
function skipEventPhase(){
  const result={played:0, userMatches:[]};
  const ev=curEvent();
  if(!eventSkipPhase(ev)) return result;
  startEvent();
  const phase=eventSkipPhase(ev);
  if(!phase) return result;
  // 固定小组范围。瑞士轮在同一阶段追加轮次；独立淘汰阶段是另一个对象。
  while(curEvent()===ev && !ev.done){
    const it=nextReadyMatch();
    if(!it || !phase.stages.includes(it.st)) break;
    playPhaseMatch(it, result);
  }
  return result;
}
function playPhaseMatch(it, result){
  playAI(it);
  result.played++;
  const m=it.m;
  if(!userInvolved(m)) return;
  const won=m.w===S.user;
  addNews(`${won?'胜':'负'}：${teamName(m.a)} ${m.s[0]}:${m.s[1]} ${teamName(m.b)}（${m.label}）`);
  result.userMatches.push({a:m.a,b:m.b,s:m.s.slice(),won,label:m.label});
}
// 可跳过阶段内结算当前一轮，包含玩家该轮的比赛。
function simCurrentRound(){
  const ev = curEvent();
  const result={played:0,userMatches:[]};
  const phase=eventSkipPhase(ev);
  if(!phase || !ev.started) return result;
  const startSi = ev.si;
  const firstPool = stageMatches(ev).filter(it=>phase.stages.includes(it.st));
  if(!firstPool.length) return result;
  const st0 = firstPool[0].st;
  const targetRnd = st0.kind==='rr' ? firstPool[0].m.rnd : st0.kind==='swiss' ? st0.round : null;
  const targetCol = st0.kind==='br' ? Math.min(...firstPool.map(x => x.m.col != null ? x.m.col : 0)) : null;

  let guard = 0;
  while(!ev.done && ev.si === startSi && guard++ < 200){
    const pool = stageMatches(ev).filter(({m, st}) => {
      if(!phase.stages.includes(st)) return false;
      if(st.kind==='rr') return m.rnd === targetRnd;
      if(st.kind==='swiss') return st.round === targetRnd;
      if(st.kind==='br') return (m.col != null ? m.col : 0) === targetCol;
      return true;
    });
    if(!pool.length) break;
    playPhaseMatch(pool[0], result);
  }
  return result;
}
function advanceEvent(){
  const ev=curEvent(); if(!ev.done) return;
  S.evIdx++;
  if(S.evIdx>=S.events.length){ S.evIdx=S.events.length-1; }
  const nxt=curEvent();
  if(nxt && nxt.type==='off') EV.off.init(nxt);
}
function finishRosterSetup(){
  const ev=curEvent();
  if(!isRosterSetup(ev)) return {ok:false, msg:'当前不在组队阶段。'};
  const probs=lineupProblems(S.user);
  if(probs.length) return {ok:false, msg:`请先调整首发阵容：${probs.join('；')}`};
  ev.started=true;
  ev.done=true;
  advanceEvent();
  return {ok:true, msg:'组队完成，已进入第一赛段。'};
}
function addNews(t){ S.news.unshift({y:S.year, ev:eventInfo(curEvent())?.name||'', t}); if(S.news.length>300) S.news.length=300; }

// ================= 转会（含季中建队非卖品保护、化学反应成本、跨赛区年内极稀有机制） =================
function isMidSeasonWindow(){
  const ev = curEvent();
  return !!(ev && ev.type === 'window' && !isRosterSetup(ev));
}
function transferWindowOpen(){
  const ev=curEvent();
  return !!(ev && (ev.type==='window' || ev.type==='off' ||
    (ev.type==='lpl_s1' && !ev.started && !isRosterSetup(S.events[S.evIdx-1]))));
}
function isOffseasonWindow(){
  const ev = curEvent();
  return !!(ev && ev.type === 'off');
}
function isCrossRegionFor(p, buyerKey){
  if(!p || !p.team || !buyerKey) return false;
  const fromT = T(p.team), toT = T(buyerKey);
  return !!(fromT && toT && fromT.region !== toT.region);
}
// 季中转会窗口期间：各队顶级明星（>=86）、合同未到期的队内头号核心、以及高默契原班主力（默契>=72且>=80分）不轻易挂牌
function isUntouchable(p){
  if(!p || !p.team || !isMidSeasonWindow()) return false;
  const t = T(p.team); if(!t) return false;
  const isStarter = Object.values(t.lineup).includes(p.pid);
  if(!isStarter) return false;
  if(p.rating >= 86) return true;
  if(p.contract > S.year && p.rating >= 81){
    const topStarter = starters(t.key).slice().sort((a,b)=>b.rating - a.rating)[0];
    if(topStarter && topStarter.pid === p.pid) return true;
  }
  if(p.contract > S.year && p.rating >= 80 && playerTeamBond(p) >= 72) return true;
  return false;
}

function askPrice(p, buyerKey){
  const t=T(p.team); let f=1.0;
  if(t && Object.values(t.lineup).includes(p.pid)) f+=0.35;
  if(t && t.tier<=2) f+=0.15;
  if(p.rating>=88) f+=0.25;
  if(p.contract<=S.year) f*=0.72;
  // 队内高默契核心拆队溢价
  if(t && playerTeamBond(p) >= 68) f += 0.18;
  // 年中转会打乱化学反应，所有在约选手身价上浮；跨赛区年中挖人更需天价溢价
  const buyer = buyerKey || S.user;
  const cross = isCrossRegionFor(p, buyer);
  if(isMidSeasonWindow()){
    f *= cross ? 1.85 : 1.32;
  } else if(cross){
    f *= 1.18;
  }
  return Math.round(playerValue(p)*f);
}
function canTeamFitForeign(team, incomingPlayer){
  const maxF = maxForeignFor(team.region);
  if(maxF >= 5 || !isForeign(incomingPlayer)) return true;
  const curAtRole = P(team.lineup[incomingPlayer.role]);
  const curF = starters(team.key).filter(isForeign).length;
  // 若替下的是外援则名额不变；否则需未达上限
  return (curAtRole && isForeign(curAtRole)) ? curF <= maxF : curF < maxF;
}
function evaluateOffer(pid, cash, givePid){
  const p=P(pid); const ask=askPrice(p, S.user);
  let offerVal=cash; let gp=null;
  if(givePid){ gp=P(givePid); offerVal += playerValue(gp)*(gp.role===p.role?0.95:0.7); }
  const ratio=offerVal/ask;
  const crossMid = isMidSeasonWindow() && isCrossRegionFor(p, S.user);
  // 年中跨赛区转会极度稀有：必须给出极高溢价才存在成交可能
  const chance = crossMid
    ? clamp((ratio - 1.18) / 0.45, 0, 0.55)
    : clamp((ratio - 0.85) / 0.3, 0, 1);
  return {ask, offerVal, ratio, crossMid, accept: crossMid ? ratio>=1.35 : ratio>=1, chance};
}
function makeOffer(pid, cash, givePid){
  const p=P(pid), me=T(S.user);
  if(cash>me.budget) return {ok:false,msg:'预算不足'};
  if(!p.team){
    signPlayer(pid,S.user,Math.round(p.salary*1.1),S.year+2); me.budget-=cash;
    addNews(`签约：${teamName(S.user)} 签下自由球员 ${playerTag(p)}（${ROLE_CN[p.role]}）。`); return {ok:true,msg:`签约成功！${playerTag(p)} 加盟。`};
  }
  if(isUntouchable(p)) return {ok:false,msg:`${teamName(p.team)} 将 ${playerTag(p)} 视为季中非卖核心，拒绝在赛段间拆散默契班底。`};
  const e=evaluateOffer(pid,cash,givePid);
  const accept = e.crossMid
    ? (e.ratio >= 1.45 || (e.ratio >= 1.2 && rnd() < e.chance))
    : (e.ratio >= 1.05 || (e.ratio >= 0.9 && rnd() < e.chance));
  if(!accept){
    return {ok:false, msg: e.crossMid
      ? `${teamName(p.team)} 拒绝了季中跨赛区挖角（跨区转会通常仅在年底休赛期发生，心理底价约 ${fmtMoney(e.ask)}）。`
      : `${teamName(p.team)} 拒绝了报价（对方心理价位约 ${fmtMoney(e.ask)}）。`};
  }
  const seller=p.team;
  me.budget-=cash; T(seller).budget+=cash;
  signPlayer(pid,S.user,Math.max(p.salary,Math.round(fairSalary(p)*1.05)),S.year+2);
  if(givePid){ signPlayer(givePid,seller,P(givePid).salary,P(givePid).contract); }
  ensureRoster(seller);
  addNews(`转会：${playerTag(p)} 从 ${teamName(seller)} 加盟 ${teamName(S.user)}${cash?`，转会费 ${fmtMoney(cash)}`:''}${givePid?`，${playerTag(P(givePid))} 反向加盟 ${teamName(seller)}`:''}。`);
  return {ok:true,msg:'交易达成！'};
}
function bidsFor(pid){
  const p=P(pid), v=playerValue(p);
  const mid = isMidSeasonWindow();
  return Object.values(S.teams).filter(t=>{
    if(t.key===S.user || t.budget<=v*0.8 || !canTeamFitForeign(t, p)) return false;
    // 年中窗口外赛区几乎不主动报价求购
    if(mid && t.region !== T(S.user).region && rnd() > 0.08) return false;
    return true;
  })
    .map(t=>{ const cur=P(t.lineup[p.role]); const need = cur? (p.rating-cur.rating) : 10; return {t:t.key, need, price: Math.round(v*(0.75+rnd()*0.35+Math.max(0,need)*0.02))}; })
    .filter(b=>b.need>-2 && b.price<=T(b.t).budget).sort((a,b)=>b.price-a.price).slice(0,3);
}
function sellPlayer(pid, buyer, price){
  const p=P(pid); const me=T(S.user);

  signPlayer(pid,buyer,p.salary,Math.max(p.contract,S.year+1)); autoLineup(buyer);
  addNews(`转会：${teamName(S.user)} 将 ${playerTag(p)} 以 ${fmtMoney(price)} 出售给 ${teamName(buyer)}。`);
}
function releasePlayer(pid){ const p=P(pid); const t=T(p.team); const pay=Math.round(p.salary*0.5); t.budget-=pay; t.roster=t.roster.filter(x=>x!==pid); for(const r of ROLES) if(t.lineup[r]===pid) delete t.lineup[r]; p.team=null; addNews(`解约：${teamName(S.user)} 与 ${playerTag(p)} 解约（支付违约金 ${fmtMoney(pay)}）。`); }
function aiTransfers(n){
  const mid = isMidSeasonWindow();
  // 年中转会窗：AI 几乎不主动拆队（避免破坏化学反应），仅极少次数补强短板
  const attempts = mid ? (rnd() < 0.35 ? 1 : 0) : n;
  const ts=Object.values(S.teams).filter(t=>t.key!==S.user);
  for(let i=0;i<attempts;i++){
    const buyer=pick(ts); const role=pick(ROLES); const cur=P(buyer.lineup[role]); if(!cur) continue;
    const curBond = playerTeamBond(cur);
    // 队内默契高时不轻易换人（除非升级幅度显著）
    const minGain = mid ? (curBond >= 60 ? 6 : 4) : (curBond >= 72 ? 4 : 2.5);
    const allowCross = mid ? (rnd() < 0.03) : (rnd() < 0.16);
    const cands=Object.values(S.players).filter(p=>{
      if(p.role!==role || !p.team || p.team===buyer.key || p.team===S.user) return false;
      if(isUntouchable(p)) return false;
      const cross = T(p.team).region !== buyer.region;
      if(cross && !allowCross) return false;
      return p.rating > cur.rating + minGain && askPrice(p, buyer.key) < buyer.budget*0.55 && canTeamFitForeign(buyer, p);
    });
    if(!cands.length) continue;
    const p=pick(cands.slice(0,30)); const price=askPrice(p, buyer.key); const from=p.team;
    const crossTag = T(from).region !== buyer.region ? '【重磅跨赛区转会】' : '';
    buyer.budget-=price; T(from).budget+=price;
    signPlayer(p.pid,buyer.key,fairSalary(p),S.year+2);
    autoLineup(buyer.key); ensureRoster(from);
    addNews(`${crossTag}${playerTag(p)} 以 ${fmtMoney(price)} 从 ${teamName(from)} 转会至 ${teamName(buyer.key)}。`);
  }
}
// ================= 休赛期 / 新赛季 =================
function finishOffseason(){
  const y=S.year;
  const np = ensureNextPatch();
  Object.values(S.players).forEach(p=>{ if(!p.team || p.contract>y) return;
    if(p.team===S.user){ if(!p.renewed){ const t=T(p.team); t.roster=t.roster.filter(x=>x!==p.pid); for(const r of ROLES) if(t.lineup[r]===p.pid) delete t.lineup[r]; p.team=null; addNews(`离队：${playerTag(p)} 合同到期离队，成为自由球员。`);} }
    else if(rnd()<0.8 || T(p.team).roster.length<=5){ p.contract=y+1+Math.floor(rnd()*2); p.salary=fairSalary(p); }
    else { const t=T(p.team); t.roster=t.roster.filter(x=>x!==p.pid); for(const r of ROLES) if(t.lineup[r]===p.pid) delete t.lineup[r]; p.team=null; }
    p.renewed=false; });

  S.patchNo = 0;

  const userTrainLogs = [];

    if(p.team===S.user && trained.length) userTrainLogs.push(`${playerTag(p)} → ${trained.join('、')}`);
  });

  Object.values(S.teams).forEach(t=>ensureRoster(t.key));
  aiTransfers(12);
  Object.values(S.teams).forEach(t=>{ if(t.key!==S.user) autoLineup(t.key); else { for(const r of ROLES) if(t.lineup[r] && (!P(t.lineup[r]) || P(t.lineup[r]).team!==t.key)) delete t.lineup[r]; } });
  ensureRoster(S.user);
  const s3=S.events.find(e=>e.type==='lpl_s3').res.final;
  const ranked=s3.slice(0,8).concat(S.lplOrder.filter(t=>!s3.slice(0,8).includes(t)).sort((a,b)=>(S.points[b]||0)-(S.points[a]||0)));

  S.history = S.history||[]; S.history.push({year:y, points:{...S.points}, lpl:S.events.filter(e=>/lpl_s/.test(e.type)).map(e=>e.res.champ), fst:championOf('fst'), msi:championOf('msi'), ewc:championOf('ewc'), worlds:championOf('worlds')});
  S.lplOrder=ranked;
  buildSeason();
  if(userTrainLogs.length) addNews(`🎯 冬训成果：${userTrainLogs.join('；')}。`);
  addNews(`🎆 ${S.year} 赛季正式开启！版本 ${np.ver} 实装上线。`);

const MELEE_MID = new Set(['Yone','Yasuo','Akali','Sylas','Diana','Naafiri','Galio','Ambessa','Pantheon','Lissandra','Swain','Annie','Gragas','Rumble','Taliyah','Cho\'Gath','Neeko','LeBlanc','Twisted Fate']);
const RANGED_X = new Set(['Jayce','Kennen','Gnar','Vayne','Corki','Ezreal','Zoe','Twisted Fate','LeBlanc','Neeko','Taliyah','Swain','Annie','Lissandra','Nidalee','Karthus','Kindred','Graves','Zyra','Brand','Hwei','Mel','Ashe','Senna','Seraphine','Ziggs','Smolder','Lillia']);
function isRanged(c){
  const ch = CH[c]; if(!ch) return false;
  if(RANGED_X.has(c)) return true;
  if(ch.roles.includes('ADC')) return true;
  if(ch.dmg==='AP' && ch.roles.includes('MID') && !MELEE_MID.has(c)) return true;
  if(ch.roles[0]==='SUP' && ch.tags.includes('protect') && !ch.tags.includes('engage')) return true;
  return false;
}
function archetype(c, role){
  const ch = CH[c]; if(!ch) return 'adfight';
  const t = new Set(ch.tags), ap = ch.dmg==='AP', ad = ch.dmg==='AD';
  const tanky = (t.has('engage')||t.has('protect')) && !t.has('scale') && !t.has('split') && !t.has('pick') || ['Ornn','Sion','K\'Sante','Malphite','Cho\'Gath','Zac','Sejuani','Maokai','Skarner','Amumu','Rell','Alistar','Leona','Nautilus','Braum','Tahm Kench','Taric','Poppy'].includes(c);
  if(role==='SUP'){
    if(tanky || (t.has('engage') && !t.has('poke'))) return 'tanksup';
    if(ad && !ch.roles.includes('ADC')) return 'adsup';
    if(ch.tags.includes('poke') && !ch.tags.includes('protect')) return 'apsup';
    return 'enchant';
  }
  if(role==='JUG'){
    if(tanky) return 'jugtank';
    if(ap) return 'jugap';
    if(t.has('pick') && !t.has('engage')) return 'jugad';
    return 'jugbr';
  }
  if(role==='ADC'){
    if(ap) return 'apmage';
    if(c==='Yunara'||c==='Yasuo'||c==='Yone'||c==='Tristana'||c==='Nilah') return 'adcrit';
    return 'adc';
  }
  if(role==='MID'){
    if(ad){ if(c==='Yone'||c==='Yasuo') return 'adcrit'; if(ch.roles.includes('ADC')) return 'adc'; return t.has('pick')?'adassn':'adfight'; }
    if(tanky) return 'tank';
    if(MELEE_MID.has(c) && (t.has('pick')||t.has('early'))) return 'apassn';
    if(t.has('scale')) return 'apcarry';
    return 'apmage';
  }
  // TOP
  if(tanky) return 'tank';
  if(ap) return t.has('scale')||t.has('split') ? 'apfighter' : 'apburn';
  if(ch.roles.includes('ADC')) return 'adc';
  if(t.has('split')||t.has('pick')) return 'adfight';
  return 'adbrawl';
}

// ---------------- 紧凑编码（回放存储用） ----------------
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const B64I = (()=>{ const m={}; for(let i=0;i<64;i++) m[B64[i]]=i; return m; })();
const enc1 = v => B64[clamp(Math.round(v),0,63)];
const enc2 = v => { v = clamp(Math.round(v),0,4095); return B64[v>>6] + B64[v&63]; };
const dec1 = (s,i) => B64I[s[i]]||0;
const dec2 = (s,i) => ((B64I[s[i]]||0)<<6) | (B64I[s[i+1]]||0);
const hyp = (x,y) => Math.sqrt(x*x + y*y);   // 比 Math.hypot 快很多
const fmtSec = sec => { sec = Math.max(0, Math.floor(sec)); return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`; };
function wpick(arr, wfn, random){
  let tot = 0; const w = arr.map(x=>{ const v=Math.max(0.0001, wfn(x)); tot+=v; return v; });
  let r = random()*tot;
  for(let i=0;i<arr.length;i++){ r-=w[i]; if(r<=0) return arr[i]; }
  return arr[arr.length-1];
}
const pickOne = (a, random) => a[Math.floor(random()*a.length)];
const matchRandom = seed => srand(seed ?? (rnd()*0x100000000 >>> 0));

// =====================================================================
//                       1v1 SOLO 中路对线状态机
// =====================================================================
// 位置 s ∈ [0,1]：0 = A 方防御塔一侧，1 = B 方防御塔一侧；A 塔在 0.06，B 塔在 0.94
const SOLO_TW = {A:0.06, B:0.94};
const SOLO_LAST_TICK = 12*60 - 1;
const XP_LV = [0,0,280,660,1140,1720,2400,3180,4060,5040,6120,7300,8580,9960,11440,13020,14700,16480,18360];
const lvlOf = xp => { let l=1; while(l<18 && xp>=XP_LV[l+1]) l++; return l; };

function attrOffset(p, key){ return p?.attrs ? p.attrs[key]-p.rating : 0; }
function soloFighter(side, pl, c, role, random){
  const ch = CH[c];
  const react=attrOffset(pl,'react');
  const mr = (pl ? matchRating(pl, pl.role, {}) : 70) + champFit(pl, c, pl?pl.role:role)*0.8
    + .55*attrOffset(pl,'lane') + .15*react;
  const tags = new Set(ch.tags);
  const ranged = isRanged(c);
  const arche = archetype(c, ranged && role!=='SUP' ? (ch.roles.includes('ADC')?'ADC':'MID') : (role==='SUP'?'MID':role));
  const b = BUILDS[arche] || BUILDS.adfight;
  const start = b.start[0] >= 1101 && b.start[0] <= 1103 ? (ch.dmg==='AP'?1056:1055) : (b.start[0]===3865 ? (ch.dmg==='AP'?1056:1055) : b.start[0]);
  const tr = playerTraits(pl);
  return {
    side, pid: pl?pl.pid:null, tag: playerTag(pl), role: pl?pl.role:role, champ:c, cn: ch.cn, mr, react, ranged, tags, arche, build:b, tr,
    mental: mentalTier(pl),
    s: side==='A'?0.38:0.62, hp:1, mp:1, lvl:1, xp:0, cs:0, gold:500-ITEMS[start][1]-50*2, items:[start], pots:2, potT:0,
    flash:0, sum2: (tags.has('early')||tags.has('pick')) ? 'ig' : (ranged ? 'bar' : 'ig'), s2cd:0,
    recall:0, away:0, trd: 4+random()*4, comboCd:0, invested: ITEMS[start][1], dead:false, mood:0
  };
}
function soloMaxHp(f){ return 560 + 92*(f.lvl-1) + (f.items.includes(1054)?110:f.items.includes(1055)?80:f.items.includes(1056)?70:0) + (f.invested>1200?150:0); }
// 单位时间伤害（相对数值）：等级 + 装备 + 发挥 + 英雄前期强度
function soloDps(f){
  const early = (f.tags.has('early')?0.12:0) + (f.tags.has('pick')?0.06:0) - (f.tags.has('scale')?0.05:0);
  return (55 + 9*f.lvl) * (1 + f.invested/3200) * Math.exp((f.mr-80)/38) * (1+early) * (f.lvl>=6 ? 1.12 : 1);
}

function simSolo1v1(teamA, teamB, pickA, pickB, opts){
  const game = createSolo(teamA, teamB, pickA, pickB, opts);
  while(!game.over) soloStep(game);
  return soloResult(game);
}
function createSolo(teamA, teamB, pickA, pickB, opts){
  const luA = lineupMap(teamA), luB = lineupMap(teamB);
  const pa = pickA || defaultSoloPick(teamA);
  const pb = pickB || defaultSoloPick(teamB);
  const plA = (pa.pid && P(pa.pid)) || luA[pa.role] || Object.values(luA)[0];
  const plB = (pb.pid && P(pb.pid)) || luB[pb.role] || Object.values(luB)[0];
  const cA = pa.champ && CH[pa.champ] ? pa.champ : defaultSoloPick(teamA).champ;
  const cB = pb.champ && CH[pb.champ] ? pb.champ : defaultSoloPick(teamB).champ;
  const random = matchRandom(opts?.seed);
  const g = {
    random, kind:'solo', teamA, teamB, t:90, over:false, winner:null, winReason:'',
    F:{A:soloFighter('A', plA, cA, pa.role, random), B:soloFighter('B', plB, cB, pb.role, random)},
    wave:0.5, waveT:0, waveN:0, tw:{A:1, B:1}, ring:0, log:[], fx:null, fxT:0,
    first:{lv2:null, lv6:null},
    rec: opts && opts.record ? [] : null
  };
  g.F.A.maxhp = soloMaxHp(g.F.A); g.F.B.maxhp = soloMaxHp(g.F.B);
  soloLog(g, null, '对线开始', `双方中路碰面！${teamName(teamA)} ${g.F.A.tag}（${g.F.A.cn}）对阵 ${teamName(teamB)} ${g.F.B.tag}（${g.F.B.cn}），谁能拿下选边权？`);
  if(g.rec) soloRecord(g);
  return g;
}
function soloLog(g, side, tag, text, hl){ g.log.push({t:fmtSec(g.t), sec:g.t, side, tag, text, hl:!!hl}); }
const oppSide = s => s==='A'?'B':'A';

function soloStep(g){
  if(g.over) return;
  g.t += 1;
  const A = g.F.A, B = g.F.B;
  // 兵线：每 30 秒一波，cs/经验结算；兵线推进看双方清线能力与谁在线上
  g.waveT += 1;
  for(const f of [A,B]){
    if(f.flash>0) f.flash--; if(f.s2cd>0) f.s2cd--; if(f.trd>0) f.trd--; if(f.comboCd>0) f.comboCd--;
    if(f.potT>0){ f.potT--; f.hp = Math.min(1, f.hp + 8/f.maxhp*1); }
    if(f.recall>0){ f.recall--; if(f.recall===0){ soloBase(g, f); } }
    else if(f.away>0){ f.away--; if(f.away===0){ f.s = f.side==='A'?0.3:0.7; soloLog(g, f.side, '回到线上', `${f.tag} 补给完毕重新回到中路${f.items.length>2?`，身上多了 ${ITEM_CN(f.items[f.items.length-1])}`:''}。`); } }
    // 回蓝回血
    if(f.recall===0 && f.away===0) { f.mp = Math.min(1, f.mp + 0.012); f.hp = Math.min(1, f.hp + 0.0018); }
  }
  const presA = A.recall===0 && A.away===0, presB = B.recall===0 && B.away===0;
  if(g.waveT >= 25){
    g.waveT = 0; g.waveN++;
    const cannon = g.waveN % 3 === 0;
    const minions = 6 + (cannon?1:0);
    for(const [f,o,pres] of [[A,B,presA],[B,A,presB]]){
      if(!pres){ continue; }
      const harass = clamp((o.hp - f.hp)*0.25 + (o.ranged && !f.ranged ? 0.06 : 0), -0.05, 0.25);
      const eff = clamp(0.74 + (f.mr-78)/70 - harass + randn(g.random)*0.04 - (f.mental<0 && g.t>400 ? 0.04 : 0), 0.45, 0.99);
      let got = 0; for(let i=0;i<minions;i++) if(g.random()<eff) got++;
      f.cs += got; f.gold += got*21 + 1; f.xp += 250 + (cannon?90:0);
    }
    if(!presA && presB){ g.tw.A = Math.max(0, g.tw.A - 0.2 - (B.lvl>=6?0.04:0)); g.wave = 0.12; soloLog(g, 'B', '推线磨塔', `${B.tag} 趁 ${A.tag} 不在线上把兵线推进塔下，猛点防御塔，剩余 ${Math.round(g.tw.A*100)}%。`); }
    else if(!presB && presA){ g.tw.B = Math.max(0, g.tw.B - 0.2 - (A.lvl>=6?0.04:0)); g.wave = 0.88; soloLog(g, 'A', '推线磨塔', `${A.tag} 趁 ${B.tag} 不在线上把兵线推进塔下，猛点防御塔，剩余 ${Math.round(g.tw.B*100)}%。`); }
    else if(presA && presB){
      const pushA = (A.ranged?1.15:1) * (A.tags.has('poke')?1.1:1) * Math.exp((A.mr-B.mr)/60) * (0.5+A.hp) ;
      const pushB = (B.ranged?1.15:1) * (B.tags.has('poke')?1.1:1) * (0.5+B.hp);
      g.wave = clamp(g.wave + (pushA-pushB)*0.16 + randn(g.random)*0.07, 0.2, 0.8);
      if(g.wave>=0.72){ g.tw.B = Math.max(0, g.tw.B - 0.055); if(g.tw.B>0 && g.random()<0.5) soloLog(g, 'A', '兵线压制', `${A.tag} 把兵线压进塔下，防御塔剩余 ${Math.round(g.tw.B*100)}%。`); }
      if(g.wave<=0.28){ g.tw.A = Math.max(0, g.tw.A - 0.055); if(g.tw.A>0 && g.random()<0.5) soloLog(g, 'B', '兵线压制', `${B.tag} 把兵线压进塔下，防御塔剩余 ${Math.round(g.tw.A*100)}%。`); }
    }
    // 升级与抢 2 / 抢 6
    for(const f of [A,B]){
      const nl = lvlOf(f.xp);
      if(nl !== f.lvl){
        const old = f.lvl; f.lvl = nl; const hpAbs = f.hp*f.maxhp; f.maxhp = soloMaxHp(f); f.hp = Math.min(1, (hpAbs + (nl-old)*92)/f.maxhp);
        if(nl>=2 && !g.first.lv2){ g.first.lv2 = f.side; f.mood = 6; soloLog(g, f.side, '抢二', `${f.tag} 率先升到 2 级，掌握换血主动权！`); }
        if(nl>=6 && !g.first.lv6){ g.first.lv6 = f.side; f.mood = 8; soloLog(g, f.side, '抢六', `${f.tag} 抢先拿到 6 级大招，${oppSide(f.side)==='A'?A.tag:B.tag} 必须小心了！`, true); }
      }
    }
    if(A.cs>=100 || B.cs>=100){
      const w = A.cs===B.cs ? (A.hp>=B.hp?'A':'B') : (A.cs>B.cs?'A':'B');
      return soloEnd(g, w, '率先百刀', `🌾 ${g.F[w].tag} 率先达成 100 补刀，稳健运营拿下 1v1 选边赛！`);
    }
    if(g.tw.A<=0) return soloEnd(g, 'B', '推平一塔', `🏰 ${B.tag} 持续压制点破中路一塔，赢下 1v1 选边赛！`);
    if(g.tw.B<=0) return soloEnd(g, 'A', '推平一塔', `🏰 ${A.tag} 持续压制点破中路一塔，赢下 1v1 选边赛！`);
  }
  // 位置：围绕兵线来回拉扯；远程站位更靠后
  for(const f of [A,B]){
    if(f.recall>0 || f.away>0) continue;
    const dir = f.side==='A' ? -1 : 1;
    const want = g.wave + dir*(f.ranged?0.09:0.05) + dir*(f.hp<0.4?0.06:0) - dir*(f.mood>0?0.03:0);
    f.s += clamp(want - f.s, -0.04, 0.04) + randn(g.random)*0.006;
    f.s = clamp(f.s, SOLO_TW.A+0.02, SOLO_TW.B-0.02);
    if(f.mood>0) f.mood--;
  }
  // 缩圈：10:00 之后双方被迫贴脸，并持续掉血
  if(g.t >= 600){
    if(g.ring===0){ g.ring=1; soloLog(g, null, '缩圈', '⏳ 10 分钟到！火圈开始收缩，双方被迫贴身肉搏！', true); }
    const elapsed = g.t - 600;
    for(const f of [A,B]){
      f.recall = 0; f.away = 0;
      f.s += (0.5 - f.s)*0.2;
      f.hp -= 0.004 + elapsed*0.00006;
    }
    if(A.hp<=0 || B.hp<=0 || g.t>=SOLO_LAST_TICK){
      const w = A.hp===B.hp ? (g.random()<0.5?'A':'B') : (A.hp>B.hp?'A':'B');
      g.F[w].hp = Math.max(0, g.F[w].hp);
      return soloEnd(g, w, '决死缩圈击杀', `🔥 火圈收缩终极一战！${g.F[w].tag} 顶住压力完成终结，为 ${teamName(w==='A'?g.teamA:g.teamB)} 赢下选边权！`);
    }
    // 火圈越小越容易爆发决战：10:00 刚开始缩圈时以拉扯为主，越接近 12:00 越可能强开
    if(g.t % 5 === 0 && g.random() < 0.1 + elapsed/140){
      if(soloAllIn(g, A.hp*g.random() > B.hp*g.random() ? 'A' : 'B', true)) return;
    }
  }
  if(presA && presB && g.ring===0){
    // 双方都在线：各自判断换血 / 抢级 All-in / 控线
    const order = g.random()<0.5 ? [A,B] : [B,A];
    for(const f of order){
      if(g.over) break;
      const o = g.F[oppSide(f.side)];
      if(f.recall||o.recall) continue;
      // 回城判断
      if(f.hp < 0.36 && (o.hp > f.hp + 0.2 || (f.pots===0 && f.potT===0)) && g.random() < 0.7 + f.mental*0.05){ f.recall = 8; soloLog(g, f.side, '回城补给', `${f.tag} 血量见底只能交出线权回城，${o.tag} 获得推线磨塔的机会。`); continue; }
      if(f.hp < 0.55 && f.pots>0 && f.potT===0){ f.pots--; f.potT = 15; }
      if(f.gold >= 1100 && g.wave > 0.6 === (f.side==='A') && f.hp<0.8 && g.random()<0.08){ f.recall = 8; soloLog(g, f.side, '回城出装', `${f.tag} 推完兵线果断回城，准备把 ${f.gold} 金币换成装备。`); continue; }
      // All-in 判定（击杀线）
      const killLine = soloDps(f)*3.1*(f.lvl>=6?1.35:1) + (f.sum2==='ig'&&f.s2cd===0 ? 0.14*o.maxhp : 0);
      const oHp = o.hp*o.maxhp + (o.sum2==='bar'&&o.s2cd===0 ? 140 : 0);
      const lvAdv = f.lvl - o.lvl + (f.mood>0?0.8:0);
      const aggr = 1 + (f.tags.has('early')?0.25:0) + (f.tags.has('pick')?0.15:0) + f.mental*0.06;
      if(f.comboCd===0 && (o.hp < 0.42 || (f.mood>0 && o.hp<0.6)) && oHp < killLine*aggr*(1+lvAdv*0.15) && f.hp > o.hp + 0.12 && f.mp>0.35){
        if(soloAllIn(g, f.side, false)) return;
        continue;
      }
      // 换血
      if(f.trd<=0 && f.mp > 0.25){
        const edge = (soloDps(f)/f.maxhp*o.maxhp)/(soloDps(o)) ;
        const want = sigmoid((edge-1)*3 + (f.ranged&&!o.ranged?0.5:0) + (f.tags.has('poke')?0.4:0) + lvAdv*0.4 + (f.hp-o.hp)*1.5 + f.mental*0.08 + randn(g.random)*0.6);
        if(g.random() < want*0.45){ soloTrade(g, f, o); }
        f.trd = 6 + Math.floor(g.random()*7);
      }
    }
  }
  if(!g.over && g.rec && (g.t%1===0)) soloRecord(g);
}
function soloBase(g, f){

function soloTrade(g, f, o){

  const hit = g.random() > dodge;

  const dmgF = hit ? 0.085*Math.pow(rel,0.8)*(0.6+g.random()*0.9) : 0.03;

  f.mp = Math.max(0, f.mp - 0.18 - g.random()*0.1); o.mp = Math.max(0, o.mp - 0.06);

    hit ? `${f.tag} ${pickOne(['抓住技能空档','卡住补刀时机','绕到兵线侧面','用一套技能'], g.random)}${big?'打出完整连招':'主动换血'}，${o.tag} 血量掉到 ${Math.round(o.hp*100)}%。`

// 全力 All-in：比较双方击杀所需时间，闪现 / 点燃 / 屏障 / 防御塔都会改变结局
function soloAllIn(g, side, forced){
  const f = g.F[side], o = g.F[oppSide(side)];
  const fDps = soloDps(f)*(f.lvl>=6?1.25:1), oDps = soloDps(o)*(o.lvl>=6?1.25:1);
  let fHp = f.hp*f.maxhp, oHp = o.hp*o.maxhp;
  const notes = [];
  if(f.sum2==='ig' && f.s2cd===0){ oHp -= 0.13*o.maxhp; f.s2cd = 180; notes.push('点燃'); }
  if(o.sum2==='bar' && o.s2cd===0){ oHp += 140; o.s2cd = 180; notes.push(`${o.tag} 交出屏障`); }
  if(o.sum2==='ig' && o.s2cd===0 && !forced){ fHp -= 0.13*f.maxhp; o.s2cd = 180; }
  // 塔下：靠近守方防御塔时进攻方会吃塔伤
  const nearTower = side==='A' ? f.s > 0.8 : f.s < 0.2;
  if(nearTower) fHp -= 180 + 20*f.lvl;
  const skill = (f.mr - o.mr)/14 + (f.mental - o.mental)*0.12*(0.5+pressureOf(null));
  const tf = oHp/Math.max(1,fDps) * Math.exp(-(randn(g.random)*0.32 + skill*0.12));
  const to = fHp/Math.max(1,oDps) * Math.exp(randn(g.random)*0.32);
  f.comboCd = 22; f.mp = Math.max(0, f.mp-0.4);
  g.fx = {k:'allin', s:(f.s+o.s)/2, side}; g.fxT = 3;
  // 势均力敌：双方交完技能各自后撤
  const ratio = to/Math.max(0.01, tf);
  if(!forced && ratio > 0.7 && ratio < 1.45 && g.random() < 0.5){
    f.hp = Math.max(0.06, f.hp - 0.18 - g.random()*0.12); o.hp = Math.max(0.06, o.hp - 0.18 - g.random()*0.12);
    soloLog(g, side, '激烈对拼', `${f.tag} 与 ${o.tag} 打出一波激烈对拼，双方都只剩 ${Math.round(Math.min(f.hp,o.hp)*100)}% 左右血量，各自后撤！`, true);
    return false;
  }
  if(tf < to){
    // 守方闪现逃生的机会
    if(o.flash===0 && !forced && tf > to*0.55 && g.random()<0.7){
      o.flash = 300; o.hp = Math.max(0.05, (o.hp*o.maxhp*0.25)/o.maxhp); f.hp = Math.max(0.08, f.hp - (oDps*tf*0.6)/f.maxhp);
      soloLog(g, side, '闪现逃生', `${f.tag} ${notes.length?notes.join('、')+'，':''}强开 All-in，${o.tag} 残血交闪现极限逃生！`, true);
      return false;
    }
    f.hp = clamp((fHp - oDps*tf*0.85)/f.maxhp, 0.03, 1);
    if(f.flash===0 && tf > to*0.8){ f.flash = 300; notes.unshift('闪现补伤害'); }
    soloEnd(g, side, forced?'决死缩圈击杀':'一血单杀', `💥 ${f.tag}（${f.cn}）${notes.length?notes.join('、')+'，':''}${forced?'在火圈中':''}打满爆发完成单杀！击倒 ${o.tag} 拿下一血！`);
    return true;
  } else {
    // 反杀
    if(f.flash===0 && to > tf*0.72 && g.random()<0.6 && !forced){
      f.flash = 300; f.hp = Math.max(0.05, f.hp*0.3); o.hp = Math.max(0.08, o.hp - (fDps*to*0.5)/o.maxhp);
      soloLog(g, side, '闪现撤退', `${f.tag} 主动开团却没打出伤害，及时交闪现撤离，血量只剩 ${Math.round(f.hp*100)}%。`, true);
      return false;
    }
    o.hp = clamp((oHp - fDps*to*0.85)/o.maxhp, 0.03, 1);
    soloEnd(g, o.side, forced?'决死缩圈击杀':'一血单杀', `🔁 ${f.tag} 强开反被 ${o.tag}（${o.cn}）${nearTower?'借助防御塔':'极限走位'}完成反杀！${o.tag} 拿下一血！`);
    return true;
  }
}

  const cs={}, rows=[];
