  for(let i=0;i<ROLES.length;i++){
    const a=G.rosters.A[i], b=G.rosters.B[i], gd14=Math.round(a.tg-b.tg);
    cs[a.role]=a.cs-b.cs;
    gold+=a.tg-b.tg;
    rows[a.i]={cs14:a.cs,gd14};
    rows[b.i]={cs14:b.cs,gd14:-gd14 || 0};
  }
  return {rows,summary:{gold:Math.round(gold),cs}};
}
const cname = c => `${c.tag}（${c.cn}）`;

// ---------------- 每秒推进 ----------------
function step5(G){
  if(G.over) return;
  const DT = SIM5.DT;
  G.t += DT;
  const t = G.t;
  objTimers(G);
  // 两段过渡期逐刻更新，固定阶段的阵容倍率可以跨步复用。
  const band=t<720?1:t<1020?0:t<1440?2:t<1860?0:3;
  const power=G.phasePower||(G.phasePower={A:1,B:1});
  if(!band || band!==G.powerBand){
    power.A=Math.exp(phaseAdj(G,'A',t)/SIM5.SK);
    power.B=Math.exp(phaseAdj(G,'B',t)/SIM5.SK);
    G.powerBand=band;
  }
  const scaleA=power.A*teamCombatBuff(G.team.A,t), scaleB=power.B*teamCombatBuff(G.team.B,t);
  for(const c of G.rosters.A) c.pw=c.alive && c.recall===0 ? champBasePower(c)*scaleA : 0;
  for(const c of G.rosters.B) c.pw=c.alive && c.recall===0 ? champBasePower(c)*scaleB : 0;
  const aFirst=(t/DT&1)===0;
  if(t >= G.planT){
    G.planT = t + 9;
    plan5(G,aFirst?'A':'B'); plan5(G,aFirst?'B':'A');
  }
  for(const c of G.rosters[aFirst?'A':'B']) tickChamp(G,c);
  for(const c of G.rosters[aFirst?'B':'A']) tickChamp(G,c);
  farmWaves(G);
  laneTrades(G);
  encounters(G);
  objectives(G);
  lanesAndTowers(G);
  if(t===840){
    G.lane14=snapshotLane14(G);
    for(const role of ['TOP','MID','ADC']){
      const i=ROLES.indexOf(role), a=G.rosters.A[i], b=G.rosters.B[i], diff=G.lane14.summary.cs[role];
      const edge=(a.p?.attrs?.lane??a.sk)-(b.p?.attrs?.lane??b.sk);
      if(Math.abs(diff)>=18 && Math.abs(edge)>=6 && diff*edge>0 && diff*(a.at.lane-b.at.lane)>0){
        const lead=diff>0?a:b;
        feed(G,lead.side,'对线压制',lead.tag+' 对线压制，14 分钟补刀领先 '+Math.abs(diff)+' 刀。',true,'lane');
      }
    }
  }
  if(t%21===0){
    let goldA=0, goldB=0, levelEdge=0;
    for(const c of G.rosters.A){ goldA+=c.tg; levelEdge+=c.lvl; }
    for(const c of G.rosters.B){ goldB+=c.tg; levelEdge-=c.lvl; }
    G.gs.push([t,Math.round(goldA-goldB)]);
    const a=G.team.A,b=G.team.B;
    const edge=goldA-goldB+levelEdge*90+(a.towers-b.towers)*120+(a.drakes.length-b.drakes.length)*180;
    const threshold=Math.max(3000,0.055*(goldA+goldB));
    if(t>=840) G.bountySide=edge>threshold?'B':edge< -threshold?'A':null;
  }
  if(G.fx.length && G.fx[0].t < t-4) G.fx = G.fx.filter(f=>f.t>=t-4);
  if(t >= 3600 && !G.over){ // 安全阀：极端拉锯时由经济领先方终结
    const gA = G.champs.filter(c=>c.side==='A').reduce((s,c)=>s+c.tg,0), gB = G.champs.filter(c=>c.side==='B').reduce((s,c)=>s+c.tg,0);
    endGame5(G, gA>=gB?'A':'B');
  }
  if(G.rec){
    recFrame5(G);
    if(t%12===0 || G.over) recStats5(G);
  }
}

function objTimers(G){
  const o = G.obj, t = G.t;
  if(!o.drag.up && o.drag.next!=null && t >= o.drag.next){
    o.drag.up = true; o.drag.prog = 0;
    if(!o.drag.type){
      const used = new Set(G.drakeSeen||[]);
      const cands = DRAKES.filter(x=>!used.has(x[0]));
      const nTaken = G.team.A.drakes.length + G.team.B.drakes.length;
      if(nTaken >= 2 && o.drag.mapType) o.drag.type = o.drag.mapType;
      else o.drag.type = pickOne(cands.length?cands:DRAKES, G.random)[0];
      if(nTaken === 1 && !o.drag.mapType){ o.drag.mapType = pickOne(DRAKES.filter(x=>x[0]!==o.drag.type && !used.has(x[0])), G.random)[0]; }
    }
  }
  if(!o.grubs.up && o.grubs.next!=null && t >= o.grubs.next && t < 840){ o.grubs.up = true; o.grubs.prog = 0; }
  if(o.grubs.up && t >= 840){ o.grubs.up = false; o.grubs.next = null; }
  if(!o.herald.up && o.herald.next!=null && t >= o.herald.next){ o.herald.up = true; o.herald.prog = 0; }
  if(o.herald.up && t >= o.herald.until){ o.herald.up = false; o.herald.next = null; }
  if(!o.baron.up && t >= o.baron.next){ o.baron.up = true; o.baron.prog = 0; if(t===1200) feed(G, null, '大龙刷新', '👾 20 分钟，纳什男爵在峡谷上方苏醒！'); }
  if(o.elder.next!=null && !o.elder.up && t >= o.elder.next){ o.elder.up = true; o.elder.prog = 0; feed(G, null, '远古龙', '🐲 远古巨龙降临峡谷，下一波团战将决定比赛走向！', true); }
  // 水晶（召唤水晶）重生
  for(const tw of G.inhibitors) if(!tw.alive && tw.resp && t >= tw.resp){ tw.alive = true; tw.hp = 1; tw.resp = 0; G.towerDirty = true; if(G.rec) G.evs.push([t,'R',tw.id]); }
}

function farmCamp(G,c){
  const points=MAP5.camps[c.blue?'blue':'red'], ready=G.camps[c.side], t=G.t;
  let i=c.camp;
  if(ready[i]>t+SIM5.DT && t>=c.campPlanT){
    c.campPlanT=t+12;
    let best=Infinity;
    for(let j=0;j<points.length;j++){
      const [x,y]=points[j];
      const score=Math.max(0,ready[j]-t)*13+Math.abs(c.x-x)+Math.abs(c.y-y);
      if(score<best){ best=score; i=j; }
    }
    if(c.camp!==i){ c.camp=i; c.campT=0; }
  }
  const pt=points[i];
  if(t>=ready[i] && Math.abs(c.x-pt[0])+Math.abs(c.y-pt[1])<35){
    c.campT+=SIM5.DT;
    const clear=(t<180?18:12)-clamp((c.skFarm-80)*0.20+c.invest/1800,-3,6);
    if(c.campT>=clear){
      ready[i]=t+CAMP_RESPAWN[i]; c.campT=0; c.campPlanT=0;
      c.cs+=4; c.jungleCs+=4; c.gold+=CAMP_GOLD[i]; c.tg+=CAMP_GOLD[i]; c.xp+=CAMP_XP[i];
    }
  } else c.campT=0;
  return pt;
}

function spawnWaves(G){
  const sec=G.nextWave, n=++G.waveNumber;
  G.nextWave+=sec<840?30:sec<1800?25:20;
  const cannon=sec>=1500 || n%(sec<840?3:2)===0;
  for(const lane of LANES3){
    const melee=cannon&&sec>=840?2:3, caster=sec>=1800?2:3;
    if(G.towerDirty || !G.first) refreshTowers(G);
    const superA=!!G.supLane[G.team.B.color][lane], superB=!!G.supLane[G.team.A.color][lane];
    G.laneWaves[lane].push({due:sec+(lane==='mid'?22:28), minion:0, melee,caster,cannon, superA,superB});
  }
}
function farmWaves(G){
  if(G.t>=G.nextWave) spawnWaves(G);
  for(const lane of LANES3){
    const q=G.laneWaves[lane];
    const wave=q[0]; if(!wave || wave.due>G.t) continue;
    const idx=wave.minion++, base=wave.melee+wave.caster;
    const [x,y]=lanePt(lane,G.front[lane]);
    const regular=idx<wave.melee?MINION.melee:idx<base?MINION.caster:wave.cannon&&idx===base?MINION.cannon:null;
    const t=G.t;
    const superIndex=base+Number(wave.cannon);
    if(regular || (wave.superB && idx===superIndex)) contestLastHit(G,'A',lane,x,y,regular||MINION.super);
    if(regular || (wave.superA && idx===superIndex)) contestLastHit(G,'B',lane,x,y,regular||MINION.super);
    if(wave.minion>=superIndex+Number(wave.superA||wave.superB)) q.shift();
    else wave.due=t+SIM5.DT;
  }
}
function contestLastHit(G,side,lane,x,y,minion){
  let count=0, present=0, farmer=null, support=null, farmScore=-Infinity;
  const roster=G.rosters[side], early=G.t<840;
  for(const c of roster){
    if(!c.alive || c.recall>0 || Math.abs(c.x-x)+Math.abs(c.y-y)>145) continue;
    count++; present |= 1<<c.i;
    const k=c.task.k;
    if(c.task.lane!==lane || (k!=='lane'&&k!=='push'&&k!=='split'&&k!=='defend')) continue;
    if(c.role==='SUP'){ support=c; continue; }
    const score=(early?c.skLane:c.skFarm) + (LANE_OF[c.role]===lane?7:0) + (c.role==='ADC'&&G.t>=840?8:0) + c.hp*7;
    if(score>farmScore){ farmer=c; farmScore=score; }
  }
  if(!count) return;
  const xp=minion[1]*(count===1?1:1.24/count);
  for(const c of roster) if(present & (1<<c.i)) c.xp+=xp;
  const execute=support && farmer && G.t>=support.supportExecute && !support.supDone;
  if(execute){ support.supportExecute=G.t+40; support.gold+=15; support.tg+=15; }
  if(!farmer && support && G.random()<0.28) farmer=support;
  const push=G.front[lane]-0.5;
  const underPressure=G.team[side].blue?Math.min(0,push):Math.min(0,-push);
  if(!farmer || (!execute && G.random()>=clamp(0.89+((early?farmer.skLane:farmer.skFarm)-80)*.004+(farmer.hp-0.7)*0.16+underPressure*0.24,0.52,0.98))) return;
  farmer.cs++; farmer.laneCs++; farmer.gold+=minion[0]; farmer.tg+=minion[0];
}
function lanePos(G, c, lane, off){
  const dir = c.blue ? 1 : -1;
  const s = clamp(G.front[lane] - dir*(off==null?0.03:off), 0.05, 0.95);
  return lanePt(lane, s);
}

// 选手个体行为：移动、发育、回城、复活
function tickChamp(G, c){
  const t = G.t;
  c.px = c.x; c.py = c.y;
  const DT = SIM5.DT;
  if(c.fightCd>0) c.fightCd -= DT;
  // 被动收入
  if(t > 65){ c.gold += 2.04*DT; c.tg += 2.04*DT; }
  if(!c.alive){
    c.rt -= DT;
    if(c.rt <= 0){ c.alive = true; c.hp = 1; const [fx,fy] = MAP5.fountain[c.blue?'blue':'red']; c.x=fx; c.y=fy; c.px=fx; c.py=fy; shop(G, c); }
    return;
  }
  if(c.recall>0){
    c.recall -= DT;
    if(c.recall<=0){ c.recall = 0; const [fx,fy] = MAP5.fountain[c.blue?'blue':'red']; c.x=fx; c.y=fy; c.px=fx; c.py=fy; c.hp=1; c.lastBack=t; shop(G, c); }
    return;
  }
  // 泉水回血
  const fz = MAP5.fountain[c.blue?'blue':'red'];
  if(Math.abs(c.x-fz[0]) + Math.abs(c.y-fz[1]) < 120) c.hp = Math.min(1, c.hp+0.08*DT);
  else c.hp = Math.min(1, c.hp + 0.0025*DT);
  // 目标点
  const tk = c.task;
  if(tk.k!=='jungle') c.campT=0;
  let tx = c.x, ty = c.y;
  if(tk.k==='lane' || tk.k==='split'){ [tx,ty] = lanePos(G, c, tk.lane, tk.k==='split' ? -0.01 : (c.role==='SUP'?0.045:c.ranged?0.04:0.025)); }
  else if(tk.k==='jungle'){
    [tx,ty] = farmCamp(G,c);
  }
  else if(tk.k==='go' || tk.k==='obj' || tk.k==='gank' || tk.k==='push' || tk.k==='defend'){
    if(tk.lane && (tk.k==='push'||tk.k==='defend')) [tx,ty] = lanePos(G, c, tk.lane, tk.k==='push' ? 0.0 : 0.05);
    else { tx = tk.x; ty = tk.y; }
    if(tk.k==='gank' && t > tk.until){ c.task = TK({k: c.role==='JUG'?'jungle':'lane', lane: LANE_OF[c.role]}); }
  }
  else if(tk.k==='base'){ tx = fz[0]; ty = fz[1]; }
  // 视野判断：前方敌人明显更强且不是在守塔/抢资源时，原地后撤等待队友
  if(tk.k!=='base' && t > 120){
    let ep=0, ap=c.pw||0;
    const x=c.x, y=c.y, side=c.side, caution=tk.k==='defend'?2.3:1.7;
    for(const enemy of G.rosters[other(side)]){
      if(enemy.pw && enemy.alive && Math.abs(enemy.x-x)+Math.abs(enemy.y-y)<=300) ep+=enemy.pw;
    }
    if(ep>ap*caution){
      for(const ally of G.rosters[side]){
        if(ally!==c && ally.pw && ally.alive && Math.abs(ally.x-x)+Math.abs(ally.y-y)<=300) ap+=ally.pw;
      }
      if(ep>ap*caution && !(tk.k==='lane' && t<840 && ep<ap*2.6)){
        const bx=fz[0]-x, by=fz[1]-y, bd=hyp(bx,by)||1;
        tx=x+bx/bd*60*DT; ty=y+by/bd*60*DT;
      }
    }
  }
  const dx=tx-c.x, dy=ty-c.y, dd=hyp(dx,dy);
  if(dd>1){
    const spd=SIM5.SPD*(c.bootsDone?1.12:1)*(G.team[c.side].baronT>t?1.1:1);
    const m=Math.min(dd,spd*DT);
    c.x+=dx/dd*m+(G.random()-0.5)*3; c.y+=dy/dd*m+(G.random()-0.5)*3;
  }
  if(t>65 && c.role==='SUP'){ c.gold+=0.55*DT; c.tg+=0.55*DT; }
  while(c.lvl<18 && c.xp>=XP_LV[c.lvl+1]){ c.lvl++; c.powerBase=0; }
  // 回城：残血或者钱够了
  const lowHp = c.hp < (t<840 && c.task.k==='lane' ? 0.36 : 0.3);
  const rich = t-c.lastBack>G.team[c.side].recallWait && (tk.k==='lane'||tk.k==='jungle'||tk.k==='split') && G.front[tk.lane||'mid']!==undefined && c.gold>=nextItemCost(c);
  if((lowHp || (rich && G.random()<0.06*DT)) && tk.k!=='obj' && tk.k!=='defend' && !nearEnemy(G, c, 160)){
    startRecall5(c);
  }
}
function startRecall5(c){
  c.recall = 8;
  c.pw = 0;
}
function nearEnemy(G, c, radius){
  const limit=radius*radius;
  for(const o of G.rosters[other(c.side)]){
    if(!o.alive) continue;
    const x=o.x-c.x,y=o.y-c.y;
    if(x*x+y*y<limit) return true;
  }
  return false;
}
function nextItemCost(c){
  const b = c.build;
  if(b.sup && !c.supDone) return 0;
  if(!c.bootsDone && c.coreIdx>=1) return ITEMS[b.boots][1];
  const id = b.core[c.coreIdx]; return id ? ITEMS[id][1] - (c.partial||0) : 99999;
}
// 回到泉水购物：按出装路线买成装，钱不够就先投资“合成中”的小件
function shop(G, c){
  c.powerBase=0;
  const b = c.build;
  const buy = id => { c.items.push(id); if(G.rec) G.evs.push([G.t,'B',c.i,id]); };
  const remove = slot => { c.items.splice(slot,1); if(G.rec) G.evs.push([G.t,'S',c.i,slot]); };
  if(b.sup && !c.supDone && c.tg > 1100){
    c.supDone = true;
    const mapSlot = c.items.indexOf(3865);
    if(mapSlot>=0) remove(mapSlot);
    buy(b.sup);
  }
  let guard = 0;
  while(guard++ < 4){
    if(!c.bootsDone && c.coreIdx>=1){
      const cost = ITEMS[b.boots][1];
      if(c.gold >= cost){ c.gold -= cost; c.invest += cost; c.bootsDone = true; buy(b.boots); continue; }
      break;
    }
    const id = b.core[c.coreIdx]; if(!id) break;
    const cost = ITEMS[id][1] - (c.partial||0);
    if(c.gold >= cost){
      c.gold -= cost; c.invest += cost; c.partial = 0; c.coreIdx++;
      // 6 格满时卖掉出门装
      if(c.items.length >= 6){ const s = c.items.findIndex(x=>ITEMS[x][2]==='start'); if(s>=0) remove(s); }
      buy(id);
      if(c.coreIdx===2 && (c.role==='MID'||c.role==='ADC') ) feed(G, c.side, '装备成型', `${cname(c)} 两件套成型，输出能力大幅提升。`);
      continue;
    }
    // 先买小件：把一部分钱投入下一件成装
    const part = Math.floor(Math.min(c.gold, cost-1) / 50) * 50;
    if(part >= 300){ c.gold -= part; c.invest += part; c.partial = (c.partial||0) + part; }
    break;
  }
  // 药水
  if(c.items.indexOf(2003)<0 && G.t < 900 && c.gold>=50 && c.items.length<6){ c.gold -= 50; }
}

// ---------------- 团队宏观决策 ----------------
function TK(o){ return {k:o.k, lane:o.lane||null, x:o.x||0, y:o.y||0, o:o.o||null, until:o.until||0}; }
function setTask(c, task){
  const current=c.task;
  current.k=task.k;
  current.lane=task.lane||null;
  current.x=task.x||0;
  current.y=task.y||0;
  current.o=task.o||null;
  current.until=task.until||0;
}
function lanePriority(G, side, lane){
  const direction=G.team[side].blue?1:-1;
  let value=(G.front[lane]-0.5)*direction*2;
  for(const c of G.champs){
    if(LANE_OF[c.role]!==lane || !c.alive || c.recall>0 || c.task.k!=='lane') continue;
    value+=(c.side===side?1:-1)*(c.hp*0.21 + (c.tags.has('early')?0.07:0));
  }
  return clamp(value,-1,1);
}
function riverPriority(G, side, lane){ return lanePriority(G,side,lane)*0.64 + lanePriority(G,side,'mid')*0.36; }
function plan5(G, side){
  const t = G.t, tm = G.team[side], en = other(side);
  const mine = teamChamps(G, side);
  const R = (teamPow(G, side)+1) / (teamPow(G, en)+1);
  const enAlive = aliveN(G, en), myAlive = aliveN(G, side);
  const o = G.obj;
  const blue = tm.blue;
  const stance = G.stance[side];
  const enemyAt = (pt, range) => {
    let count=0;
    for(const c of G.rosters[en]){
      const dx=c.x-pt[0],dy=c.y-pt[1];
      if(c.alive && dx*dx+dy*dy < range*range) count++;
    }
    return count;
  };
  const soon = (key, lead=tm.prep) => o[key].up || (o[key].next!=null && o[key].next-t<lead && o[key].next>t);
  const goObj = (list, pt, kind) => {
    if(!o[kind].up && tm.setup[kind]?.spawn!==o[kind].next)
      tm.setup[kind]={spawn:o[kind].next,t};
    list.forEach(c=>{ if(c.alive) setTask(c, {k:'obj', x:pt[0]+(G.random()-0.5)*30, y:pt[1]+(G.random()-0.5)*30, o:kind}); });
  };

  if(t < 840){
    // ===== 对线期 =====
    for(const c of mine){
      if((c.task.k==='gank' && t<=c.task.until) || (c.task.k==='obj' && soon(c.task.o))) continue;
      const kind=c.role==='JUG'?'jungle':'lane', lane=LANE_OF[c.role];
      if(c.task.k!==kind || c.task.lane!==lane) setTask(c,{k:kind,lane});
    }
    const jg = mine.find(c=>c.role==='JUG');
    // 打野 Gank
    if(jg && jg.alive && jg.recall===0 && t >= tm.gankT && jg.task.k==='jungle'){
      const early = (tm.tags.early||0) + (tm.tags.pick||0)*0.6;
      let best=null, bs=-1e9;
      for(const lane of LANES3){
        const foes = G.champs.filter(x=>x.side===en && x.alive && x.task.k==='lane' && x.task.lane===lane);
        if(!foes.length) continue;
        const allies = mine.filter(x=>x.alive && x.task.k==='lane' && x.task.lane===lane);
        const over = blue ? (0.5 - G.front[lane]) : (G.front[lane]-0.5); // 敌方压线越深越好抓
        const setup=allies.reduce((s,a)=>s+a.combat.control*a.hp,0);
        const escape=foes.reduce((s,f)=>s+f.combat.escape,0);
        const sc = foes.reduce((s,f)=>s+(1-f.hp),0)*1.4 + over*3 + allies.reduce((s,a)=>s+a.hp,0)*0.4 + setup*0.35 - escape*0.22 + (lane==='bot'&&t>300?0.3:0) + G.random()*0.9;
        if(sc > bs){ bs = sc; best = lane; }
      }
      if(best){
        const [gx,gy] = lanePt(best, clamp(G.front[best] + (blue?0.02:-0.02), 0.08, 0.92));
        setTask(jg, {k:'gank', lane:best, x:gx, y:gy, until: t+38});
        tm.gankT = t + 150 + G.random()*80 - early*14;
      } else tm.gankT = t + 30;
    }
    // 辅助游走
    const sup = mine.find(c=>c.role==='SUP');
    if(sup && sup.alive && t >= tm.roamT && sup.task.k==='lane' && lanePriority(G,side,'bot')>-0.15 && (sup.tags.has('engage')||sup.tags.has('pick'))){
      const [gx,gy] = lanePt('mid', clamp(G.front.mid + (blue?0.03:-0.03), 0.1, 0.9));
      setTask(sup, {k:'gank', lane:'mid', x:gx, y:gy, until:t+30});
      tm.roamT = t + 200 + G.random()*120;
    }
    // 小龙
    if(soon('drag',tm.prep-3)){
      const grp = mine.filter(c=>['JUG','SUP','ADC'].includes(c.role) && c.alive && c.recall===0);
      const prioBot = riverPriority(G,side,'bot');
      const enAtPit = enemyAt(MAP5.dragon, 220);
      const ourAtPit = mine.filter(c=>c.task.k==='obj' && c.task.o==='drag').length;
      const want = grp.some(c=>c.role==='JUG') && grp.length>=2 && grp.every(c=>c.hp>0.45) && (prioBot>0.05 || enAtPit>0 || R>1.15) && (enAtPit===0 || R + prioBot*0.10 > 0.8);
      if(want || ourAtPit){ goObj(grp, MAP5.dragon, 'drag'); const md = mine.find(c=>c.role==='MID'); if(md && md.alive && md.recall===0 && md.hp>0.5 && (enAtPit>=2 || (lanePriority(G,side,'mid')>-0.1 && G.random()<0.4))) goObj([md], MAP5.dragon, 'drag'); }
    }
    // 巢虫
    if(soon('grubs',Math.max(0,tm.macro*5))){
      const grp = mine.filter(c=>['JUG','TOP'].includes(c.role) && c.alive && c.recall===0);
      const prioTop = riverPriority(G,side,'top');
      const enAtPit = enemyAt(MAP5.baron, 220);
      if(grp.length && grp.every(c=>c.hp>0.5) && (prioTop>0 || R>1.1 || enAtPit) && (enAtPit===0 || R + prioTop*0.10>0.85)) goObj(grp, MAP5.baron, 'grubs');
    }
    return;
  }

  // ===== 中后期：抱团、拿资源、分推、推进 =====
  const late = t >= 1500;
  // 分推手：带 split 标签的上/中单，否则无
  if(tm.split===null){
    let sp=null;
    for(const c of mine){
      if(c.tags.has('split') && (c.role==='TOP'||c.role==='MID') && (!sp || c.sk>sp.sk)) sp=c;
    }
    tm.split = sp ? sp.i : -1;
  }
  const splitter = tm.split>=0 ? G.champs[tm.split] : null;
  // 资源目标
  let focus = null;
  const objOK = (key, pt, need) => {
    const lead=key==='drag' ? tm.prep+2 : Math.max(0,tm.macro*6+5);
    if(!soon(key,lead)) return false;
    const enAtPit = enemyAt(pt, 260);
    if(R >= need || enAlive <= myAlive-2 || (enAtPit>0 && R>=need*0.85)) return true;
    // 落后方可以靠近资源的一侧先到，等满血队友集结后争夺。
    if(G.bountySide!==side || myAlive<4 || enAtPit>=4 || R<0.72) return false;
    let ready=0, jungleReady=false;
    for(const c of mine){
      if(!c.alive || c.recall || c.hp<0.64 || Math.abs(c.x-pt[0])+Math.abs(c.y-pt[1])>365) continue;
      ready++;
      if(c.role==='JUG') jungleReady=true;
    }
    return ready>=3 && jungleReady && ready>enAtPit;
  };
  if(objOK('elder', MAP5.dragon, 0.85)) focus = {k:'obj', o:'elder', pt:MAP5.dragon};
  else if(objOK('baron', MAP5.baron, late?1.05:1.2)) focus = {k:'obj', o:'baron', pt:MAP5.baron};
  else if(o.drag.next!=null && objOK('drag', MAP5.dragon, tm.drakes.length>=3||G.team[en].drakes.length>=3 ? 0.8 : 0.95)) focus = {k:'obj', o:'drag', pt:MAP5.dragon};
  else if(objOK('herald', MAP5.baron, 1.0)) focus = {k:'obj', o:'herald', pt:MAP5.baron};
  // 推进 / 防守
  let siege = null, defend = null;
  // 敌方在推我方塔？
  for(const lane of LANES3){
    const tw = firstAlive(G, tm.color, lane);
    if(!tw) continue;
    const attackers = enemyAt([tw.x,tw.y],160);
    if(attackers>=2 && (!defend || attackers > defend.n)) defend = {lane, n:attackers, tw};
  }
  const aggro = stance==='push' ? 0.85 : stance==='safe' ? 1.25 : 1;
  if(!focus){
    if(R >= tm.siegeNeed*aggro || enAlive <= myAlive-1 || (late && R>=0.94*aggro && G.random()<0.6)){
      // 选最容易推的路：敌方该路第一座存活建筑层级越低越好、兵线越深越好
      let best=null, bs=-1e9;
      for(const lane of LANES3){
        const tw = firstAlive(G, G.team[en].color, lane) || null;
        const tier = tw ? tw.tier : 7;
        const depth = blue ? G.front[lane] : 1-G.front[lane];
        const sc = depth*2 - (tier>=5?0:tier*0.3) + (lane==='mid'?0.4:0) + G.random()*0.5 + (tw&&tw.tier===4?0.8:0);
        if(sc>bs){ bs=sc; best=lane; }
      }
      siege = best;
      // 敌方所有路的水晶都破了 → 直取主基地
      const nexT = G.towers.find(x=>x.side===G.team[en].color && x.tier>=5 && x.alive);
      const inhibDown = G.towers.some(x=>x.side===G.team[en].color && x.tier===4 && !x.alive);
      if(inhibDown && (enAlive <= 2 || R > 1.6)) { focus = {k:'go', pt: nexT ? [nexT.x,nexT.y] : MAP5.nexus[G.team[en].color], o:'nexus'}; }
    }
  }
  if(defend && !focus && (R >= 0.85 || defend.tw.tier>=3)) focus = {k:'defend', lane:defend.lane};
  // 对手已在一侧集结，而本方没有争夺窗口时，用另一侧兵线换取空间。
  if(!focus && !siege && t < 2100){
    const opposite=enemyAt(MAP5.dragon,205)>=3 && o.drag.up ? 'top' :
      enemyAt(MAP5.baron,205)>=3 && (o.baron.up||o.herald.up) ? 'bot' : null;
    const front=opposite && (blue?G.front[opposite]:1-G.front[opposite]);
    if(front>clamp(.44-tm.macro*.005,.39,.49) && myAlive>=3 && R>0.72) siege=opposite;
  }
  const grouped = [];
  for(const c of mine){
    if(c.task.k==='gank' && t <= c.task.until) continue;
    if(splitter && c===splitter && (!focus || focus.o!=='baron' && focus.o!=='elder' || R < 0.9) && t < 2400){
      const sideLane = focus && focus.pt && focus.pt[1] < 500 ? 'bot' : 'top';
      setTask(c, {k:'split', lane: c.role==='TOP' ? (focus&&focus.o==='baron'?'bot':'top') : sideLane});
      continue;
    }
    grouped.push(c);
  }
  if(focus && focus.k==='obj') goObj(grouped, focus.pt, focus.o);
  else if(focus && focus.k==='go') grouped.forEach(c=>setTask(c, {k:'go', x:focus.pt[0]+(G.random()-0.5)*40, y:focus.pt[1]+(G.random()-0.5)*40}));
  else if(focus && focus.k==='defend') grouped.forEach(c=>setTask(c, {k:'defend', lane:focus.lane}));
  else if(siege) grouped.forEach(c=>setTask(c, {k:'push', lane:siege}));
  else {
    // 均势或落后：分线发育，打野刷野；中期 ADC/辅助常常转中路
    for(const c of grouped){
      let lane = LANE_OF[c.role];
      if(c.role==='JUG'){ setTask(c, {k:'jungle'}); continue; }
      if(!late && (c.role==='ADC'||c.role==='SUP') && t>960-tm.macro*5) lane = 'mid';
      if(late && c.role!=='TOP') lane = 'mid';
      setTask(c, {k:'lane', lane});
    }
    // 中期抓单：有抓单英雄且敌方分推手孤立时，派人包夹
    const enSplit = G.team[en].split>=0 ? G.champs[G.team[en].split] : null;
    if(enSplit && enSplit.alive && enSplit.task.k==='split' && (tm.tags.pick||0) + (tm.tags.engage||0) >= 2 && G.random()<0.35){
      const lonely = !G.champs.some(x=>x.side===en && x!==enSplit && x.alive && hyp(x.x-enSplit.x,x.y-enSplit.y)<300);
      if(lonely){
        const hunters = mine.filter(c=>c.alive && c!==splitter && (c.role==='JUG' || c.tags.has('pick') || c.tags.has('engage'))).slice(0,3);
        hunters.forEach(h=>setTask(h, {k:'gank', lane:enSplit.task.lane, x:enSplit.x, y:enSplit.y, until:t+30}));
      }
    }
  }
}
function firstAlive(G, color, lane){
  if(!G.towerDirty && G.first) return G.first[color][lane] || null;
  let best = null;
  for(const tw of G.towers) if(tw.side===color && tw.lane===lane && tw.alive && (!best || tw.tier < best.tier)) best = tw;
  return best;
}

// ---------------- 对线换血（对线期每条线定时结算） ----------------
function laneTrades(G){
  const t = G.t;
  for(const lane of LANES3){
    if(t < G.laneT[lane]) continue;
    G.laneT[lane] = t + (t<840 ? 22 + G.random()*16 : 30 + G.random()*20);
    const [x,y]=lanePt(lane,G.front[lane]);
    const near = (c) => c.alive && c.recall===0 && c.task.lane===lane && (c.task.k==='lane'||c.task.k==='split') && hyp(c.x-x,c.y-y) < 120;
    const a = G.champs.filter(c=>c.side==='A' && near(c)), b = G.champs.filter(c=>c.side==='B' && near(c));
    if(!a.length || !b.length) continue;
    const tradePower=(own,enemy)=>{
      const theirLevel=Math.max(...enemy.map(c=>c.lvl));
      const theirRange=enemy.some(c=>c.ranged);
      return own.reduce((sum,c)=>{
        const spike=t<840 && ((c.lvl>=2 && theirLevel<2)||(c.lvl>=6 && theirLevel<6)) ? 0.14 : 0;
        const reach=c.ranged && !theirRange ? 0.08 : 0;
        return sum+champPow(G,c,0,t<840?c.laneMul:1)*(1+spike+reach+(c.tags.has('early')?0.12:0)+(c.tags.has('poke')?0.08:0));
      },0);
    };
    const pa=tradePower(a,b), pb=tradePower(b,a);
    const pA = pa*pa/(pa*pa+pb*pb);
    const aWin = G.random() < pA;
    const [W,L] = aWin ? [a,b] : [b,a];
    const marg = Math.abs(pA-0.5)*2;
    const depth=W[0].blue?G.front[lane]:1-G.front[lane];
    L.forEach(c=>c.hp = Math.max(0.05, c.hp - (0.07 + G.random()*0.12 + marg*0.08)*(depth>0.61?0.72:1)));
    W.forEach(c=>c.hp = Math.max(0.08, c.hp - (0.02 + G.random()*0.08)));
    G.front[lane] = clamp(G.front[lane] + ((W[0].blue)?1:-1)*0.035, 0.12, 0.88);
    // 残血被击杀：单杀 / 二打二
    const dying = L.filter(c=>c.hp < 0.2);
    if(dying.length && G.random() < 0.2 + marg*0.25){
      resolveFight(G, a, b, 'lane', true);
    }
  }
}

// ---------------- 遭遇检测 → 团战 / 抓人 ----------------
function riverObjectiveReady(G,key){
  const o=G.obj[key];
  return o.up || (o.next!=null && o.next>G.t && o.next-G.t<=15 &&
    (G.team.A.setup[key]?.spawn===o.next || G.team.B.setup[key]?.spawn===o.next));
}
function visionEdgeFor(G,side,key){
  const tm=G.team[side], opponent=G.team[other(side)], setup=tm.setup[key];
  if(!setup || tm.macro-opponent.macro<6 || setup.spawn-setup.t<30) return false;
  const theirs=opponent.setup[key];
  return theirs?.spawn!==setup.spawn || theirs.t-setup.t>=24;
}
function fightObjective(G, x, y){
  const atDragon=Math.abs(x-MAP5.dragon[0])+Math.abs(y-MAP5.dragon[1])<190;
  if(atDragon){
    if(riverObjectiveReady(G,'elder')) return 'elder';
    if(riverObjectiveReady(G,'drag')) return 'drag';
  }
  const atBaron=Math.abs(x-MAP5.baron[0])+Math.abs(y-MAP5.baron[1])<190;
  if(atBaron){
    if(riverObjectiveReady(G,'baron')) return 'baron';
    if(riverObjectiveReady(G,'herald')) return 'herald';
    if(riverObjectiveReady(G,'grubs')) return 'grubs';
  }
  return null;
}
function advanceEngagements(G,used){
  for(let i=G.engagements.length-1;i>=0;i--){
    const battle=G.engagements[i], A=[], B=[];
    const entry=battle.resource?142:122;
    for(const c of G.champs){
      if(!c.alive || c.recall>0 || c.fightCd>0 || used[c.i]) continue;
      if(Math.abs(c.x-battle.x)+Math.abs(c.y-battle.y)>entry) continue;
      used[c.i]=true;
      if(!battle.arrival[c.i]) battle.arrival[c.i]=G.t;
      (c.side==='A'?A:B).push(c);
    }
    if(G.t<battle.end) continue;
    G.engagements.splice(i,1);
    if(!A.length || !B.length) continue;
    const n=A.length+B.length;
    const kind=A.length>=2&&B.length>=2&&n>=6?'team':Math.min(A.length,B.length)===1&&n>=3?'gank':'skirm';
    resolveFight(G,A,B,kind,false,battle);
  }
}
function encounters(G){
  const cs = G.champs, R = SIM5.ENC, early = G.t < 840;
  const flipped=G.t/SIM5.DT&1;
  const first=flipped ? G.rosters.B : G.rosters.A;
  const second=flipped ? G.rosters.A : G.rosters.B;
  const used = G._used || (G._used = new Array(10));
  used.fill(false);
  if(G.engagements.length) advanceEngagements(G,used);
  for(const c of first){
    if(!c.alive || c.recall>0 || c.fightCd>0 || used[c.i]) continue;
    for(const o of second){
      if(!o.alive || o.recall>0 || o.fightCd>0 || used[o.i]) continue;
      const dx = o.x-c.x, dy = o.y-c.y;
      if(dx > R || dx < -R || dy > R || dy < -R || dx*dx+dy*dy > R*R) continue;
      // 对线期：线上对峙由 laneTrades 处理，只有 Gank / 资源争夺 / 入侵才会爆发遭遇战
      {
        const ck = c.task.k, ok = o.task.k;
        const act = ck==='gank'||ck==='obj'||ok==='gank'||ok==='obj'||ck==='push'||ok==='push'||ck==='defend'||ok==='defend'||ck==='go'||ok==='go';
        const calm = G.team.A.calmT > G.t && G.team.B.calmT > G.t;
        if(calm){ const hot = ck==='obj'||ok==='obj'; if(G.random() < (hot ? 0.75 : 0.9)) continue; }
        if(!act){
          if(early){ if(!(ck==='jungle' && ok==='jungle' && G.random() < 0.04)) continue; }
          else if((ck==='lane'||ck==='split') && (ok==='lane'||ok==='split') && c.task.lane===o.task.lane) continue;
          else if(G.random() > 0.35) continue;
        }
      }
      const cx = (c.x+o.x)/2, cy = (c.y+o.y)/2;
      const A = [], B = [];
      let pa = 0, pb = 0;
      for(let k=0;k<10;k++){
        const x = cs[k];
        if(!x.alive || x.recall>0 || x.fightCd>0 || used[k]) continue;
        if(Math.abs(x.x-cx) > 150 || Math.abs(x.y-cy) > 150) continue;
        if(x.side==='A'){ A.push(x); pa += x.pw; } else { B.push(x); pb += x.pw; }
      }
      if(!A.length || !B.length) continue;
      for(const x of A) used[x.i] = true; for(const x of B) used[x.i] = true;
      // 弱势方可能拉扯脱离
      const gankingA=A.some(x=>x.task.k==='gank'), gankingB=B.some(x=>x.task.k==='gank');
      if(gankingA!==gankingB){
        if(gankingA) pb=B.reduce((sum,x)=>sum+x.pw*x.gankMul,0);
        else pa=A.reduce((sum,x)=>sum+x.pw*x.gankMul,0);
      }
      const weak = pa < pb ? A : B, ratio = Math.min(pa,pb)/Math.max(pa,pb,1e-9);
      const defending = weak.some(x=>x.task.k==='defend');
      const n = A.length + B.length;
      const escape = ratio < 0.7 ? (defending ? (ratio < 0.55 ? 0.55 : 0) : 0.7 + (weak.some(x=>x.tags.has('protect'))?0.08:0) - (n>=7?0.15:0)) : 0;
      if(G.random() < escape){
        for(const x of weak){ x.fightCd = 8; x.hp = Math.max(0.1, x.hp-0.1); if(x.hp<0.45) startRecall5(x); else setTask(x, {k:'base'}); }
        break;
      }
      const resource=fightObjective(G,cx,cy);
      const arrival=[];
      for(const x of A) arrival[x.i]=G.t;
      for(const x of B) arrival[x.i]=G.t;
      G.engagements.push({x:cx,y:cy,resource,arrival,end:G.t+(resource?9:6)});
      if(G.rec){
        G.fx.push({t:G.t,x:cx,y:cy,n:0});
        G.evs.push([G.t,'F',Math.round(cx),Math.round(cy),0]);
      }
      break;
    }
  }
}

function fightProfile(group){
  const sum={...EMPTY_COMBAT_PROFILE,poke:0};
  for(const c of group){
    const k=c.combat, ready=0.45+0.55*c.hp;
    for(const key in k) sum[key]+=k[key]*ready;
    // 只有反制英雄实际进场时才会加强这一手。对手没有对应机制时不产生收益。
    if(c.counter){
      const prepared=c.counter*ready*0.85;
      sum.antiDash+=k.antiDash*prepared;
      sum.antiMagic+=k.antiMagic*prepared;
      sum.antiAuto+=k.antiAuto*prepared;
      sum.guardProjectile+=k.guardProjectile*prepared;
    }
    if(c.tags.has('poke')) sum.poke+=ready;
  }
  return sum;
}
function localFightBonus(own, enemy, kind, river){
  const chain=Math.min(2.4,own.control)*(0.014 + Math.min(1.8,own.engage)*0.009);
  const opening=own.engage/(1+0.35*enemy.protect+0.30*enemy.antiDash*own.dash);
  const zoning=own.antiDash*Math.min(2.2,enemy.dash)*0.023;
  const defense=own.antiMagic*Math.min(2.8,enemy.magic)*0.013 + own.antiAuto*Math.min(2.3,enemy.sustained)*0.017 + own.guardProjectile*Math.min(2.4,enemy.projectile)*0.015;
  if(kind!=='team') return clamp(chain + opening*0.019 + zoning + defense - enemy.escape*0.009,-0.05,0.12);
  const screen=Math.min(2.2,own.frontline)*Math.min(2.4,own.sustained)*0.016;
  const peel=Math.min(2,own.protect)*Math.min(2.4,enemy.engage)*0.016;
  return clamp(chain + opening*0.019 + zoning + defense + screen + peel + own.poke*(river?0.014:0.008),0,0.19);
}
// 团战/抓人结算：集火、击杀、助攻（严格对账），存活者状态
function resolveFight(G, A, B, kind, laneFight, battle){
  const t = G.t;
  const fx=battle?.x ?? (A[0].x+B[0].x)/2, fy=battle?.y ?? (A[0].y+B[0].y)/2;
  const near = (pt, r) => hyp(fx-pt[0], fy-pt[1]) < r;
  const atBaron = near(MAP5.baron, 200), atDragon = near(MAP5.dragon, 200);
  const big = (atBaron && (G.obj.baron.up)) || (atDragon && (G.obj.elder.up || (G.team.A.drakes.length>=3||G.team.B.drakes.length>=3)));
  let goldA=0,goldB=0;
  for(const champ of G.champs){ if(champ.side==='A') goldA+=champ.tg; else goldB+=champ.tg; }
  const seriesPressure=pressureOf(G.d.ctx);
  const teamfight=big || Math.max(A.length,B.length)>=4;
  const gank=kind==='gank' ? (A.length<B.length?'A':'B') : null;
  const g5Mode=c=>laneFight ? c.laneMul : teamfight ? c.fightMul : c.side===gank ? c.gankMul : c.skirmMul;
  const pressSide = s => {
    let p = big ? 0.8 : kind==='team' ? 0.35 : 0.15;
    const behind = s==='A' ? goldB-goldA : goldA-goldB;
    if(behind > 3000) p += 0.35;
    return p + seriesPressure*0.5;
  };
  const profileA=fightProfile(A), profileB=fightProfile(B);
  const sidePow = (L, s, own, enemy, omit) => {
    let p = 0;
    const pressure=pressSide(s);
    const behind=(s==='A' ? goldB-goldA : goldA-goldB)>3000;
    const high=(big ? .60 : 0)+(behind ? .35 : 0)+seriesPressure*.45+(G.d.ctx?.matchPoint && !G.d.ctx.decider ? .12 : 0);
    for(const c of L){
      const late=battle ? Math.min(2,(t-battle.arrival[c.i])/SIM5.DT) : 2;
      const stress=omit==='ment'?0:high+(c.deathStreak>=2 ? .35 : 0);
      p += champPow(G,c,pressure,omit==='stage'?1:g5Mode(c),stress)*(0.90+late*0.05);
    }
    // 塔下防守优势
    const myColor = G.team[s].color;
    for(const tw of G.towers){ if(tw.side===myColor && tw.alive && Math.abs(tw.x-L[0].x)+Math.abs(tw.y-L[0].y) < 170){ p *= tw.tier===1 ? 1.1 : 1.18; break; } }
    return p * (1+localFightBonus(own,enemy,kind,atBaron||atDragon));
  };
  const noiseA=Math.exp(randn(G.random)*SIM5.FN), noiseB=Math.exp(randn(G.random)*SIM5.FN);
  const pa=sidePow(A,'A',profileA,profileB)*noiseA, pb=sidePow(B,'B',profileB,profileA)*noiseB;
  const chance=(a,b)=>a*a/(a*a+b*b);
  const pAwin=chance(pa,pb);
  const roll=G.random(), aWin=roll<pAwin;
  const W = aWin ? A : B, L = aWin ? B : A;
  const margin = Math.abs(pa*pa-pb*pb)/(pa*pa+pb*pb);
  let attr=null;
  if(G.attrFeedCount<8){
    const key=laneFight?'lane':teamfight?'tf':'react';
    const average=(group,k)=>group.reduce((sum,c)=>sum+(c.p?.attrs?.[k]??c.sk),0)/group.length;
    const decided=(k,omit)=>average(W,k)-average(L,k)>=6 &&
      aWin!==(roll<chance(sidePow(A,'A',profileA,profileB,omit)*noiseA,sidePow(B,'B',profileB,profileA,omit)*noiseB));
    if(decided(key,'stage')) attr=key;
    else if((big || seriesPressure || Math.abs(goldA-goldB)>3000 || W.some(c=>c.deathStreak>=2))
      && decided('ment','ment')) attr='ment';
  }
  const plBase = laneFight ? 0.2 : kind==='gank' ? 0.12 : kind==='team' ? 0.11 : 0.13;
  const deathsL = [], deathsW = [];
  const facecheckRisk=L.length<=2 && battle?.resource && visionEdgeFor(G,W[0].side,battle.resource) ? .07 : 0;
  const lateFight=teamfight && t>=1500;
  const exposure=c=>clamp(-c.at.tf*.004,-.10,.10);
  let facecheck=false;
  const lossProfile=aWin?profileB:profileA, winProfile=aWin?profileA:profileB;
  const stoppedDive=laneFight?0:Math.min(0.23,lossProfile.antiDash*winProfile.dash*0.075);
  for(const c of L){
    let pl = plBase + margin*0.5 + (1-c.hp)*0.2 - (c.tags.has('protect')?0.04:0) + (c.mental<=-2?0.06:0);
    if(c.side===gank) pl -= clamp((.275*c.at.lane+.425*c.at.react)*.007,-.08,.08);
    if(!laneFight) pl += Math.min(2,winProfile.control)*0.017 - c.combat.frontline*0.034 - c.combat.escape*0.026 - Math.min(2,lossProfile.protect)*0.013 - stoppedDive;
    if(laneFight && c.hp < 0.2) pl += 0.5;
    if(lateFight) pl+=exposure(c);
    const casualtyRoll=G.random();
    if(casualtyRoll<clamp(pl+facecheckRisk,.05,.95)){
      deathsL.push(c);
      if(facecheckRisk && casualtyRoll>=clamp(pl,.05,.95)) facecheck=true;
    }
  }
  for(const c of W){
    const pw = laneFight ? 0.02 : 0.03 + 0.22*(1-margin)*(kind==='team'?1:0.5) + (1-c.hp)*0.08 + (lateFight ? exposure(c)*.5 : 0);
    if(G.random() < clamp(pw, 0.01, 0.4)) deathsW.push(c);
  }
  if(!deathsL.length && !laneFight && kind!=='skirm' && G.random() < 0.55-stoppedDive){ deathsL.push(wpick(L, c=>1.5-c.hp, G.random)); }
  if(laneFight && !deathsL.length){ const lo = L.slice().sort((x,y)=>x.hp-y.hp)[0]; if(lo.hp<0.2) deathsL.push(lo); }
  G.fx.push({t, x:fx, y:fy, n: deathsL.length+deathsW.length});
  if(G.rec) G.evs.push([t,'F',Math.round(fx),Math.round(fy),deathsL.length+deathsW.length]);
  const killW = {TOP:1, JUG:1.1, MID:1.35, ADC:1.6, SUP:0.3};
  const doKill = (victim, killers, allies) => {
    const alive = killers.filter(c=>c.alive);
    const pool = alive.length ? alive : killers;
    const killer = wpick(pool, c=>killW[c.role]*champPow(G,c,0,g5Mode(c))*(c.tags.has('pick')?1.15:1)+0.01, G.random);
    const assists = allies.filter(c=>c!==killer && G.random() < (kind==='team'?0.82:0.7));
    applyKill(G, killer, victim, assists);
  };
  // 交错结算：败方阵亡与胜方阵亡按顺序穿插
  const order = [];
  deathsL.forEach(v=>order.push([v, W]));
  deathsW.forEach(v=>order.splice(Math.floor(G.random()*(order.length+1)), 0, [v, L]));
  let killsBy = {A:0, B:0};
  for(const [v, ks] of order){ if(!v.alive) continue; const kset = ks; doKill(v, kset, kset); killsBy[v.side==='A'?'B':'A']++; }
  // 存活者状态
  for(const c of L) if(c.alive){ c.hp = Math.max(0.06, c.hp*(0.35+G.random()*0.3)); c.fightCd = 15; if(c.hp < 0.45){ setTask(c, {k:'base'}); startRecall5(c); } }
  for(const c of W) if(c.alive){ c.hp = Math.max(0.1, c.hp*(0.55+G.random()*0.35)); c.fightCd = 9; }
  if(!laneFight){ G.planT = t; if(kind!=='gank'){ G.team.A.calmT = t + 75; G.team.B.calmT = t + 75; } }
  // 团灭 / 团战播报
  const lSide = L[0].side;
  if(facecheck){
    feed(G,W[0].side,'运营失误',G.team[lSide].name+' 无视野探河道，被 '+G.team[W[0].side].name+' 抓到。',true,'macro');
  } else if(attr && (deathsL.length||deathsW.length)){
    const tag={lane:'对线压制',tf:'团战发挥',react:'极限操作',ment:'稳住心态'}[attr];
    const leader=W.reduce((a,b)=>b.at[attr]>a.at[attr]?b:a);
    feed(G,leader.side,tag,leader.tag+' 凭'+ATTR_CN[attr]+'优势帮助队伍赢下这次交锋。',true,attr);
  }
  if(battle?.resource && (deathsL.length||deathsW.length)){
    const target={drag:'小龙',elder:'远古龙',baron:'男爵',herald:'先锋',grubs:'虚空巢虫'}[battle.resource];
    feed(G,W[0].side,'资源争夺',`${target}河道 ${A.length} 对 ${B.length}，${G.team[W[0].side].name} 打出 ${killsBy[W[0].side]} 换 ${killsBy[lSide]}。`,true);
  } else if(kind==='team' && deathsL.length>=3){
    const aced = aliveN(G, lSide)===0;
    feed(G, W[0].side, aced?'团灭':'团战胜利', aced ? `☠️ ${G.team[W[0].side].name} 打出一波团灭！${G.team[lSide].name} 全员阵亡！` : `⚔️ ${G.team[W[0].side].name} 团战 ${killsBy[W[0].side]} 换 ${killsBy[lSide]} 大获全胜！`, true);
  } else if((kind==='team'||kind==='skirm') && (deathsL.length||deathsW.length)){
    feed(G, W[0].side, kind==='team'?'团战':'小规模交战', `${G.team[W[0].side].name} 在${atBaron?'大龙坑':atDragon?'小龙坑':'野区'}附近打出 ${killsBy[W[0].side]} 换 ${killsBy[lSide]} 的交换。`);
  }
  // 抢龙：团战败方的打野在资源快被拿下时惩戒抢走
  for(const key of ['baron','drag','elder']){
    const ob = G.obj[key];
    if(!ob.up || ob.prog < 0.55) continue;
    const pit = key==='baron' ? MAP5.baron : MAP5.dragon;
    if(hyp(fx-pit[0], fy-pit[1]) > 220) continue;
    const jg = G.champs.find(c=>c.side===lSide && c.role==='JUG' && c.alive && c.recall===0 && hyp(c.x-pit[0],c.y-pit[1])<200);
    const defendingJg=W.some(c=>c.role==='JUG' && c.alive && c.recall===0);
    if(jg && ob.by===W[0].side){
      const base=defendingJg?.14:.28, roll=G.random();
      const macro=G.team[lSide].macro-G.team[W[0].side].macro;
      const extra=(sigmoid(macro/4)-.5)*.25;
      if(roll<base+extra) takeObj(G,key,lSide,true,macro>=6 && roll>=base);
    }
  }
}

function applyKill(G, killer, victim, assists){
  const t = G.t;
  victim.alive = false; victim.hp = 0; victim.d++; victim.deathStreak++;
  victim.pw = 0;
  const rt = BRW[victim.lvl-1] * (1 + Math.max(0, t/60-15)*0.018);
  victim.rt = Math.round(rt); victim.recall = 0;
  victim.task = TK({k: victim.role==='JUG'?'jungle':'lane', lane: LANE_OF[victim.role]});
  killer.k++; killer.streak++; killer.deathStreak=0;
  assists.forEach(a=>a.a++);
  const shut = victim.streak >= 3 && G.bountySide!==victim.side ? Math.min(700, 200*(victim.streak-2)) : 0;
  victim.streak = 0;
  const gold = 300 + (G.firstBlood ? 0 : 100);
  killer.gold += gold+shut; killer.tg += gold+shut;
  if(assists.length){ const share = gold*0.5/assists.length; assists.forEach(a=>{ a.gold += share; a.tg += share; }); }
  const xp = 140 + victim.lvl*28; killer.xp += xp*0.6; assists.forEach(a=>a.xp += xp*0.4/assists.length);
  G.team[killer.side].kills++;
  if(G.rec) G.evs.push([t,'K',killer.i,victim.i,assists.map(a=>a.i),victim.rt]);
  // 战报
  const lk = G.lastKill[killer.i];
  let multi = 1;
  if(lk && t - lk.t <= 10){ multi = lk.n + 1; }
  G.lastKill[killer.i] = {t, n:multi};
  const MULTI = {2:'双杀',3:'三杀',4:'四杀',5:'五杀'};
  if(!G.firstBlood){
    G.firstBlood = killer.side;
    feed(G, killer.side, '一血', `🩸 ${cname(killer)}${assists.length?` 配合 ${assists.map(cname).join('、')}`:''} 击杀 ${cname(victim)}，${G.team[killer.side].name} 拿下一血！`, true);
  } else if(multi >= 3){
    feed(G, killer.side, MULTI[multi], `🔥 ${cname(killer)} 拿下${MULTI[multi]}！${multi===5?'五杀！！全场沸腾！':'收割全场！'}`, true);
  } else if(multi === 2){
    feed(G, killer.side, '双杀', `${cname(killer)} 连续击杀拿下双杀！`);
  } else if(!assists.length){
    feed(G, killer.side, '单杀', `💥 ${cname(killer)} 单杀 ${cname(victim)}！`, G.t < 1200);
  } else {
    feed(G, killer.side, shut?'终结':'击杀', `${cname(killer)}${shut?` 终结了 ${cname(victim)} 的连杀，拿下 ${shut} 赏金`:` 击杀 ${cname(victim)}`}${assists.length?`，助攻：${assists.map(a=>a.tag).join('、')}`:''}。`, !!shut);
  }
}

// ---------------- 资源争夺 ----------------
function claimObjectiveBounty(G, side, amount, target){
  if(G.bountySide!==side) return;
  const share=amount/5;
  for(const c of G.rosters[side]){ c.gold+=share; c.tg+=share; }
  feed(G,side,'目标赏金',`${G.team[side].name} 拿下${target}，全队获得额外 ${amount} 金币。`,true);
}
function tickObjective(G,key,pt,need){
  const ob=G.obj[key];
  if(!ob.up) return;
  let maskA=0, maskB=0, nearA=false, nearB=false;
  for(const c of G.champs){
    if(!c.alive || c.recall!==0) continue;
    const dx=c.x-pt[0], dy=c.y-pt[1], distance=dx*dx+dy*dy;
    if(distance>=22500) continue;
    if(c.side==='A'){
      nearA=true;
      if(distance<5625) maskA|=1<<c.i;
    } else {
      nearB=true;
      if(distance<5625) maskB|=1<<c.i;
    }
    if(nearA && nearB) return;
  }
  const side=maskA ? 'A' : maskB ? 'B' : null;
  if(!side) return;
  if(ob.by && ob.by!==side) ob.prog=0;
  ob.by=side;
  let rate=0;
  const mask=maskA|maskB;
  for(const c of G.rosters[side]) if(mask & (1<<c.i))
    rate+=Math.exp(SIM5.LV*c.lvl+c.invest/SIM5.IT)*(1+c.combat.sustained*.10)*(c.role==='JUG'?1.12:1);
  ob.prog+=rate/need*SIM5.DT;
  if(ob.prog>=1) takeObj(G,key,side,false);
}
function objectives(G){
  const t=G.t;
  tickObjective(G,'drag',MAP5.dragon,22+t/60*1.8);
  tickObjective(G,'elder',MAP5.dragon,40);
  tickObjective(G,'grubs',MAP5.baron,16);
  tickObjective(G,'herald',MAP5.baron,26);
  tickObjective(G,'baron',MAP5.baron,34+Math.max(0,(t-1200)/60)*1.2);
}
function takeObj(G, key, side, steal, macroSteal=false){
  const t = G.t, o = G.obj[key], tm = G.team[side];
  const opposing=G.team[other(side)];
  const visionEdge=visionEdgeFor(G,side,key);
  delete tm.setup[key]; delete opposing.setup[key];
  o.up = false; o.prog = 0; o.by = null;
  const nm = tm.name;
  const target={drag:'小龙',elder:'远古龙',baron:'大龙',herald:'峡谷先锋',grubs:'虚空巢虫'}[key];
  if(macroSteal) feed(G,side,'运营失误',opposing.name+' 开打'+target+'时失去控制，'+nm+'抢下资源。',true,'macro');
  else if(!steal && visionEdge) feed(G,side,'提前布控',nm+'提前布控视野，拿下'+target+'。',true,'macro');
  const jg = G.champs.find(c=>c.side===side && c.role==='JUG');
  if(key==='drag'){
    const dk = DRAKES.find(x=>x[0]===o.type) || DRAKES[0];
    tm.drakes.push(o.type);
    G.drakeSeen = (G.drakeSeen||[]).concat(o.type);
    const total = G.team.A.drakes.length + G.team.B.drakes.length;
    if(total===1 && !o.mapType) o.mapType = pickOne(DRAKES.filter(x=>x[0]!==o.type), G.random)[0];
    if(total>=2) o.type = o.mapType; else o.type = null;
    if(tm.drakes.length >= 4){
      tm.soul = o.mapType || dk[0];
      o.next = null; G.obj.elder.next = t + 360;
      feed(G, side, '龙魂', `🐉 ${nm} 拿下第四条小龙，获得${(DRAKES.find(x=>x[0]===tm.soul)||dk)[1].replace('亚龙','')}龙魂！`, true);
    } else {
      o.next = t + 300;
      feed(G, side, steal?'抢龙':'小龙', steal ? `😱 ${jg?cname(jg):nm} 惩戒抢下${dk[1]}！` : `${nm} 拿下${dk[1]}（第 ${tm.drakes.length} 条）。`, steal || tm.drakes.length>=3);
    }
  } else if(key==='elder'){
    tm.elderT = t + 150; o.next = t + 360;
    feed(G, side, steal?'抢远古龙':'远古龙', steal ? `😱 ${jg?cname(jg):nm} 神级惩戒抢下远古巨龙！` : `🐲 ${nm} 拿下远古巨龙，获得斩杀之力！`, true);
  } else if(key==='baron'){
    tm.baronT = t + 180; tm.barons++; o.next = t + 360;
    G.champs.filter(c=>c.side===side && c.alive).forEach(c=>{ c.gold += 300; c.tg += 300; });
    feed(G, side, steal?'抢大龙':'大龙', steal ? `😱 ${jg?cname(jg):nm} 惩戒抢下大龙！局势瞬间逆转！` : `👾 ${nm} 拿下纳什男爵，带着大龙 Buff 准备推进！`, true);
  } else if(key==='grubs'){
    tm.grubs += 3; o.up = false;
    if(o.wave===0 && t < 600){ o.wave = 1; o.next = t + 240; } else o.next = null;
    G.champs.filter(c=>c.side===side && c.alive).forEach(c=>{ c.gold += 25; c.tg += 25; });
    feed(G, side, '巢虫', `${nm} 拿下 3 只虚空巢虫，推塔能力提升。`);
  } else if(key==='herald'){
    tm.heraldT = t + 240; o.next = null;
    feed(G, side, '峡谷先锋', `${nm} 拿下峡谷先锋，准备撞塔。`);
  }
  if(key!=='grubs') claimObjectiveBounty(G,side,500,{drag:'小龙',elder:'远古龙',baron:'男爵',herald:'峡谷先锋'}[key]);
  if(G.rec) G.evs.push([t,'O',key,side,key==='drag'?(tm.drakes[tm.drakes.length-1]||''):'', steal?1:0]);
  // 资源到手后回到常规决策
  G.champs.filter(c=>c.side===side && c.task.k==='obj' && c.task.o===key).forEach(c=>{ c.task = TK({k: c.role==='JUG'?'jungle':'lane', lane: LANE_OF[c.role]}); });
  G.planT = t;
}

// ---------------- 兵线与防御塔 ----------------
function towerDamageable(G, tw){
  if(!tw.alive) return false;
  if(tw.tier<=4){
    if(tw.tier===1) return true;
    return !G.towers.some(x=>x.side===tw.side && x.lane===tw.lane && x.tier===tw.tier-1 && x.alive);
  }
  if(tw.tier===5) return G.towers.some(x=>x.side===tw.side && x.tier===4 && !x.alive);
  return !G.towers.some(x=>x.side===tw.side && x.tier===5 && x.alive);
}
function refreshTowers(G){
  // 缓存：每条路第一座存活建筑、各建筑是否可被攻击
  const first = {blue:{}, red:{}};
  for(const tw of G.towers){ if(tw.alive && tw.lane){ const f = first[tw.side][tw.lane]; if(!f || tw.tier < f.tier) first[tw.side][tw.lane] = tw; } }
  G.first = first;
  const inhibDown = {blue:false, red:false}, ntAlive = {blue:0, red:0};
  for(const tw of G.towers){ if(tw.tier===4 && !tw.alive) inhibDown[tw.side] = true; if(tw.tier===5 && tw.alive) ntAlive[tw.side]++; }
  G.inhibDown = inhibDown;
  G.supLane = {blue:{}, red:{}};
  for(const tw of G.towers) if(tw.tier===4 && !tw.alive) G.supLane[tw.side][tw.lane] = true;
  for(const tw of G.towers){
    tw.dmgable = tw.alive && (tw.lane ? first[tw.side][tw.lane]===tw : tw.tier===5 ? inhibDown[tw.side] : ntAlive[tw.side]===0);
  }
  G.towerDirty = false;
}
function towerDamageable(G, tw){ if(G.towerDirty || !G.first) refreshTowers(G); return tw.dmgable; }
function lanesAndTowers(G){
  const t = G.t, DT = SIM5.DT;
  if(G.towerDirty || !G.first) refreshTowers(G);
  const norm=TOWER_NORM[t/DT], early=t<840;
  const blueTeam=G.team[G.d.blue], redTeam=G.team[other(G.d.blue)];
  const champs=G.champs;
  const alive=G.aliveN||(G.aliveN={blue:0,red:0});
  alive.blue=alive.red=0;
  for(const c of champs) if(c.alive) alive[c.blue?'blue':'red']++;
  for(let li=0; li<3; li++){
    const lane = LANES3[li];
    const fp = lanePt(lane, G.front[lane]);
    const fx = fp[0], fy = fp[1];
    let pB = 0, pR = 0;
    for(let i=0;i<10;i++){
      const c = champs[i];
      if(!c.pw) continue;
      if(Math.abs(c.x-fx) > 130 || Math.abs(c.y-fy) > 130) continue;
      const power=early ? c.pw*c.laneMul : c.pw;
      if(c.blue) pB += power; else pR += power;
    }
    const supB = G.supLane.red[lane] ? 1.6 : 0, supR = G.supLane.blue[lane] ? 1.6 : 0;
    const fb = pB/norm + 0.6 + supB, fr = pR/norm + 0.6 + supR;
    let v = 0.008 * DT * (fb - fr) / (fb + fr);
    if(pB===0 && pR===0 && !supB && !supR) v += (0.0012*(G.aliveN.blue - G.aliveN.red)/5 + (0.5 - G.front[lane]) * 0.0004 + randn(G.random)*0.002) * DT;
    const rT = G.first.red[lane], bT = G.first.blue[lane];
    const maxS = rT ? rT.s - 0.012 : 0.93, minS = bT ? bT.s + 0.012 : 0.07;
    let nf = G.front[lane] + v;
    nf = nf < minS ? minS : nf > maxS ? maxS : nf;
    G.front[lane] = nf;
    for(let k=0;k<2;k++){
      const tw=k===0 ? rT : bT, pw=k===0 ? pB : pR;
      if(!tw || !tw.dmgable) continue;
      if(k===0 ? nf<tw.s-.02 : nf>tw.s+.02) continue;
      const tm=k===0 ? blueTeam : redTeam, atkSide=tm.side;
      let dmg = (0.0006 + Math.min(1, t/1800)*0.0022 + (pw/norm) * SIM5.TD * (1 + tm.grubs*0.04)) * DT;
      if(tm.baronT > t) dmg *= 2.2;
      if(tm.heraldT > t && tw.tier<=2 && pw>0 && G.random()<0.05*DT){ dmg += 0.3; tm.heraldT = 0; feed(G, atkSide, '先锋撞塔', `${tm.name} 放出峡谷先锋撞向${laneCN(lane)}防御塔！`); }
      if(tw.tier===1 && t < 300) dmg *= 0.3;
      if(t > 3000) dmg *= 2.5;
      tw.hp -= dmg;
      if(tw.tier===1 && t < 840 && tw.plates > 0 && tw.hp <= tw.plates*0.2 - 0.2 + 0.0001){
        tw.plates--;
        const atk = champs.filter(c=>c.side===atkSide && c.alive && Math.abs(c.x-tw.x)+Math.abs(c.y-tw.y)<200);
        atk.forEach(c=>{ const g = 150/Math.max(1,atk.length); c.gold += g; c.tg += g; });
      }
      if(pw>0){ const hit = (tw.tier===1&&t<840?0.006:0.0035)*DT; for(const c of champs){ if(c.side===atkSide && c.alive && Math.abs(c.x-tw.x)+Math.abs(c.y-tw.y)<140) c.hp = Math.max(0.05, c.hp - hit); } }
      if(tw.hp <= 0) destroyTower(G, tw, atkSide);
    }
  }
  if(!G.inhibDown.blue && !G.inhibDown.red) return;
  for(const tw of G.baseTowers){
    if(!tw.dmgable) continue;
    const atkSide = (tw.side==='blue') === (G.team.A.color==='red') ? 'A' : 'B';
    let p = 0;
    for(const c of champs){ if(c.side===atkSide && c.pw && Math.abs(c.x-tw.x)+Math.abs(c.y-tw.y)<160) p += c.pw; }
    if(!p) continue;
    let dmg = p/norm * 0.006 * DT;
    if(G.team[atkSide].baronT > t) dmg *= 1.8;
    if(t > 3000) dmg *= 2;
    tw.hp -= dmg;
    if(tw.hp <= 0) destroyTower(G, tw, atkSide);
    if(G.over) return;
  }
}
const laneCN = l => ({top:'上路',mid:'中路',bot:'下路'}[l]||'');
const TIER_CN = {1:'一塔',2:'二塔',3:'高地塔',4:'召唤水晶',5:'门牙塔',6:'主水晶'};
function destroyTower(G, tw, side){
  const t = G.t, tm = G.team[side];
  tw.alive = false; tw.hp = 0; G.towerDirty = true;
  if(G.rec) G.evs.push([t,'T',tw.id,side]);
  if(tw.tier===6){ endGame5(G, side); return; }
  if(tw.tier===4){ tw.resp = t + 300; feed(G, side, '破水晶', `💎 ${tm.name} 攻破${laneCN(tw.lane)}召唤水晶，超级兵即将出动！`, true); return; }
  if(tw.tier<=3) claimObjectiveBounty(G,side,tw.tier===1?250:400,TIER_CN[tw.tier]);
  tm.towers++;
  const near = G.champs.filter(c=>c.side===side && c.alive && hyp(c.x-tw.x,c.y-tw.y)<220);
  G.champs.filter(c=>c.side===side).forEach(c=>{ const g = 50 + (near.includes(c) ? 200/Math.max(1,near.length) : 0); c.gold += g; c.tg += g; });
  if(!G.firstTower){ G.firstTower = side; feed(G, side, '一塔', `🏰 ${tm.name} 推掉${laneCN(tw.lane)}一塔，拿下首座防御塔！`, true); }
  else if(tw.tier===5) feed(G, side, '门牙塔', `${tm.name} 推掉门牙塔，主水晶岌岌可危！`, true);
  else feed(G, side, '推塔', `${tm.name} 推掉${laneCN(tw.lane)}${TIER_CN[tw.tier]}。`, tw.tier===3);
}
function endGame5(G, side){
  if(G.over) return;
  G.over = true; G.winner = side;
  feed(G, side, '推平水晶', `🏆 ${G.team[side].name} 攻破主水晶，赢下本局比赛！`, true);
}

// ---------------- 录像 ----------------
function recFrame5(G){
  let s = '';
  for(const c of G.champs){ s += enc1(c.x/1000*63) + enc1(c.y/1000*63) + enc1(c.alive ? Math.max(1, c.hp*63) : 0); }
  G.frames.push(s);
}
function recStats5(G){
  let s = '';
  for(const c of G.champs){ s += enc2(c.cs) + enc2(c.tg/10) + enc1(c.lvl) + enc2(Math.max(0,c.gold)/10); }
  G.stats.push(s);
}

// ---------------- 结算（兼容旧 playGame 结构） ----------------
function game5Result(G){
  if(G.result) return G.result;
  const d = G.d, ev = G.ev;
  const winA = G.winner==='A';
  const lane14=G.lane14 || snapshotLane14(G);
  const rows = side => G.rosters[side].map(c=>({
    pid:c.pid, tag:c.tag, r:c.role, c:c.c, k:c.k, d:c.d, a:c.a, cs:Math.round(c.cs), gold:Math.round(c.tg), lvl:c.lvl, items:c.items.slice(), ...lane14.rows[c.i]
  }));
  const sa = rows('A'), sb = rows('B');
  const kA = sa.reduce((s,x)=>s+x.k,0), kB = sb.reduce((s,x)=>s+x.k,0);
  const gA = sa.reduce((s,x)=>s+x.gold,0), gB = sb.reduce((s,x)=>s+x.gold,0);
  const winStats = winA ? sa : sb;
  const winTotalK = Math.max(1, winA ? kA : kB);
  const mvpRow = winStats.slice().sort((x,y)=>{
    const sx = x.k*2.4 + x.a*1.2 - x.d*1.6 + ((x.k+x.a)/winTotalK)*4 + x.gold/4000 + G.random()*0.5;
    const sy = y.k*2.4 + y.a*1.2 - y.d*1.6 + ((y.k+y.a)/winTotalK)*4 + y.gold/4000 + G.random()*0.5;
    return sy - sx;
  })[0];
  const game = {
    w: G.winner, dur: Math.max(15, Math.round(G.t/60)), durSec: G.t, kA, kB,
    turA: G.team.A.towers, turB: G.team.B.towers,
    dragA: G.team.A.drakes.length, dragB: G.team.B.drakes.length, baronA: G.team.A.barons, baronB: G.team.B.barons,
    goldDiff: Math.round((gA-gB)/100)/10,
    mvp: mvpRow ? mvpRow.pid : null, mvpTag: mvpRow ? mvpRow.tag : '',
    pA: ev.pA, sa, sb, lane14:lane14.summary, events: G.key.slice(0, 40),
    bans: {A:d.bans.A.slice(), B:d.bans.B.slice()}, picks: {A:{...d.picks.A}, B:{...d.picks.B}},
    blue: d.blue, first: d.first, styleA: ev.a.comp.style, styleB: ev.b.comp.style
  };
  if(G.rec) game.rec = recordOf(G);
  game.impacts = G.over ? applyGameImpact(game, d.A, d.B, G.random) : [];
  if(G.over) G.result=game;
  return game;
}
function recordOf(G){
  return {
    v: SIM_VER, dur: G.t, blue: G.d.blue,
    champs: G.champs.map(c=>({side:c.side, role:c.role, tag:c.tag, c:c.c, pid:c.pid})),
    teams: {A:G.d.A, B:G.d.B},
    f: G.frames, st: G.stats, ev: G.evs, feed: G.feed.map(x=>x.attr ? [x.sec,x.side||'',x.tag,x.text,x.hl?1:0,x.attr] : [x.sec,x.side||'',x.tag,x.text,x.hl?1:0]), gs: G.gs
  };
}
function playGame(d, opts){
  const G = createGame5(d, opts);
  while(!G.over) step5(G);
  return game5Result(G);
}

// ================= 回放存档：最多 200 条，最近 10 局 + 最多 10 局永久收藏 =================
const REPLAY_MAX_RECENT = 10, REPLAY_MAX_KEPT = 10, REPLAY_MAX_ENTRIES = 200;
let replaySequence = 0;
function replayStore(){ if(!S.replays) S.replays = []; return S.replays; }
function pushReplay(entry){
  const list = replayStore();
  if(!entry.id){
    const prefix='r'+Date.now().toString(36)+'-';
    do{ entry.id=prefix+(++replaySequence).toString(36); }while(list.some(r=>r.id===entry.id));
  }
  list.unshift(entry);
  pushReplayTrim();
  return entry.id;
}
function findReplay(id){ return (S.replays||[]).find(r=>r.id===id) || null; }
function toggleKeepReplay(id){
  const r = findReplay(id); if(!r) return {ok:false, msg:'回放不存在'};
  if(r.kept){ r.kept = false; pushReplayTrim(); return {ok:true, msg:'已取消永久保留'}; }
  if(!r.rec && !r.solo) return {ok:false, msg:'这局只剩比分数据，无法收藏'};
  const kept = (S.replays||[]).filter(x=>x.kept).length;
  if(kept >= REPLAY_MAX_KEPT) return {ok:false, msg:`永久保留已达上限 ${REPLAY_MAX_KEPT} 局，请先取消一局`};
  r.kept = true; return {ok:true, msg:'已永久保留这局回放'};
}
function pushReplayTrim(){
  const list = S.replays || [];
  let recent = 0;
  for(const r of list){
    if(r.kept || (!r.rec && !r.solo)) continue;
    if(++recent <= REPLAY_MAX_RECENT) continue;
    r.rec = null; r.solo = null; r.trimmed = true;
  }
  for(let i=list.length-1; i>=0 && list.length>REPLAY_MAX_ENTRIES; i--){
    const r = list[i];
    if(!r.kept && !r.rec && !r.solo) list.splice(i,1);
  }
}

      const d = await r.json().catch(()=>({}));
      if(!r.ok){
        const raw = d.error_description || d.msg || d.message || '';
        if(/not confirmed/i.test(raw)){
          return { ok:false, unconfirmed:true, email: email.trim(), msg:'该邮箱尚未完成验证，请输入验证码（或点击重新发送）' };
        }
        const cn = /invalid login credentials/i.test(raw) ? '邮箱或密码错误，请重新核对' : (raw || `登录失败 (${r.status})`);
        return { ok:false, msg: cn };
      }
      this.auth = {
        access_token: d.access_token,
        refresh_token: d.refresh_token,
        expires_at: Math.floor(Date.now()/1000) + (d.expires_in || 3600),
        user: { id: d.user.id, email: d.user.email }
      };
      await StorageBridge.writeMeta(CLOUD_AUTH_KEY, this.auth);
      const res = await this.syncOnLaunch(true);
      return { ok:true, msg: res && res.msg ? res.msg : `欢迎回来，${this.auth.user.email}！` };
    }catch(e){
      return { ok:false, msg:'网络连接失败，当前仍可离线游玩' };
    }
  },

  async signOut(){
    clearTimeout(this._pushTimer);
    this._pushTimer = null;
    if(this.isConfigured() && this.isLoggedIn()){
      try{
        await fetch(`${this.baseUrl()}/auth/v1/logout?scope=local`, { method:'POST', headers: this.headers(true) });
      }catch(e){}
    }
    this.auth = null;
    this.conflict = null;
    this.status = this.isConfigured() ? 'guest' : 'unconfigured';
    this.statusText = '已退出（本地游客模式）';
    await StorageBridge.writeMeta(CLOUD_AUTH_KEY, null);
    if(typeof render === 'function') render();
  },

  async requestSaveRows(uid, path, options){
    if(!await this.ensureValidToken() || this.auth?.user?.id!==uid) throw new Error('会话待刷新');
    const send = () => fetch(this.baseUrl()+path,{
      ...options,
      headers:{...this.headers(true), ...options.headers},
      signal:typeof AbortSignal!=='undefined' ? AbortSignal.timeout?.(12000) : undefined
    });
    let r = await send();
    let body = r.ok ? null : await r.json().catch(()=>({}));
    if(r.status===401 && body?.code!=='42501' && await this.ensureValidToken(true) && this.auth?.user?.id===uid){
      r = await send();
      body = r.ok ? null : await r.json().catch(()=>({}));
    }
    if(!r.ok){
      const error = new Error('云存档 HTTP ' + r.status);
      error.code = body?.code;
      throw error;
    }
    return r.json();
  },

  async fetchCloudSave(uid, metadataOnly=false){
    const fields = metadataOnly ? 'updated_at' : 'save_data,summary,updated_at';
    const rows = await this.requestSaveRows(uid,'/rest/v1/user_saves?user_id=eq.' + encodeURIComponent(uid) + '&select=' + fields,{
      method:'GET'
    });
    return Array.isArray(rows) && rows.length ? rows[0] : null;
  },

  async writeCloudSave(uid, save, observed){
    const updated = Date.parse(observed?.updated_at) || 0;
    const updatedAt = new Date(Math.max(Date.now(),updated+1)).toISOString();
    const body = JSON.stringify({user_id:uid, save_data:save, summary:makeSaveSummary(save), updated_at:updatedAt});
    const path = '/rest/v1/user_saves?select=updated_at&';
    const where = observed
      ? 'user_id=eq.' + encodeURIComponent(uid) + '&updated_at=eq.' + encodeURIComponent(observed.updated_at)
      : 'on_conflict=user_id';
    const prefer = observed ? 'return=representation' : 'resolution=ignore-duplicates,return=representation';
    const rows = await this.requestSaveRows(uid,path+where,{
      method:observed?'PATCH':'POST',
      headers:{Prefer:prefer},
      body
    });
    return rows[0]?.updated_at || null;
  },

  schedulePush(saveObj){
    if(!saveObj || !this.isConfigured() || !this.isLoggedIn()) return;
    clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(()=>{
      this._pushTimer = null;
      this.syncOnLaunch(false);
    }, 1400);
  },

  async localCloudSave(){
    if(S) return S;
    const raw = await StorageBridge.readSaveText();
    if(S) return S;
    try{ return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  },

  async markCloudBase(uid, localVersion, cloudTime, label){
    if(this.auth?.user?.id!==uid) return;
    await StorageBridge.writeMeta('rift-sync-v2-'+uid,{localVersion,cloudTime});
    if(this.auth?.user?.id!==uid) return;
    this.conflict = null;
    this.markCloudSynced(label);
  },

  markCloudSynced(label){
    this.status = 'synced';
    this.lastSyncAt = Date.now();
    this.statusText = label;
    if(typeof notifyCloudStatus==='function') notifyCloudStatus('云端已同步');
  },

  async applyCloudSave(uid, row){
    if(this.auth?.user?.id!==uid) return {ok:false};
    S = migrateSave(row.save_data);
    const version = saveSyncVersion(S);
    const stored = StorageBridge.writeSaveText(JSON.stringify(S));
    this.conflict = null;
    this.markCloudSynced('已同步云端最新进度');
    if(typeof UI!=='undefined'){
      UI.hasSave = true;
      UI.savePreview = makeSaveSummary(S);
    }
    if(typeof render==='function') render();
    await stored;
    await this.markCloudBase(uid,version,row.updated_at,'已同步云端最新进度');
    return {ok:true, msg:'已同步云端最新进度'};
  },

  async reconcileCloud(uid, interactive, preferLocal, retry=true){
    const base = await StorageBridge.readMeta('rift-sync-v2-'+uid);
    let row = await this.fetchCloudSave(uid,!!base);
    const remoteUnchanged = !!(base && row && row.updated_at===base.cloudTime);
    let local = await this.localCloudSave();
    if(row && base && (!remoteUnchanged || !local)){
      if(!interactive && !canApplyCloudSave()) return {ok:true,deferred:true,msg:'将在当前操作结束后同步'};
      row = await this.fetchCloudSave(uid);
      local = await this.localCloudSave();
    }
    if(this.auth?.user?.id!==uid) return {ok:false};
    const version = saveSyncVersion(local);

    if(!row && !local){
      this.markCloudSynced('云端已连接');
      return {ok:true, msg:'云端已连接'};
    }
    if(row && row.save_data && version===saveSyncVersion(row.save_data)){
      await this.markCloudBase(uid,version,row.updated_at,'云端已同步');
      return {ok:true, msg:'本地与云端进度一致'};
    }
    if(local && remoteUnchanged && row?.updated_at===base.cloudTime && version===base.localVersion){
      this.markCloudSynced('云端已同步');
      return {ok:true, msg:'本地与云端进度一致'};
    }
    if(local && (!row || (remoteUnchanged && row.updated_at===base.cloudTime))){
      const time = await this.writeCloudSave(uid,local,row);
      if(!time){
        return retry ? this.reconcileCloud(uid,interactive,preferLocal,false) : {ok:false,msg:'云端刚有更新，将自动重试'};
      }
      await this.markCloudBase(uid,version,time,'云端已同步');
      return {ok:true, msg:'已自动上传本地进度'};
    }

    if(!interactive && !canApplyCloudSave()) return {ok:true,deferred:true,msg:'将在当前操作结束后同步'};
    if(!local || (!preferLocal && base && version===base.localVersion)){
      return this.applyCloudSave(uid,row);
    }

    const alreadyReported = this.conflict?.cloudTime===row.updated_at;
    this.conflict = {
      localSave:local, localSummary:makeSaveSummary(local),
      cloudSave:row.save_data, cloudTime:row.updated_at,
      cloudSummary:{...makeSaveSummary(row.save_data), ...(row.summary||{})}
    };
    this.statusText = '检测到多端进度差异';
    if(interactive && typeof openConflictModal==='function') openConflictModal();
    else if(!alreadyReported && typeof notifyCloudStatus==='function') notifyCloudStatus('待处理存档差异');
    return {ok:true,msg:'检测到多端进度差异，请选择要保留的存档'};
  },

  async syncOnLaunch(interactive, {preferLocal=false}={}){
    if(!this.isConfigured() || !this.isLoggedIn()) return {ok:false,msg:this.status==='reauth' ? this.statusText : '请先登录云存档账号'};
    if(this._resolving) return {ok:false,msg:'正在处理存档差异'};
    const uid = this.auth.user.id;
    if(this._syncJob){
      const job = this._syncJob;
      const result = await job.promise;
      if(job.uid!==uid || preferLocal || (interactive && result.deferred)) return this.syncOnLaunch(interactive,{preferLocal});
      if(interactive && this.conflict && typeof openConflictModal==='function') openConflictModal();
      return result;
    }
    const job = {uid};
    this._syncJob = job;
    job.promise = this.reconcileCloud(uid,interactive,preferLocal).catch(e=>{
      if(this.status==='reauth' && !this.isLoggedIn()) return {ok:false,msg:this.statusText};
      const msg = ['42501','PGRST205','42P01'].includes(e.code)
        ? '云端存档接口不可用，进度已存本地'
        : '暂无法连接云端，将自动重试';
      if(this.auth?.user?.id===uid){
        console.warn('Cloud sync failed:', e);
        this.status = 'offline';
        this.statusText = msg;
        if(typeof notifyCloudStatus==='function') notifyCloudStatus('离线(已存本地)');
      }
      return {ok:false,msg};
    }).finally(()=>{
      if(this._syncJob===job) this._syncJob = null;
    });
    return job.promise;
  },

  async resolveConflict(choice){
    if(!this.conflict || !this.isLoggedIn() || this._resolving) return {ok:false,msg:'没有待处理的存档差异'};
    this._resolving = true;
    const uid = this.auth.user.id;
    let advanced = false;
    try{
      if(this._syncJob) await this._syncJob.promise;
      if(this.auth?.user?.id!==uid) return {ok:false,msg:'账号状态已变化'};
      const pending = this.conflict;
      if(!pending) return {ok:true,msg:'本地与云端已同步'};
      const remote = await this.fetchCloudSave(uid,true);
      if(remote?.updated_at!==pending.cloudTime){
        advanced = true;
      } else if(choice==='cloud'){
        if(typeof UI!=='undefined') UI.modal = null;
        return await this.applyCloudSave(uid,{save_data:pending.cloudSave,updated_at:pending.cloudTime});
      } else if(choice==='local'){
        const save = await this.localCloudSave();
        const version = saveSyncVersion(save);
        const time = await this.writeCloudSave(uid,save,remote);
        if(time){
          await this.markCloudBase(uid,version,time,'已用本地进度更新云端');
          if(typeof UI!=='undefined') UI.modal = null;
          if(typeof render==='function') render();
          return {ok:true,msg:'已用本地进度更新云端'};
        }
        advanced = true;
      }
    }catch(e){
      return {ok:false,msg:'暂无法连接云端，请稍后重试'};
    }finally{
      this._resolving = false;
    }
    if(advanced){
      this.conflict = null;
      if(typeof UI!=='undefined') UI.modal = null;
      return this.syncOnLaunch(true);
    }
    return {ok:false,msg:'请选择要保留的存档'};
  },

  _autoStarted: false,
  _autoTimer: null,
  startAutoSync(){
    if(this._autoStarted) return;
    this._autoStarted = true;
    const trySync = () => {
      if(typeof document!=='undefined' && document.visibilityState==='hidden') return;
      if(this.isLoggedIn()) this.syncOnLaunch(false);
    };
    if(typeof document!=='undefined' && document.addEventListener){
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='hidden'){
          if(this._pushTimer){
            clearTimeout(this._pushTimer);
            this._pushTimer = null;
            this.syncOnLaunch(false);
          }
        } else trySync();
      });
    }
    if(typeof window!=='undefined' && window.addEventListener){
      window.addEventListener('focus',trySync);
      window.addEventListener('online',()=>{
        if(this.isLoggedIn()) this.syncOnLaunch(false);
      });
    }
    this._autoTimer = setInterval(trySync,15000);
  }
};

// ================= 云端版本检测与更新 =================
// - Windows 安装版 / macOS：Tauri updater 应用内下载、验签、安装并重启
// - Windows 绿色版：直接下载最新 Portable.exe（便携版无法原地自更新）
// - Android：下载最新 APK（固定签名，可覆盖安装）
// - 在线网页 / PWA：网页本身已是最新，刷新即可；离线单文件版：下载最新 Web-Offline.html
const RELEASES_PAGE = 'https://github.com/D3cEuGod/esports-manager/releases/latest';

function isAndroidShell(){
  return typeof location!=='undefined' && /appassets\.androidplatform\.net/i.test(location.hostname);
}

// 外链统一出口：Tauri 交给系统浏览器，安卓壳走原生 Intent，网页开新标签。
async function openExternal(url){
  if(!url) return false;
  if(isTauriApp()){
    try{ await tauriInvoke('plugin:opener|open_url', { url }); return true; }
    catch(e){ console.warn('open_url failed:', e); return false; }
  }
  if(isAndroidShell()){ location.href = url; return true; }
  const w = window.open(url, '_blank', 'noopener');
  if(!w) location.href = url;
  return true;
}

// Tauri 默认拦截新窗口，target=_blank 的链接点了没反应。这里统一接管。
if(typeof document!=='undefined' && isTauriApp()){
  document.addEventListener('click', e=>{
    const a = e.target.closest && e.target.closest('a[href]');
    if(!a) return;
    const href = a.getAttribute('href') || '';
    if(!/^https?:\/\//i.test(href)) return;
    e.preventDefault();
    openExternal(href);
  }, true);
}

window.AppUpdater = {
  currentVersion: '2.1.18',
  manifestUrl: 'https://raw.githubusercontent.com/D3cEuGod/esports-manager/main/version.json',
  releasesApi: 'https://api.github.com/repos/D3cEuGod/esports-manager/releases/latest',
  available: null, // { version, notes, url, assetUrl, mode }
  statusText: '尚未检查',
  lastCheckedAt: 0,
  busy: false,
  progress: null,
  _kind: null,

  isNewer(remote, local){
    const a = String(remote||'').replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0);
    const b = String(local||'').replace(/^v/i,'').split('.').map(n=>parseInt(n,10)||0);
    for(let i=0;i<Math.max(a.length,b.length);i++){
      if((a[i]||0) > (b[i]||0)) return true;
      if((a[i]||0) < (b[i]||0)) return false;
    }
    return false;
  },

  // tauri-installed | tauri-portable | tauri-mac | android | web-online | web-file
  async platform(){
    if(this._kind) return this._kind;
    const ua = (typeof navigator!=='undefined' && navigator.userAgent) || '';
    if(isTauriApp()){
      if(/Macintosh|Mac OS/i.test(ua)) this._kind = 'tauri-mac';
      else {
        let kind = 'portable';
        try{ kind = await tauriInvoke('install_kind'); }catch(e){}
        this._kind = kind==='installed' ? 'tauri-installed' : 'tauri-portable';
      }
    } else if(isAndroidShell()) this._kind = 'android';
    else if(typeof location!=='undefined' && /^https?:$/.test(location.protocol)) this._kind = 'web-online';
    else this._kind = 'web-file';
    return this._kind;
  },

  pickAsset(assets, kind){
    const list = Array.isArray(assets) ? assets : [];
    const re = {
      'tauri-installed': /Windows-Setup\.exe$/i,
      'tauri-portable': /Windows-Portable\.exe$/i,
      'tauri-mac': /macOS.*\.dmg$/i,
      'android': /Android\.apk$/i,
      'web-file': /Web-Offline\.html$/i
    }[kind];
    const a = re && list.find(x=>re.test(x.name||''));
    return a ? a.browser_download_url : null;
  },

  async fetchLatest(kind){
    // 以 GitHub 最新 Release 为准：安装包都编译上传完才会出现，不会提前提示更新。
    try{
      const r = await fetch(this.releasesApi, { headers:{ Accept:'application/vnd.github+json' }, cache:'no-store' });
      if(r.ok){
        const j = await r.json();
        if(j && j.tag_name && !j.draft && !j.prerelease){
          return {
            version: String(j.tag_name).replace(/^v/i,''),
            notes: String(j.name||'').slice(0,80),
            url: j.html_url || RELEASES_PAGE,
            assetUrl: this.pickAsset(j.assets, kind)
          };
        }
      }
    }catch(e){}
    // API 被限流时退回 version.json（只给发布页链接）
    const r2 = await fetch(`${this.manifestUrl}?t=${Date.now()}`, { cache:'no-store' });
    if(!r2.ok) throw new Error('HTTP ' + r2.status);
    const j2 = await r2.json();
    if(!j2 || !j2.version) return null;
    return { version:String(j2.version), notes:j2.notes||'', url:RELEASES_PAGE, assetUrl:null };
  },

  async check(manual){
    if(this.busy) return { hasUpdate: !!this.available, msg:'正在更新…' };
    if(!manual && Date.now() - this.lastCheckedAt < 300000) return { hasUpdate: !!this.available };
    this.lastCheckedAt = Date.now();
    this.statusText = '正在检查云端版本…';
    try{
      const kind = await this.platform();
      const info = await this.fetchLatest(kind);
      if(info && this.isNewer(info.version, this.currentVersion)){
        info.mode = 'download';
        if(kind==='web-online') info.mode = 'reload';
        if(kind==='tauri-installed' || kind==='tauri-mac'){
          try{
            const u = await tauriInvoke('check_app_update');
            if(u && u.version) info.mode = 'inapp';
          }catch(e){ console.warn('check_app_update failed:', e); }
        }
        this.available = info;
        this.statusText = `发现新版本 v${info.version}`;
        return { hasUpdate:true, version:info.version, info };
      }
      this.available = null;
      this.statusText = `已是最新版本（v${this.currentVersion}）`;
      return { hasUpdate:false, msg: this.statusText };
    }catch(e){
      this.statusText = '离线模式（暂无法检测版本）';
      return { hasUpdate:false, msg:'网络暂不可用，稍后再试' };
    }
  },

  actionLabel(){
    const u = this.available;
    if(!u) return '';
    if(this.busy) return this.progress!=null ? `正在下载更新 ${this.progress}%` : '正在更新…';
    if(u.mode==='inapp') return `一键更新到 v${u.version}`;
    if(u.mode==='reload') return `刷新到新版本 v${u.version}`;
    return `下载最新版本 v${u.version}`;
  },

  // 返回给界面提示的文字
  async run(){
    const u = this.available;
    if(!u || this.busy) return '';
    if(u.mode==='reload'){
      try{
        const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
        if(reg) await reg.update();
      }catch(e){}
      location.reload();
      return '正在刷新…';
    }
    if(u.mode==='inapp'){
      this.busy = true; this.progress = null;
      let unlisten = null;
      try{
        const ev = window.__TAURI__ && window.__TAURI__.event;
        if(ev && ev.listen){
          unlisten = await ev.listen('app-update-progress', ({payload})=>{
            if(payload && payload.total){
              this.progress = Math.min(100, Math.round(payload.downloaded*100/payload.total));
              if(typeof render==='function') render();
            }
          });
        }
        if(typeof render==='function') render();
        if(typeof StorageBridge!=='undefined') await StorageBridge._saveWrite;
        await tauriInvoke('install_app_update'); // 成功会直接重启
        return '已是最新版本';
      }catch(e){
        console.warn('install_app_update failed:', e);
        u.mode = 'download';
        const url = u.assetUrl || u.url;
        await openExternal(url);
        return '应用内更新失败，已改为在浏览器中下载安装包';
      }finally{
        this.busy = false; this.progress = null;
        if(unlisten) try{ unlisten(); }catch(e){}
        if(typeof render==='function') render();
      }
    }
    const ok = await openExternal(u.assetUrl || u.url);
    if(!ok) return '无法打开浏览器，请手动前往 GitHub Releases 下载';
    if(this._kind==='android') return '下载完成后点开 APK 覆盖安装即可';
    return u.assetUrl ? '已开始下载最新安装包' : '已打开下载页面';
  }
};
</script>
<script>// ================= 实时观战 / 回放（Canvas 召唤师峡谷小地图 + 1v1 中路对线） =================
// 依赖 sim.js（createGame5 / step5 / createSolo / soloStep …）与 ui.js（render、esc、teamTag、champName、champAvatar）
const Watch = (()=>{
  const SPEEDS = [1,2,4,8];
  const imgCache = {};
  function champImg(c){
    if(!c) return null;
    let it = imgCache[c];
    if(!it){
      const im = new Image(); im.decoding = 'async';
      it = imgCache[c] = {im, ok:false, bad:false};
      im.onload = ()=>{ it.ok = true; };
      im.onerror = ()=>{ it.bad = true; };
      im.src = champIconUrl(c);
    }
    return it;
  }
  const SPELL = {flash:'SummonerFlash', ig:'SummonerDot', bar:'SummonerBarrier'};
  const spellUrl = k => `https://ddragon.leagueoflegends.com/cdn/${window.DDRAGON_VER||'16.2.1'}/img/spell/${SPELL[k]}.png`;
  const BLUE = '#0ac8b9', RED = '#e84057', GOLD = '#c89b3c';
  const DRAKE_COLOR = {infernal:'#ff6a3d', ocean:'#3fb6ff', mountain:'#b98a52', cloud:'#cfe3f0', hextech:'#55e0ff', chemtech:'#8fe04a'};
  const DRAKE_CN = {}; DRAKES.forEach(([k,cn])=>DRAKE_CN[k]=cn.replace('亚龙',''));

  let W = null;          // 当前观战会话
  let raf = 0, lastTs = 0;

  // ---------------- 拟真召唤师峡谷底图（按原版地形比例精细绘制，只画一次） ----------------
  let bgCanvas = null;
  function mapBackground(){
    if(bgCanvas) return bgCanvas;
    const S0 = 1000;
    const cv = document.createElement('canvas'); cv.width = S0; cv.height = S0;
    const g = cv.getContext('2d');

    // 1. 峡谷底土与蓝红半区环境渐变
    const grd = g.createLinearGradient(0, S0, S0, 0);
    grd.addColorStop(0, '#122926');
    grd.addColorStop(0.38, '#17342b');
    grd.addColorStop(0.50, '#14322d');
    grd.addColorStop(0.62, '#242d22');
    grd.addColorStop(1, '#2d1f21');
    g.fillStyle = grd; g.fillRect(0, 0, S0, S0);

    // 细微草地纹理噪点（固定种子）
    const rr = srand(20260525);
    for(let i=0;i<220;i++){

    const walls = [
      // 蓝方上半野区 & 蓝区
      [215, 455, 44, 24, -0.5], [270, 520, 32, 18, 0.3], [195, 585, 36, 20, -0.2], [350, 420, 26, 16, 0.7],
      // 蓝方下半野区 & 红区
      [445, 765, 44, 24, 0.45], [530, 705, 34, 20, -0.4], [585, 815, 36, 18, 0.2], [415, 650, 28, 16, -0.6],
      // 红方上半野区 & 红区

    for(const [x,y,rx,ry,ang] of walls){

    ];
    for(const [x,y,rx,ry,ang] of bushes){
      g.save(); g.translate(x,y); g.rotate(ang);
      g.fillStyle = 'rgba(56,158,76,0.55)';
      g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2); g.fill();

    // 8. 外框海克斯金边
    g.strokeStyle = 'rgba(200,155,60,0.75)'; g.lineWidth = 6; g.strokeRect(3, 3, S0-6, S0-6);
    bgCanvas = cv; return cv;

  // ---------------- 视图模型 ----------------
  // 实时：直接读模拟状态；回放：从关键帧重建
  function view5Live(G, frac){
    const champs = G.champs.map(c=>{
      const x = c.px + (c.x - c.px)*frac, y = c.py + (c.y - c.py)*frac;
      return { i:c.i, side:c.side, blue:c.blue, role:c.role, tag:c.tag, c:c.c, cn:c.cn, x, y, hp:c.hp, alive:c.alive, rt:Math.max(0,Math.ceil(c.rt)),
