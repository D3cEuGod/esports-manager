  let W = null;          // 当前观战会话
  let raf = 0, lastTs = 0;

  // ---------------- 峡谷底图（只画一次） ----------------
  let bgCanvas = null;
  function mapBackground(){
    if(bgCanvas) return bgCanvas;
    const S0 = 1000;
    const cv = document.createElement('canvas'); cv.width = S0; cv.height = S0;
    const g = cv.getContext('2d');
    // 野区底色
    const grd = g.createLinearGradient(0,S0,S0,0); grd.addColorStop(0,'#0f2b2a'); grd.addColorStop(0.5,'#14302a'); grd.addColorStop(1,'#2a1f22');
    g.fillStyle = grd; g.fillRect(0,0,S0,S0);
    // 野区墙体：随机但固定的深色岩块
    const rr = srand(20260101);
    g.fillStyle = 'rgba(4,14,12,0.55)';
    for(let i=0;i<70;i++){
      const x = 120 + rr()*760, y = 120 + rr()*760;
      if(Math.abs(x - y) < 70 || Math.abs(x + y - 1000) < 80) continue; // 留出河道与中路
      g.beginPath(); g.ellipse(x, y, 18+rr()*36, 12+rr()*26, rr()*3, 0, Math.PI*2); g.fill();
    }
    // 草丛
    g.fillStyle = 'rgba(70,140,70,0.28)';
    for(let i=0;i<46;i++){ const x = 100 + rr()*800, y = 100 + rr()*800; g.beginPath(); g.ellipse(x,y,10+rr()*12,5+rr()*6,rr()*3,0,Math.PI*2); g.fill(); }
    // 河道
    g.strokeStyle = 'rgba(40,110,150,0.55)'; g.lineWidth = 64; g.lineCap = 'round';
    g.beginPath(); g.moveTo(150,150); g.quadraticCurveTo(470,420,500,500); g.quadraticCurveTo(530,580,850,850); g.stroke();
    g.strokeStyle = 'rgba(90,170,210,0.18)'; g.lineWidth = 20; g.stroke();
    // 基地
    const base = (x,y,col) => { const rg = g.createRadialGradient(x,y,10,x,y,230); rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = rg; g.fillRect(x-240,y-240,480,480); };
    base(60,940,'rgba(30,120,255,0.38)'); base(940,60,'rgba(232,64,87,0.32)');
    // 三路
    for(const k of ['top','mid','bot']){
      const pts = MAP5.lanes[k];
      g.lineCap = 'round'; g.lineJoin = 'round';
      g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 44;
      g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.stroke();
      g.strokeStyle = '#4a4636'; g.lineWidth = 34; g.stroke();
      g.strokeStyle = 'rgba(200,155,60,0.22)'; g.lineWidth = 2; g.stroke();
    }
    // 龙坑 / 男爵坑
    for(const [pt,col] of [[MAP5.dragon,'rgba(255,140,60,0.25)'],[MAP5.baron,'rgba(170,90,255,0.25)']]){
      g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.arc(pt[0],pt[1],46,0,Math.PI*2); g.fill();
      g.strokeStyle = col; g.lineWidth = 4; g.stroke();
    }
    // 外框
    g.strokeStyle = 'rgba(200,155,60,0.65)'; g.lineWidth = 6; g.strokeRect(3,3,S0-6,S0-6);
    bgCanvas = cv; return cv;
  }

  // ---------------- 视图模型 ----------------
  // 实时：直接读模拟状态；回放：从关键帧重建
  function view5Live(G, frac){
    const champs = G.champs.map(c=>{
      const x = c.px + (c.x - c.px)*frac, y = c.py + (c.y - c.py)*frac;
      return { i:c.i, side:c.side, blue:c.blue, role:c.role, tag:c.tag, c:c.c, cn:c.cn, x, y, hp:c.hp, alive:c.alive, rt:Math.max(0,Math.ceil(c.rt)),
        lvl:c.lvl, k:c.k, d:c.d, a:c.a, cs:Math.round(c.cs), gold:Math.round(c.tg), cur:Math.round(Math.max(0,c.gold)), items:c.items, partial:c.partial>0?c.build.comp:null, recall:c.recall>0 };
    });
    return { t:G.t, champs, towers:G.towers.map(tw=>({x:tw.x,y:tw.y,side:tw.side,tier:tw.tier,alive:tw.alive,hp:tw.hp})),
      front:G.front, obj:G.obj, team:G.team, feed:G.feed, gs:G.gs, fx:G.fx, over:G.over, winner:G.winner, blueSide:G.d.blue };
  }
  // 回放：预先把事件按时间整理好，便于任意时刻定位
  function prepRec(rec){
    if(rec._prep) return rec._prep;
    const towers = buildTowers();
    const P0 = { towers, kills:[], buys:[], sells:[], towerEv:[], resp:[], obj:[], fights:[] };
    for(const e of rec.ev){
      const [t,k] = e;
      if(k==='K') P0.kills.push(e); else if(k==='B') P0.buys.push(e); else if(k==='S') P0.sells.push(e);
      else if(k==='T') P0.towerEv.push(e); else if(k==='R') P0.resp.push(e); else if(k==='O') P0.obj.push(e); else if(k==='F') P0.fights.push(e);
    }
    rec._prep = P0; return P0;
  }
  function view5Rec(rec, t){
    const P0 = prepRec(rec);
    const fi = clamp(t/3 - 1, 0, rec.f.length-1);
    const i0 = Math.floor(fi), i1 = Math.min(rec.f.length-1, i0+1), fr = fi - i0;
    const f0 = rec.f[i0], f1 = rec.f[i1];
    const si = clamp(Math.floor(t/12), 0, rec.st.length-1), st = rec.st[si];
    const champs = rec.champs.map((c,i)=>{
      const x0 = dec1(f0,i*3)/63*1000, y0 = dec1(f0,i*3+1)/63*1000, h0 = dec1(f0,i*3+2)/63;
      const x1 = dec1(f1,i*3)/63*1000, y1 = dec1(f1,i*3+1)/63*1000;
      const o = i*7;
      return { i, side:c.side, blue:c.side===rec.blue, role:c.role, tag:c.tag, c:c.c, cn:CH[c.c]?CH[c.c].cn:c.role,
        x: x0+(x1-x0)*fr, y: y0+(y1-y0)*fr, hp:h0, alive:h0>0, rt:0, lvl:dec1(st,o+4), k:0, d:0, a:0,
        cs:dec2(st,o), gold:dec2(st,o+2)*10, cur:dec2(st,o+5)*10, items:[], partial:null, recall:false };
    });
    for(const e of P0.kills){ if(e[0] > t) break; champs[e[2]].k++; champs[e[3]].d++; e[4].forEach(a=>champs[a].a++); const v = champs[e[3]]; if(t < e[0]+e[5]) v.rt = Math.ceil(e[0]+e[5]-t); }
    const sells = P0.sells.filter(e=>e[0]<=t);
    let si2 = 0;
    for(const e of P0.buys){ if(e[0] > t) break; while(si2 < sells.length && sells[si2][0] < e[0]){ const s = sells[si2]; champs[s[2]].items.splice(s[3],1); si2++; } champs[e[2]].items.push(e[3]); }
    while(si2 < sells.length){ const s = sells[si2]; champs[s[2]].items.splice(s[3],1); si2++; }
    const towers = P0.towers.map(tw=>({x:tw.x,y:tw.y,side:tw.side,tier:tw.tier,alive:true,hp:1}));
    const tev = P0.towerEv.concat(P0.resp).sort((a,b)=>a[0]-b[0]);
    for(const e of tev){ if(e[0] > t) break; towers[e[2]].alive = e[1]==='R'; }
    const team = {A:{drakes:[], barons:0, towers:0, kills:0, soul:null, baronT:0, elderT:0, name:teamName(rec.teams.A), blue:rec.blue==='A', color:rec.blue==='A'?'blue':'red'},
                  B:{drakes:[], barons:0, towers:0, kills:0, soul:null, baronT:0, elderT:0, name:teamName(rec.teams.B), blue:rec.blue==='B', color:rec.blue==='B'?'blue':'red'}};
    for(const e of P0.towerEv){ if(e[0] > t) break; if(towers[e[2]] && P0.towers[e[2]].tier!==4 && P0.towers[e[2]].tier!==6) team[e[3]].towers++; }
    for(const e of P0.obj){ if(e[0] > t) break; const tm = team[e[3]]; if(e[2]==='drag'){ tm.drakes.push(e[4]); if(tm.drakes.length>=4) tm.soul = e[4]; } else if(e[2]==='baron'){ tm.barons++; tm.baronT = e[0]+180; } else if(e[2]==='elder') tm.elderT = e[0]+150; }
    champs.forEach(c=>team[c.side].kills += c.k);
    const feed = []; for(const x of rec.feed){ if(x[0] > t) break; feed.push({t:fmtSec(x[0]), sec:x[0], side:x[1]||null, tag:x[2], text:x[3], hl:!!x[4]}); }
    const gs = rec.gs.filter(x=>x[0] <= t);
    const fx = P0.fights.filter(e=>e[0] <= t && e[0] > t-4).map(e=>({t:e[0], x:e[2], y:e[3], n:e[4]}));
    // 资源刷新状态（近似）：最近一次被拿的时间 + 刷新间隔
    const lastObj = k => { let l=null; for(const e of P0.obj){ if(e[0]>t) break; if(e[2]===k) l=e; } return l; };
    const ld = lastObj('drag'), lb = lastObj('baron'), le = lastObj('elder');
    const soulDone = team.A.drakes.length>=4 || team.B.drakes.length>=4;
    const obj = { drag:{up: !soulDone && (ld ? t>=ld[0]+300 : t>=300), next: soulDone?null:(ld?ld[0]+300:300), type:null},
      baron:{up: lb ? t>=lb[0]+360 : t>=1200, next: lb?lb[0]+360:1200}, elder:{up: soulDone && (le ? t>=le[0]+360 : false), next:null}, grubs:{up:false}, herald:{up:false} };
    return { t, champs, towers, front:null, obj, team, feed, gs, fx, over: t >= rec.dur, winner:null, blueSide:rec.blue };
  }

  // ---------------- 绘制小地图 ----------------
  function drawMap(cv, V){
    const ctx = cv.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W0 = cv.clientWidth || 400;
    if(cv.width !== Math.round(W0*dpr)){ cv.width = Math.round(W0*dpr); cv.height = Math.round(W0*dpr); }
    const k = cv.width/1000;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(mapBackground(), 0, 0, cv.width, cv.height);
    ctx.setTransform(k,0,0,k,0,0);
    // 兵线
    if(V.front){
      for(const lane of ['top','mid','bot']){
        const [x,y] = lanePt(lane, V.front[lane]);
        const [xb,yb] = lanePt(lane, V.front[lane]-0.025), [xr,yr] = lanePt(lane, V.front[lane]+0.025);
        ctx.fillStyle = '#4aa3ff'; for(let i=0;i<3;i++){ ctx.fillRect(xb-6+i*5-4, yb-4+(i%2)*5, 6, 6); }
        ctx.fillStyle = '#ff5a6e'; for(let i=0;i<3;i++){ ctx.fillRect(xr-6+i*5-4, yr-4+(i%2)*5, 6, 6); }
        ctx.strokeStyle = 'rgba(255,230,160,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.stroke();
      }
    }
    // 防御塔 / 水晶
    for(const tw of V.towers){
      const col = tw.side==='blue' ? BLUE : RED;
      ctx.save(); ctx.translate(tw.x, tw.y);
      if(tw.tier===6){
        ctx.beginPath(); for(let i=0;i<6;i++){ const a = Math.PI/3*i; ctx.lineTo(Math.cos(a)*26, Math.sin(a)*26); } ctx.closePath();
        ctx.fillStyle = tw.alive ? col : '#333'; ctx.globalAlpha = tw.alive?0.9:0.5; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.stroke();
      } else if(tw.tier===4){
        ctx.rotate(Math.PI/4); ctx.fillStyle = tw.alive ? col : 'rgba(80,80,80,0.6)'; ctx.fillRect(-9,-9,18,18); ctx.strokeStyle = '#091428'; ctx.lineWidth = 2; ctx.strokeRect(-9,-9,18,18);
      } else {
        if(tw.alive){ ctx.fillStyle = '#091428'; ctx.fillRect(-11,-11,22,22); ctx.fillStyle = col; ctx.fillRect(-8,-8,16,16); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(-8, 10, 16*Math.max(0,tw.hp), 3); }
        else { ctx.strokeStyle = 'rgba(160,160,160,0.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-7,-7); ctx.lineTo(7,7); ctx.moveTo(7,-7); ctx.lineTo(-7,7); ctx.stroke(); }
      }
      ctx.restore();
    }
    // 大小龙
    const drawObj = (pt, up, label, col, timer) => {
      ctx.save(); ctx.translate(pt[0], pt[1]);
      ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.fillStyle = up ? col : 'rgba(20,20,30,0.75)'; ctx.fill();
      ctx.strokeStyle = up ? '#fff' : 'rgba(200,155,60,0.5)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = up ? '#091428' : '#a09b8c'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(up ? label : (timer!=null ? fmtSec(timer) : '—'), 0, 1);
      ctx.restore();
    };
    const o = V.obj, t = V.t;
    if(o.elder && o.elder.up) drawObj(MAP5.dragon, true, '远古', '#d9c27a');
    else drawObj(MAP5.dragon, o.drag.up, '龙', DRAKE_COLOR[o.drag.type]||'#ff8a3d', o.drag.next!=null && o.drag.next>t ? o.drag.next-t : null);
    if(t < 840 && o.grubs && o.grubs.up) drawObj(MAP5.baron, true, '虫', '#b07cff');
    else if(o.herald && o.herald.up) drawObj(MAP5.baron, true, '先锋', '#b07cff');
    else drawObj(MAP5.baron, o.baron.up, '男爵', '#9b59ff', o.baron.next>t ? o.baron.next-t : null);
    // 团战特效
    for(const f of V.fx||[]){
      const age = clamp((t - f.t)/4, 0, 1);
      ctx.beginPath(); ctx.arc(f.x, f.y, 20 + age*60, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,${f.n>=3?80:200},60,${(1-age)*0.9})`; ctx.lineWidth = 6*(1-age)+1; ctx.stroke();
      if(f.n>0 && age < 0.6){ ctx.fillStyle = `rgba(255,220,120,${(0.6-age)})`; ctx.font = 'bold 26px sans-serif'; ctx.textAlign='center'; ctx.fillText('⚔', f.x, f.y+9); }
    }
    // 英雄头像
    const R = 24;
    for(const c of V.champs){
      if(!c.alive) continue;
      const col = c.blue ? BLUE : RED;
      ctx.save(); ctx.translate(c.x, c.y);
      ctx.beginPath(); ctx.arc(0,0,R+4,0,Math.PI*2); ctx.fillStyle = col; ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.clip();
      const im = champImg(c.c);
      if(im && im.ok){ ctx.drawImage(im.im, -R, -R, R*2, R*2); }
      else { ctx.fillStyle = `hsl(${hash(c.c||c.role)%360},45%,28%)`; ctx.fillRect(-R,-R,R*2,R*2); ctx.fillStyle = '#f0e6d2'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText((c.cn||'').slice(0,2), 0, 1); }
      if(c.recall){ ctx.fillStyle = 'rgba(60,140,255,0.45)'; ctx.fillRect(-R,-R,R*2,R*2); }
      ctx.restore();
      // 血条 + 名字
      const bw = 58, by = -R-16;
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(-bw/2-1, by-1, bw+2, 9);
      ctx.fillStyle = c.hp>0.5 ? '#3ddc84' : c.hp>0.25 ? '#f5c542' : '#ff4d5e'; ctx.fillRect(-bw/2, by, bw*clamp(c.hp,0,1), 7);
      ctx.font = 'bold 17px "Noto Sans SC",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(c.tag, 0, by-3);
      ctx.fillStyle = c.blue ? '#bff6f0' : '#ffd0d6'; ctx.fillText(c.tag, 0, by-3);
      ctx.restore();
    }
  }
  function drawGold(cv, V){
    const ctx = cv.getContext('2d'); const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 300, h = cv.clientHeight || 70;
    if(cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.fillStyle = 'rgba(1,10,19,0.75)'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(200,155,60,0.35)'; ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
    const gs = V.gs; if(!gs.length) return;
    const blueIsA = V.blueSide==='A';
    const maxT = Math.max(900, V.t), maxG = Math.max(3000, ...gs.map(x=>Math.abs(x[1])));
    ctx.lineWidth = 2;
    ctx.beginPath();
    gs.forEach(([t,dv],i)=>{ const v = blueIsA ? dv : -dv; const x = t/maxT*w, y = h/2 - v/maxG*(h/2-6); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.strokeStyle = GOLD; ctx.stroke();
    const last = gs[gs.length-1][1]*(blueIsA?1:-1);
    ctx.font = 'bold 11px "Barlow Condensed",sans-serif'; ctx.fillStyle = last>=0 ? BLUE : RED; ctx.textAlign = 'right';
    ctx.fillText(`${last>=0?'蓝方':'红方'} +${(Math.abs(last)/1000).toFixed(1)}k`, w-6, 13);
    ctx.textAlign='left'; ctx.fillStyle = '#a09b8c'; ctx.fillText('经济差', 6, 13);
  }

  // ---------------- DOM 面板 ----------------
  const kfmt = g => (g/1000).toFixed(1)+'k';
  function itemsHtml(items, partial){
    const cells = [];
    for(let i=0;i<6;i++){ const id = items[i]; cells.push(id ? `<span class="it" title="${esc(ITEM_CN(id))}"><img src="${itemIconUrl(id)}" alt="" onerror="this.remove()"><em>${esc(ITEM_CN(id).slice(0,2))}</em></span>` : (i===items.length && partial ? `<span class="it part" title="合成中：${esc(ITEM_CN(partial))}"><img src="${itemIconUrl(partial)}" alt="" onerror="this.remove()"><em>${esc(ITEM_CN(partial).slice(0,2))}</em></span>` : '<span class="it empty"></span>')); }
    return cells.join('');
  }
  function scoreHtml(V){
    const L = V.blueSide, R = other(L);
    const tL = V.team[L], tR = V.team[R];
    const gold = s => V.champs.filter(c=>c.side===s).reduce((a,c)=>a+c.gold,0);
    const drk = tm => tm.drakes.map(d=>`<i class="dk" style="--c:${DRAKE_COLOR[d]||'#888'}" title="${esc(DRAKE_CN[d]||'')}"></i>`).join('') + (tm.soul?`<b class="soul">龙魂</b>`:'');
    const buff = tm => (tm.baronT>V.t?'<span class="bf bar">大龙 Buff</span>':'') + (tm.elderT>V.t?'<span class="bf eld">远古龙</span>':'');
    return `<div class="w5-tm blue"><b class="w5-tn">${esc(tL.name)}</b><span class="w5-k">${tL.kills}</span>
        <span class="w5-st"><i>💰</i>${kfmt(gold(L))}</span><span class="w5-st"><i>🏰</i>${tL.towers}</span><span class="w5-st"><i>👾</i>${tL.barons}</span><span class="w5-dk">${drk(tL)}</span>${buff(tL)}</div>
      <div class="w5-clock">${fmtSec(V.t)}</div>
      <div class="w5-tm red">${buff(tR)}<span class="w5-dk">${drk(tR)}</span><span class="w5-st"><i>👾</i>${tR.barons}</span><span class="w5-st"><i>🏰</i>${tR.towers}</span><span class="w5-st"><i>💰</i>${kfmt(gold(R))}</span>
        <span class="w5-k">${tR.kills}</span><b class="w5-tn">${esc(tR.name)}</b></div>`;
  }
  function playersHtml(V){
    const col = s => V.champs.filter(c=>c.side===s).map(c=>`<div class="w5-p ${c.alive?'':'dead'}">
        <span class="w5-ava">${champAvatar(c.c,'xs')}<b class="lv">${c.lvl}</b>${!c.alive&&c.rt?`<b class="rt">${c.rt}</b>`:''}</span>
        <span class="w5-nm"><b>${esc(c.tag)}</b><small>${esc(c.cn||'')}</small><i class="hpb"><i style="width:${Math.round(clamp(c.hp,0,1)*100)}%"></i></i></span>
        <span class="w5-kda">${c.k}/${c.d}/${c.a}</span><span class="w5-cs">${c.cs}</span><span class="w5-g">${kfmt(c.gold)}</span></div>`).join('');
    const L = V.blueSide, R = other(L);
    return `<div class="w5-pcol blue"><div class="w5-ph"><span>选手</span><span>K/D/A</span><span>补刀</span><span>经济</span></div>${col(L)}</div>
      <div class="w5-pcol red"><div class="w5-ph"><span>选手</span><span>K/D/A</span><span>补刀</span><span>经济</span></div>${col(R)}</div>`;
  }
  function tabHtml(V){
    const row = c => `<tr class="${c.blue?'b':'r'}"><td class="tn">${champAvatar(c.c,'xs')}<b>${esc(c.tag)}</b></td><td>${c.lvl}</td><td>${c.k}/${c.d}/${c.a}</td><td>${c.cs}</td>
      <td class="items">${itemsHtml(c.items, c.partial)}</td><td class="gd"><b>${c.cur}</b><small>总 ${kfmt(c.gold)}</small></td></tr>`;
    const L = V.blueSide, R = other(L);
    return `<div class="w5-tab-hd"><b>装备与经济</b><small>按 Tab 键或点「装备」按钮开关</small></div>
      <table class="w5-tbl"><tr><th>选手</th><th>等级</th><th>K/D/A</th><th>补刀</th><th>装备</th><th>金币</th></tr>
      ${V.champs.filter(c=>c.side===L).map(row).join('')}<tr class="sep"><td colspan="6"></td></tr>${V.champs.filter(c=>c.side===R).map(row).join('')}</table>`;
  }
  function feedHtml(V){
    const list = V.feed.slice(-40).reverse();
    return list.map((f,i)=>`<div class="w5-fl ${f.hl?'hl':''} ${f.side?(f.side===V.blueSide?'b':'r'):''} ${i===0?'new':''}"><span class="t">${esc(f.t)}</span><span class="tg">${esc(f.tag)}</span><span class="tx">${esc(f.text)}</span></div>`).join('') || '<div class="w5-fl"><span class="tx">比赛即将开始，双方选手正在进入召唤师峡谷……</span></div>';
  }

  // ---------------- 外壳 HTML（由 ui.js 的 matchScreen 输出） ----------------
  function ctrlHtml(kind){
    const w = W; const sp = w ? w.speed : 1;
    return `<div class="w-ctrl">
      ${SPEEDS.map(v=>`<button class="spd-btn ${sp===v&&!(w&&w.paused)?'on':''}" data-a="wSpeed" data-v="${v}">${v}x</button>`).join('')}
      <button class="spd-btn ${w&&w.paused?'on':''}" data-a="wPause">${w&&w.paused?'▶ 继续':'⏸ 暂停'}</button>
      <button class="spd-btn ${w&&w.tab?'on':''}" data-a="wTab">装备 Tab</button>
      ${w && w.replay ? `<input type="range" class="w-seek" id="w-seek" min="0" max="${Math.round(w.dur)}" value="${Math.round(w.t||0)}">
        <button class="spd-btn skip" data-a="wExit">退出回放</button>`
        : `<button class="spd-btn skip" data-a="wSkip">跳过直看结算 ⏭</button>`}
    </div>`;
  }
  function shell5(){
    return `<div class="watch5 pane-${W?W.pane:'feed'}" id="watch5">
      <div class="w5-score" id="w5-score"></div>
      <div class="w5-mtabs"><button data-a="wPane" data-v="feed" class="${W&&W.pane==='feed'?'on':''}">战报</button><button data-a="wPane" data-v="data" class="${W&&W.pane==='data'?'on':''}">数据</button></div>
      <div class="w5-main">
        <div class="w5-mapbox"><canvas id="w5-map"></canvas><canvas id="w5-gold" class="w5-goldcv"></canvas>
          <div class="w5-banner" id="w5-banner" style="display:none"></div></div>
        <div class="w5-feed" id="w5-feed"></div>
      </div>
      <div class="w5-players" id="w5-players"></div>
      ${ctrlHtml('5')}
      <div class="w5-tab ${W&&W.tab?'on':''}" id="w5-tab"></div>
    </div>`;
  }
  function shellSolo(){
    return `<div class="watch1" id="watch1">
      <div class="w1-cards" id="w1-cards"></div>
      <div class="w1-lanebox"><canvas id="w1-lane"></canvas><div class="w5-banner" id="w1-banner" style="display:none"></div></div>
      ${ctrlHtml('1')}
      <div class="w1-feed" id="w1-feed"></div>
      <div class="w5-tab ${W&&W.tab?'on':''}" id="w1-tab"></div>
    </div>`;
  }

  // ---------------- 1v1 视图 ----------------
  function viewSolo(){
    if(W.replay){
      const rec = W.rec; const idx = clamp(Math.floor(W.t), 0, rec.f.length-1);
      const fr = soloFrameAt(rec, idx), nx = soloFrameAt(rec, idx+1), k = W.t - Math.floor(W.t);
      const lerp = (a,b)=>a+(b-a)*k;
      const f = s => { const a = fr[s], b = nx[s]; return Object.assign({}, a, {s:lerp(a.s,b.s), hp:a.hp}); };
      const log = W.log.filter(x=>x.sec <= fr.t);
      return { t:fr.t, A:Object.assign(f('A'), W.meta.A, {items:W.meta.A.items.slice(0, Math.max(1, fr.A.nItems))}), B:Object.assign(f('B'), W.meta.B, {items:W.meta.B.items.slice(0, Math.max(1, fr.B.nItems))}), wave:fr.wave, twA:fr.twA, twB:fr.twB, fx:fr.fx, log, over: idx >= rec.f.length-1, winner: idx >= rec.f.length-1 ? W.winner : null };
    }
    const g = W.g, k = W.acc;
    const f = F => ({ s:F.s, hp:F.hp, mp:F.mp, lvl:F.lvl, cs:F.cs, gold:Math.max(0,Math.round(F.gold)), flash:F.flash, s2cd:F.s2cd, st:F.recall>0?1:F.away>0?2:0, tag:F.tag, champ:F.champ, cn:F.cn, sum2:F.sum2, items:F.items, role:F.role, dead:F.dead });
    return { t:g.t, A:f(g.F.A), B:f(g.F.B), wave:g.wave, twA:g.tw.A, twB:g.tw.B, fx: g.fxT>0 ? g.fx : null, log:g.log, over:g.over, winner:g.winner };
  }
  const spellImgs = {};
  function spellImg(k){ if(!spellImgs[k]){ const im = new Image(); spellImgs[k] = {im, ok:false}; im.onload=()=>spellImgs[k].ok=true; im.src = spellUrl(k); } return spellImgs[k]; }
  function drawSolo(cv, V){
    const ctx = cv.getContext('2d'); const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 600, h = cv.clientHeight || 220;
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // 背景：中路 + 河道
    const bg = ctx.createLinearGradient(0,0,w,0); bg.addColorStop(0,'#0f2a33'); bg.addColorStop(0.5,'#142a2a'); bg.addColorStop(1,'#2b1d24');
    ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
    const ly = h*0.58, lh = h*0.36;
    ctx.fillStyle = '#4a4636'; ctx.fillRect(0, ly-lh/2, w, lh);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, ly-lh/2, w, 4); ctx.fillRect(0, ly+lh/2-4, w, 4);
    ctx.fillStyle = 'rgba(40,110,150,0.5)'; ctx.fillRect(w*0.47, 0, w*0.06, h);
    if(V.t >= 600){ const r = clamp((V.t-600)/120,0,1); ctx.fillStyle = `rgba(255,90,40,${0.12+0.2*r})`; ctx.fillRect(0,0,w*0.5*r*0.8,h); ctx.fillRect(w-w*0.5*r*0.8,0,w*0.5*r*0.8,h); }
    const X = s => s*w;
    // 防御塔
    const tower = (s, hp, col) => { const x = X(s); ctx.fillStyle = '#091428'; ctx.fillRect(x-14, ly-44, 28, 50); ctx.fillStyle = col; ctx.fillRect(x-10, ly-40, 20, 42);
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x-22, ly-56, 44, 7); ctx.fillStyle = hp>0.5?'#3ddc84':hp>0.25?'#f5c542':'#ff4d5e'; ctx.fillRect(x-21, ly-55, 42*clamp(hp,0,1), 5); };
    tower(SOLO_TW.A, V.twA, BLUE); tower(SOLO_TW.B, V.twB, RED);
    // 兵线
    const wx = X(V.wave);
    ctx.fillStyle = '#4aa3ff'; for(let i=0;i<5;i++) ctx.fillRect(wx-30+i*5, ly-6+(i%2)*10, 7, 7);
    ctx.fillStyle = '#ff5a6e'; for(let i=0;i<5;i++) ctx.fillRect(wx+6+i*5, ly-6+((i+1)%2)*10, 7, 7);
    if(V.fx){ const x = X(V.fx.s); ctx.strokeStyle = V.fx.k==='allin' ? 'rgba(255,80,60,0.9)' : 'rgba(255,220,120,0.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, ly-4, V.fx.k==='allin'?44:28, 0, Math.PI*2); ctx.stroke(); }
    // 英雄
    const R = Math.min(30, h*0.15);
    for(const side of ['A','B']){
      const F = V[side]; if(F.st>0 && !V.over) continue;
      if(F.dead || (V.over && V.winner && V.winner!==side && F.hp<=0.01)) { ctx.globalAlpha = 0.35; }
      const x = X(F.s), y = ly - 6 + (side==='A'?-8:8);
      const col = side==='A' ? BLUE : RED;
      ctx.beginPath(); ctx.arc(x, y, R+4, 0, Math.PI*2); ctx.fillStyle = col; ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.clip();
      const im = champImg(F.champ);
      if(im && im.ok) ctx.drawImage(im.im, x-R, y-R, R*2, R*2); else { ctx.fillStyle = '#223'; ctx.fillRect(x-R,y-R,R*2,R*2); ctx.fillStyle='#f0e6d2'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText((F.cn||'').slice(0,2), x, y); }
      ctx.restore();
      const bw = 70, by = y - R - 22;
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(x-bw/2-1, by-1, bw+2, 13);
      ctx.fillStyle = F.hp>0.5?'#3ddc84':F.hp>0.25?'#f5c542':'#ff4d5e'; ctx.fillRect(x-bw/2, by, bw*clamp(F.hp,0,1), 7);
      ctx.fillStyle = '#4aa3ff'; ctx.fillRect(x-bw/2, by+8, bw*clamp(F.mp,0,1), 3);
      ctx.fillStyle = GOLD; ctx.fillRect(x-bw/2-18, by-2, 16, 15); ctx.fillStyle = '#091428'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(F.lvl, x-bw/2-10, by+6);
      ctx.font = 'bold 13px "Noto Sans SC",sans-serif'; ctx.textBaseline='bottom'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.strokeText(F.tag, x, by-3); ctx.fillStyle = side==='A'?'#bff6f0':'#ffd0d6'; ctx.fillText(F.tag, x, by-3);
      ctx.globalAlpha = 1;
    }
    ctx.font = 'bold 12px "Barlow Condensed",sans-serif'; ctx.fillStyle = '#a09b8c'; ctx.textAlign = 'center'; ctx.textBaseline='top';
    ctx.fillText(V.t >= 600 ? '火圈收缩中' : '峡谷中路', w/2, 8);
  }
  function soloCardsHtml(V){
    const card = side => {
      const F = V[side], isL = side==='A';
      const tKey = side==='A' ? W.teamA : W.teamB;
      const cd = (k, t) => `<span class="sp ${t>0?'cd':''}" title="${k==='flash'?'闪现':k==='ig'?'点燃':'屏障'}"><img src="${spellUrl(k)}" alt="" onerror="this.remove()"><em>${k==='flash'?'闪':k==='ig'?'燃':'盾'}</em>${t>0?`<b>${Math.ceil(t)}</b>`:''}</span>`;
      const win = V.over && V.winner===side;
      return `<div class="w1-card ${isL?'left':'right'} ${win?'winner':''} ${V.over&&V.winner&&!win?'loser':''}">
        <div class="w1-top">${champAvatar(F.champ,'md')}<div><div>${teamTag(tKey)} ${side===W.me?'<em class="me-pill">我方</em>':''}</div><div class="w1-nm"><b>${esc(F.tag)}</b> · ${esc(champName(F.champ))} <small>Lv ${F.lvl}</small></div></div>
          <div class="w1-sp">${cd('flash',F.flash)}${cd(F.sum2||'ig',F.s2cd)}</div></div>
        <div class="w1-bars"><div class="sf-bar"><i class="hp ${F.hp>0.55?'hi':F.hp>0.28?'mid':'lo'}" style="width:${Math.round(clamp(F.hp,0,1)*100)}%"></i></div><div class="sf-bar mp"><i style="width:${Math.round(clamp(F.mp,0,1)*100)}%"></i></div></div>
        <div class="w1-stats"><span>🌾 <b>${F.cs}</b>/100</span><span>🏰 <b>${Math.round((side==='A'?V.twA:V.twB)*100)}%</b></span><span>💰 <b>${F.gold}</b></span>${F.st===1?'<span class="st">回城中</span>':F.st===2?'<span class="st">赶回线上</span>':''}</div>
      </div>`;
    };
    return `${card('A')}<div class="w1-clock"><div class="solo-time">${fmtSec(V.t)}</div><div class="solo-vs">1 v 1</div><div class="solo-event-pill">${esc((V.log[V.log.length-1]||{}).tag||'')}</div></div>${card('B')}`;
  }
  function soloTabHtml(V){
    const row = side => { const F = V[side]; return `<tr class="${side==='A'?'b':'r'}"><td class="tn">${champAvatar(F.champ,'xs')}<b>${esc(F.tag)}</b></td><td>${F.lvl}</td><td>${F.cs}</td><td class="items">${itemsHtml(F.items||[], null)}</td><td class="gd"><b>${F.gold}</b></td></tr>`; };
    return `<div class="w5-tab-hd"><b>装备与经济</b><small>按 Tab 键或点「装备」按钮开关</small></div><table class="w5-tbl"><tr><th>选手</th><th>等级</th><th>补刀</th><th>装备</th><th>金币</th></tr>${row('A')}${row('B')}</table>`;
  }

  // ---------------- 主循环 ----------------
  function stepOnce(){
    if(W.kind==='g5'){
      if(W.replay){ return; }
      step5(W.g);
    } else {
      if(W.replay) return;
      soloStep(W.g);
    }
  }
  function frame(ts){
    raf = 0;
    if(!W) return;
    const dt = lastTs ? Math.min(0.1, (ts - lastTs)/1000) : 0; lastTs = ts;
    if(!W.paused && !W.done){
      const rate = (W.kind==='g5' ? SIM_RATE5 : SIM_RATE1) * W.speed;
      if(W.replay){
        W.t = Math.min(W.dur, (W.t||0) + dt*rate);
        if(W.t >= W.dur) finish();
      } else {
        const unit = W.kind==='g5' ? SIM5.DT : 1;
        W.acc += dt*rate/unit;
        let guard = 0;
        while(W.acc >= 1 && guard++ < 40){ W.acc -= 1; stepOnce(); if(W.g.over){ W.acc = 1; break; } }
        if(W.g.over) finish();
      }
    }
    paint(false);
    raf = requestAnimationFrame(frame);
  }
  let _domT = 0;
  function paint(forceDom){
    if(!W) return;
    if(W.kind==='g5'){
      const V = W.replay ? view5Rec(W.rec, W.t) : view5Live(W.g, Math.min(1, W.acc));
      const cv = document.getElementById('w5-map'); if(cv) drawMap(cv, V);
      const now = performance.now();
      if(forceDom || now - _domT > 220){
        _domT = now;
        const gcv = document.getElementById('w5-gold'); if(gcv) drawGold(gcv, V);
        setHtml('w5-score', scoreHtml(V)); setHtml('w5-players', playersHtml(V)); setHtml('w5-feed', feedHtml(V));
        if(W.tab) setHtml('w5-tab', tabHtml(V));
        const sk = document.getElementById('w-seek'); if(sk && W.replay && !W.seeking) sk.value = Math.round(W.t);
      }
    } else {
      const V = viewSolo();
      const cv = document.getElementById('w1-lane'); if(cv) drawSolo(cv, V);
      const now = performance.now();
      if(forceDom || now - _domT > 200){
        _domT = now;
        setHtml('w1-cards', soloCardsHtml(V));
        setHtml('w1-feed', V.log.slice().reverse().slice(0,40).map((f,i)=>`<div class="solo-line ${i===0?'latest':''} ${f.side==='A'?'sa':f.side==='B'?'sb':''} ${f.hl?'hl':''}"><span class="sl-t">${esc(f.t)}</span><span class="sl-tag">${esc(f.tag)}</span><span class="sl-txt">${esc(f.text)}</span></div>`).join(''));
        if(W.tab) setHtml('w1-tab', soloTabHtml(V));
        const sk = document.getElementById('w-seek'); if(sk && W.replay && !W.seeking) sk.value = Math.round(W.t);
      }
    }
  }
  const _htmlCache = {};
  function setHtml(id, html){ const el = document.getElementById(id); if(!el) return; if(el._h === html) return; el._h = html; el.innerHTML = html; }
  function finish(){
    if(W.done) return;
    W.done = true;
    const ban = document.getElementById(W.kind==='g5'?'w5-banner':'w1-banner');
    if(W.replay){ if(ban){ ban.style.display='flex'; ban.innerHTML = '<b>回放结束</b>'; } return; }
    paint(true);
    if(ban){
      const wn = W.kind==='g5' ? W.g.team[W.g.winner].name : W.g.F[W.g.winner].tag;
      ban.style.display = 'flex';
      ban.innerHTML = `<b>${W.kind==='g5'?'VICTORY':'1v1 结束'}</b><span>${esc(wn)} ${W.kind==='g5'?'赢下本局':'赢得选边权'}</span>`;
    }
    const cb = W.onEnd;
    setTimeout(()=>{ if(W && W.done && !W.replay){ const w = W; stop(); cb && cb(w); } }, W.skipped ? 200 : 2200);
  }
  function start(opts){
    stop();
    W = Object.assign({ speed:1, paused:false, acc:0, t:0, tab:false, pane:'feed', done:false }, opts);
    lastTs = 0;
    if(!raf) raf = requestAnimationFrame(frame);
  }
  function stop(){ if(raf) cancelAnimationFrame(raf); raf = 0; W = null; }
  function active(){ return W; }
  function afterRender(){
    if(!W) return;
    _domT = 0;
    ['w5-score','w5-players','w5-feed','w5-tab','w1-cards','w1-feed','w1-tab'].forEach(id=>{ const el=document.getElementById(id); if(el) el._h=null; });
    paint(true);
    if(!raf) raf = requestAnimationFrame(frame);
  }
  // 跳过：把剩余模拟纯计算跑完
  function skip(){
    if(!W || W.replay) return;
    if(W.kind==='g5'){ while(!W.g.over) step5(W.g); } else { while(!W.g.over) soloStep(W.g); }
    W.skipped = true; finish();
  }
  function control(act, v){
    if(!W) return false;
    if(act==='speed'){ W.speed = +v || 1; W.paused = false; }
    else if(act==='pause'){ W.paused = !W.paused; }
    else if(act==='tab'){ W.tab = !W.tab; }
    else if(act==='pane'){ W.pane = v; }
    else if(act==='skip'){ skip(); return true; }
    else if(act==='seek'){ W.t = clamp(+v||0, 0, W.dur); W.done = false; const ban = document.getElementById(W.kind==='g5'?'w5-banner':'w1-banner'); if(ban) ban.style.display='none'; }
    return true;
  }
  document.addEventListener('keydown', e=>{
    if(!W) return;
    if(e.key==='Tab'){ e.preventDefault(); W.tab = !W.tab; if(typeof render==='function') render(); }
    else if(e.key===' ' && e.target===document.body){ e.preventDefault(); W.paused = !W.paused; if(typeof render==='function') render(); }
  });
  document.addEventListener('input', e=>{ if(e.target && e.target.id==='w-seek' && W && W.replay){ W.seeking = true; control('seek', e.target.value); paint(true); } });
  document.addEventListener('change', e=>{ if(e.target && e.target.id==='w-seek' && W){ W.seeking = false; } });
  return { start, stop, active, afterRender, control, shell5, shellSolo, ctrlHtml };
})();
</script>
<script>// ================= 界面 =================
const UI = { view:'home', modal:null, match:null, evSel:null, mk:{region:'ALL',role:'ALL',q:'',sort:'rating',fa:false}, toast:null, hasSave:false, savePreview:null, authBusy:false, entry:'gate', authTab:'login', pickTeam:false, verifyEmail:null, resendCd:0 };
let _resendTimer = null;
function startResendCd(sec){
  if(_resendTimer){ clearInterval(_resendTimer); _resendTimer=null; }
  UI.resendCd = sec;
  _resendTimer = setInterval(()=>{
    if(UI.resendCd > 0){
      UI.resendCd--;
      const btn = document.getElementById('btn-resend-otp');
      if(btn){ btn.textContent = UI.resendCd>0 ? `重新发送 (${UI.resendCd}s)` : '重新发送验证码'; btn.disabled = UI.resendCd>0 || UI.authBusy; }
    } else { clearInterval(_resendTimer); _resendTimer=null; }
  }, 1000);
}
const SAVE_KEY='lolm_save_v1';
const $app = () => document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){
  if(!S) return;
  try{
    S._sync = { updatedAt: Date.now(), device: detectPlatformLabel() };
    const txt = JSON.stringify(S);
    UI.hasSave = true;
    UI.savePreview = makeSaveSummary(S);
    StorageBridge.writeSaveText(txt);
    CloudSync.schedulePush(S);
  }catch(e){ console.warn(e); }
}
async function load(){
  try{
    const txt = await StorageBridge.readSaveText();
    if(txt){ S = migrateSave(JSON.parse(txt)); UI.hasSave = true; UI.savePreview = makeSaveSummary(S); return true; }
  }catch(e){ console.warn(e); }
  return false;
}
function toast(t){ UI.toast=t; render(); setTimeout(()=>{ if(UI.toast===t){UI.toast=null; render();} },3000); }
const teamTag = (k,cls='') => { const t=T(k); if(!t) return '—'; return `<span class="tt ${cls} ${k===S.user?'me':''}" title="${esc(t.name)}"><b>${esc(t.short)}</b><i>${t.region}</i></span>`; };
const champName = c => c? (CH[c]?CH[c].cn:c) : '';
const ovrBadge = v => `<b class="ovr ${v>=88?'s':v>=80?'a':v>=72?'b':'c'}">${Math.round(v)}</b>`;
const transferOpen = () => { const ev=curEvent(); return ev.type==='window'||ev.type==='off'||(ev.type==='lpl_s1'&&!ev.started); };

// 后台尝试拉取最新 Data Dragon 版本号（失败/离线静默沿用内置 16.2.1）
(function refreshDDragon(){
  try{
    fetch('https://ddragon.leagueoflegends.com/api/versions.json')
      .then(r=>r.ok?r.json():null)
      .then(v=>{ if(Array.isArray(v)&&v[0]){ window.DDRAGON_VER=v[0]; if(UI.match) render(); } })
      .catch(()=>{});
  }catch(e){}
})();

// LoL 风格位置 SVG 图标

// 英雄头像（Riot Data Dragon CDN + 离线/失败无缝降级为海克斯首字徽章）
function champAvatar(c, cls=''){
  if(!c || !CH[c]) return `<div class="c-ava empty ${cls}"><span>?</span></div>`;
  const ch = CH[c];
  const hue = hash(c) % 360;
  const mono = ch.cn.slice(0,2);
  return `<div class="c-ava ${cls}" style="--h:${hue}">
    <img src="${champIconUrl(c)}" alt="${esc(ch.cn)}" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <span class="c-fb" style="display:none">${esc(mono)}</span>
  </div>`;
}

// BP 视觉倒计时器（氛围用，不强制超时乱选）
let _bpTimer = null;
function resetBpClock(){
  if(_bpTimer){ clearInterval(_bpTimer); _bpTimer = null; }
  const M = UI.match;
  if(!M || M.phase!=='draft') return;
  M.clock = 30;
  _bpTimer = setInterval(()=>{
    if(!UI.match || UI.match!==M || M.phase!=='draft'){ clearInterval(_bpTimer); _bpTimer=null; return; }
    if(M.clock > 0){
      M.clock--;
      const num = document.getElementById('bp-clock-num');
      const bar = document.getElementById('bp-clock-fill');
      if(num){ num.textContent = String(M.clock).padStart(2,'0'); num.classList.toggle('urgent', M.clock<=5); }
      if(bar){ bar.style.width = (M.clock/30*100)+'%'; }
    }
  }, 1000);
}
function stopBpClock(){ if(_bpTimer){ clearInterval(_bpTimer); _bpTimer=null; } }

function cloudPillHtml(){
  const st = CloudSync.status;
  if(CloudSync.isLoggedIn()){
    const label = st==='syncing' ? '同步中…' : st==='offline' ? '离线(已存本地)' : '已同步';
    return `<button class="cloud-pill ${st}" data-a="openAccount" title="${esc(CloudSync.auth.user.email)} · ${label}">☁️ <b>${esc(CloudSync.auth.user.email.split('@')[0])}</b><small>${label}</small></button>`;

}

       <div class="btns">

function probs(){ const p=lineupProblems(S.user); return p.length?`<p class="warn">⚠️ ${p.join('；')} —— 请到“阵容”调整后方可参赛</p>`:''; }
function eventHasUser(ev){ return ev.stages.some(st=>st.matches.some(m=>userInvolved(m)&&!m.w)) || ev.stages.some(st=>(st.teams||[]).includes(S.user)&&st.kind==='swiss'&&st.rec[S.user][0]<3&&st.rec[S.user][1]<3) || (ev.stages[ev.si]&&ev.stages[ev.si].kind==='rr'&&Object.values(ev.stages[ev.si].groups).some(g=>g.includes(S.user))); }
function findMyNext(){ const ev=curEvent(); if(!ev.started||ev.done) return null; for(const st of ev.stages){ if(st.kind==='br') resolveBR(st); const m=st.matches.find(m=>!m.w&&userInvolved(m)&&m.a&&m.b); if(m) return {m,st}; } return null; }
function seasonTimeline(){
  return `<ol class="tl">${S.events.map((e,i)=>{ const inf=EVENT_INFO[e.type];
    const st = i<S.evIdx||e.done?'past':i===S.evIdx?'now':'';
    return `<li class="${st}"><b>${inf.name}</b> <small>${inf.date}</small> ${e.res&&e.res.champ?`· 冠军 ${teamTag(e.res.champ)}`:''}</li>`; }).join('')}</ol>`;
}
function pointsTable(){
  const rows=S.lplOrder.slice().sort((a,b)=>(S.points[b]||0)-(S.points[a]||0));
  return `<table class="tbl"><tr><th>#</th><th>战队</th><th>积分</th></tr>${rows.map((k,i)=>`<tr class="${k===S.user?'me':''}"><td>${i+1}</td><td>${teamTag(k)}</td><td><b>${S.points[k]||0}</b></td></tr>`).join('')}</table>`;
}
function eventSummary(ev){
  const r=ev.res; let h='';
  if(r.champ) h+=`<p>🏆 冠军：${teamTag(r.champ)}</p>`;
  if(r.final) h+=`<p>最终排名：${r.final.slice(0,8).map((t,i)=>`${i+1}. ${teamTag(t)}`).join(' ')}</p>`;
  if(r.seeds && Array.isArray(r.seeds)) h+=`<p>LPL世界赛代表：${r.seeds.map((t,i)=>`${i+1}号种子 ${teamTag(t)}`).join(' ')}</p>`;
  if(r.runner) h+=`<p>亚军：${teamTag(r.runner)}</p>`;
  return h;
}

VIEWS.market = () => {
  const f=UI.mk;
  let ps=Object.values(S.players).filter(p=>!p.retired && p.team!==S.user);
  if(f.fa) ps=ps.filter(p=>!p.team); else ps=ps.filter(p=>p.team);
  if(f.region!=='ALL') ps=ps.filter(p=>p.team&&T(p.team).region===f.region);
  if(f.role!=='ALL') ps=ps.filter(p=>p.role===f.role);
  if(f.q) ps=ps.filter(p=>(playerTag(p)+p.name+(p.team||'')).toLowerCase().includes(f.q.toLowerCase()));
  const key={rating:p=>-p.rating, value:p=>-playerValue(p), age:p=>p.age, pot:p=>-p.pot}[f.sort];
  ps.sort((a,b)=>key(a)-key(b));
  const open=transferOpen();
  return `<section class="card"><h2>转会市场 ${open?'<span class="on">窗口开放</span>':'<span class="off">窗口关闭</span>'}</h2>
  ${open?'':'<p class="warn">当前不在转会窗口内，可以浏览，但无法报价。窗口在第一赛段开赛前、先锋赛后、EWC后以及休赛期开放。</p>'}
  <div class="filters">
    <select data-f="region">${['ALL',...REGIONS].map(r=>`<option ${f.region===r?'selected':''} value="${r}">${r==='ALL'?'全部赛区':r}</option>`).join('')}</select>
    <select data-f="role">${['ALL',...ROLES].map(r=>`<option ${f.role===r?'selected':''} value="${r}">${r==='ALL'?'全部位置':ROLE_CN[r]}</option>`).join('')}</select>
    <select data-f="sort">${[['rating','按能力'],['value','按身价'],['pot','按潜力'],['age','按年龄']].map(([k,n])=>`<option ${f.sort===k?'selected':''} value="${k}">${n}</option>`).join('')}</select>
    <label><input type="checkbox" data-f="fa" ${f.fa?'checked':''}> 只看自由球员/新秀</label>
    <input data-f="q" placeholder="搜索选手/战队" value="${esc(f.q)}">

  </div>
  <table class="tbl"><tr><th>选手</th><th>战队</th><th>位置</th><th>国籍</th><th>年龄</th><th>能力</th><th>潜力</th><th>身价</th><th>要价</th><th>合同至</th><th></th></tr>
  ${ps.slice(0,150).map(p=>`<tr><td><b>${esc(playerTag(p))}</b><br><small>${esc(p.name)}</small></td><td>${p.team?teamTag(p.team):'<i>自由球员</i>'}</td><td>${ROLE_CN[p.role]}</td><td>${esc(p.nat)}</td><td>${p.age}</td><td>${ovrBadge(p.rating)}</td><td>${p.pot}</td><td>${fmtMoney(playerValue(p))}</td><td>${p.team?fmtMoney(askPrice(p)):'—'}</td><td>${p.contract}</td>
   <td>${open?`<button class="btn sm" data-a="offer" data-p="${esc(p.pid)}">${p.team?'报价':'签约'}</button>`:''}</td></tr>`).join('')}</table>
   ${ps.length>150?'<p class="muted">仅显示前150人，请使用筛选。</p>':''}</section>`;

function offerModal(pid){
  return () => { const p=P(pid); const me=T(S.user);
    const cash = UI.offerCash!=null?UI.offerCash:(p.team?askPrice(p):0); const give=UI.offerGive||'';
    const e = p.team? evaluateOffer(pid,cash,give||null):null;
    const verdict = !e? '' : e.ratio>=1.05?'<b class="g">对方大概率接受</b>':e.ratio>=0.9?'<b class="y">有机会，对方在犹豫</b>':'<b class="r">对方很可能拒绝</b>';
    return `<h3>${p.team?'报价':'签约'}：${esc(playerTag(p))} <small>${ROLE_CN[p.role]} · ${p.team?teamTag(p.team):'自由球员'}</small></h3>
     <p>能力 ${ovrBadge(p.rating)} · 潜力 ${p.pot} · ${p.age}岁 · 身价 ${fmtMoney(playerValue(p))} · 预计年薪 ${fmtMoney(Math.max(p.salary,fairSalary(p)))}</p>
     ${p.team?`<label>转会费（万）：<input type="number" min="0" step="10" data-o="cash" value="${cash}"></label>

  if(st.kind==='rr'){
    return `<h3>${esc(st.name)}</h3><div class="cols">${Object.keys(st.groups).map(g=>`<div><h4>${g}</h4><table class="tbl"><tr><th>#</th><th>战队</th><th>胜</th><th>负</th><th>小局</th></tr>${rrTable(st,g).map((r,i)=>`<tr class="${r.t===S.user?'me':''}"><td>${i+1}</td><td>${teamTag(r.t)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.gw}-${r.gl}</td></tr>`).join('')}</table></div>`).join('')}</div>

// ================= 比赛（1v1 选边赛 + LoL 海克斯风格 BP）界面 =================
function needsSolo1v1(M){
  // 首局开赛前，以及 BO5 第 5 局决胜局（2:2）赛前打 1v1 选边赛
  return M.games.length === 0 || (M.item.m.bo === 5 && M.wa === 2 && M.wb === 2);
}
function enterNextGamePhase(M){
  const m = M.item.m, me = M.me, op = me==='A'?'B':'A';
  M.draft = null; M.sel = null; M.roleSel = null; M.swapFrom = null;
  M.solo = null; M.soloAiBlue = null; Watch.stop();
  if(needsSolo1v1(M)){
    const myTeamKey = m[me==='A'?'a':'b'];
    const def = defaultSoloPick(myTeamKey);
    M.soloMyRole = def.role;
    M.soloMyChamp = def.champ;
    M.phase = 'solo_pick';
    return;
  }
  // 非 1v1 局：由上一局败者直接选边（蓝色方固定 BP 先手，红色方固定 BP 后手）
  if(M.chooser === me){
    M.phase = 'choose';
  } else {
    const opSide = aiChooseSide(m[op==='A'?'a':'b'], m[me==='A'?'a':'b'], M.locked);
    const blue = opSide === 'blue' ? op : me;
    setupDraft(blue);
    toast(`对手拥有选边权，选择了${opSide==='blue'?'蓝色方（BP先手）':'红色方（BP后手）'}，本局你位于${blue===me?'蓝色方（BP先手）':'红色方（BP后手）'}`);
  }
}
function beginUserMatch(item){
  const m=item.m; const me = m.a===S.user?'A':'B';
  UI.match = {
    item, me, wa:0, wb:0, games:[], locked:[],
    chooser: null,
    phase:'solo_pick', draft:null,
    solo:null, pendingSolo:null, soloMyRole:null, soloMyChamp:null, soloAiBlue:null,
    sel:null, roleSel:null, swapFrom:null,
    filter:'ALL', q:'', onlyAvail:false, showLocked:false, clock:30
  };
  enterNextGamePhase(UI.match);
  render();
}
// 本局比赛场合：国际赛 / 淘汰赛 / 决胜局（影响选手心态发挥）
function matchCtx(M){
  const m = M.item.m;
  if(!m.ctx) m.ctx = findMatchCtx(m) || {intl:false, ko:false};
  const need = Math.ceil(m.bo/2);
  return Object.assign({}, m.ctx, {decider: m.bo>1 && M.wa===need-1 && M.wb===need-1});
}
function setDraftCtx(M, d){ d.ctx = matchCtx(M); return d; }
// 回放：1v1 录像在下一局 5v5 时一起存
function soloReplayData(res){
  if(!res || !res.rec) return null;
  const meta = s => ({ tag:res[s].tag, champ:res[s].champ, cn:CH[res[s].champ]?CH[res[s].champ].cn:'', role:res[s].role, sum2:res[s].sum2, items:res[s].items.slice() });
  return { rec:res.rec, meta:{A:meta('A'), B:meta('B')}, log:res.log.map(x=>({t:x.t, sec:x.sec, side:x.side, tag:x.tag, text:x.text, hl:x.hl})), winner:res.winner, winReason:res.winReason, teamA:res.teamA, teamB:res.teamB };
}
function storeUserReplay(M, g){
  const m = M.item.m;
  const entry = { y:S.year, ev:(curEvent()||{}).type||'', label:m.label, a:m.a, b:m.b, gi:M.games.length+1, w:g.w, kA:g.kA, kB:g.kB, dur:g.dur,
    mvpTag:g.mvpTag, blue:g.blue, rec:g.rec||null, solo:M.pendingSolo||null, kept:false };
  g.rid = pushReplay(entry);
  delete g.rec;
  M.pendingSolo = null;
}
function setupDraft(blue){
  const M=UI.match;
  Watch.stop();
  M.draft = newDraft(M.item.m.a, M.item.m.b, blue, M.locked);
  setDraftCtx(M, M.draft);
  M.phase = 'draft'; M.sel = null; M.roleSel = null; M.swapFrom = null;
  resetBpClock();
  queueAI();
}

// 英雄角标含义解析（用于桌面端悬停浮层 & 手机端点击详情，不带括号数字）
const TAG_CN = {engage:'开团',poke:'消耗',pick:'抓单',scale:'后期',protect:'保护',split:'分推',early:'前期'};
const DMG_CN = {AD:'物理伤害',AP:'法术伤害',MIX:'混合伤害'};
function champBadgeInfo(d, M, k){
  const ch = CH[k]; if(!ch) return { badges:[], metaText:'' };
  const opp = M.me==='A'?'B':'A';
  const myLu = lineupMap(d[M.me]), oppLu = lineupMap(d[opp]);
  const badges = [];
  if((S.meta[k]||0) >= 2) badges.push({ icon:'🔥', cls:'t0', text:'版本 T0 强势英雄，当前版本强度极高' });
  else if((S.meta[k]||0) === 1) badges.push({ icon:'↑', cls:'t1', text:'版本 T1 热门英雄，版本契合度良好' });
  for(const r of ROLES){
    if(d.picks[M.me][r]) continue;
    const p = myLu[r];
    if(p && p.champs.some(x=>x.c===k && x.p>=4)){
      badges.push({ icon:'👑', cls:'mine', text:`我方 ${ROLE_CN[r]} ${playerTag(p)} 的招牌绝活` });
    }
  }
  for(const r of ROLES){
    if(d.picks[opp][r]) continue;
    const p = oppLu[r];
    if(p && p.champs.some(x=>x.c===k && x.p>=5)){
      badges.push({ icon:'⚠', cls:'opp', text:`对手 ${ROLE_CN[r]} ${playerTag(p)} 的招牌英雄，建议针对` });
    }
  }
  const metaText = `${ch.roles.map(r=>ROLE_CN[r]).join(' / ')} · ${DMG_CN[ch.dmg]||ch.dmg} · ${ch.tags.map(t=>TAG_CN[t]||t).join(' / ')}`;
  return { badges, metaText };
}
function queueAI(){
  const M=UI.match; if(!M||M.phase!=='draft') return;
  const cur=draftSide(M.draft);
  if(!cur){ stopBpClock(); M.phase='ready'; M.sel=null; render(); return; }
  resetBpClock();
  if(cur.side!==M.me){
    setTimeout(()=>{
      if(UI.match!==M||M.phase!=='draft') return;
      const nowCur = draftSide(M.draft);
      if(!nowCur || nowCur.side===M.me) return;
      const ch=aiChoose(M.draft);
      draftAct(M.draft, ch.c, ch.role, ch.offrole);
      if(nowCur.kind==='pick') optimizeAiFlex(M.draft, nowCur.side);
      render();
      queueAI();
    }, 520);
  }
}

// 计算当前 4 阶段索引（0=Ban1, 1=Pick1, 2=Ban2, 3=Pick2, 4=Done）
function draftPhaseIndex(step){
  if(step<6) return 0;
  if(step<12) return 1;
  if(step<16) return 2;
  if(step<20) return 3;
  return 4;
}

// 渲染单侧（蓝方左 / 红方右）5 个独立 Ban 槽（按 3 + 2 分组）
function renderBanRow(d, side, cur, isBlue){
  const bans = d.bans[side];
  const isMyBanTurn = cur && cur.kind==='ban' && cur.side===side;
  const activeIdx = isMyBanTurn ? bans.length : -1;
  const slotHtml = i => {
    const c = bans[i];
    const active = i === activeIdx;
    return `<div class="ban-slot ${c?'filled':''} ${active?'pulsing':''}" title="${c?esc(champName(c)):'待禁用'}">
      ${c ? `${champAvatar(c,'sm')}<div class="ban-slash"></div><span class="ban-lbl">${esc(champName(c))}</span>`
          : `<span class="ban-empty">${active?'BAN':(i+1)}</span>`}
    </div>`;
  };
  const group1 = `<div class="ban-grp">${[0,1,2].map(slotHtml).join('')}</div>`;
  const group2 = `<div class="ban-grp">${[3,4].map(slotHtml).join('')}</div>`;
  // 蓝方从左到右 1-2-3 | 4-5；红方镜像 5-4 | 3-2-1 贴近 LoL 原生对称
  return `<div class="ban-side ${isBlue?'blue':'red'} ${isMyBanTurn?'turn-ban':''}">
    ${isBlue ? `${group1}<i class="ban-sep"></i>${group2}` : `<div class="ban-grp">${[4,3].map(slotHtml).join('')}</div><i class="ban-sep"></i><div class="ban-grp">${[2,1,0].map(slotHtml).join('')}</div>`}
  </div>`;
}

// 渲染单侧（蓝方左 / 红方右）5 个大号 Pick 槽位 + 实时阵容情报
function renderSideColumn(M, d, side, cur, isBlue){
  const key = d[side];
  const lu = lineupMap(key);
  const isMe = side === M.me;
  const isMyPickTurn = cur && cur.kind==='pick' && cur.side===side;
  const canSwap = isMe && (M.phase==='draft' || M.phase==='ready') && Object.keys(d.picks[side]).length>=1;

  // 若轮到我 Pick 且已选中英雄，提前算出将落入哪个目标槽位做实时预览！
  let previewRole = null;
  if(isMe && isMyPickTurn && M.sel){
    const chk = canPickChamp(d, side, M.sel);
    if(chk.ok){
      previewRole = (M.roleSel && chk.openRoles.includes(M.roleSel)) ? M.roleSel : bestRoleFor(d, side, M.sel, chk.offrole);
    }
  } else if(isMyPickTurn){
    // 对手或未选中时，高亮第一个空缺位置作为视觉提示
    previewRole = openRolesFor(d, side)[0] || null;
  }

  const slotsHtml = ROLES.map(r=>{
    const p = lu[r];
    const c = d.picks[side][r];
    const isPreview = !c && isMyPickTurn && r===previewRole;
    const isSwapSrc = isMe && M.swapFrom===r;
    const isSwapTarget = isMe && M.swapFrom && M.swapFrom!==r;
    const fit = c ? champFit(p, c, r) : null;
    const offRole = c && !CH[c].roles.includes(r);
    const fitTag = !c ? '' : offRole
      ? `<span class="fit-badge bad">非本位</span>`
      : fit>=4.5 ? `<span class="fit-badge sig">招牌</span>`
      : fit>=1.5 ? `<span class="fit-badge ok">熟练</span>`
      : `<span class="fit-badge low">生疏</span>`;
    const swapAttr = canSwap && (c || M.swapFrom) ? `data-a="dSwap" data-r="${r}"` : '';

    return `<div class="pk-slot ${c?'locked':''} ${isPreview?'picking':''} ${isSwapSrc?'swap-src':''} ${isSwapTarget?'swap-dst':''} ${canSwap&&(c||M.swapFrom)?'swappable':''}" ${swapAttr} title="${canSwap?'点击可与同队其他位置互换摇摆位':''}">
      <div class="pk-ava-wrap">
        ${c ? champAvatar(c,'md')
            : (isPreview && isMe && M.sel) ? `${champAvatar(M.sel,'md preview')}<span class="preview-tag">待锁定</span>`
            : `<div class="c-ava empty md"><span class="role-ico">${ROLE_SVG[r]}</span></div>`}
      </div>
      <div class="pk-meta">
        <div class="pk-top">
          <span class="pk-role">${ROLE_SVG[r]}${ROLE_CN[r]}</span>
          <b class="pk-player">${p?esc(playerTag(p)):'—'}</b>
          ${p?`<span class="pk-ovr">${Math.round(effRating(p,r))}</span>`:''}
        </div>
        ${p?`<div class="pk-st">${formChip(p,true)}${mentalChip(p,true)}${traitChips(p)}</div>`:''}
        <div class="pk-bot">
          ${c ? `<span class="pk-champ">${esc(champName(c))}</span>${fitTag}`
              : (isPreview && isMe && M.sel) ? `<span class="pk-champ preview-txt">${esc(champName(M.sel))}...</span>`
              : isPreview ? `<span class="pk-waiting">正在选择…</span>`
              : `<span class="pk-idle">等待选人</span>`}
        </div>
      </div>
      ${isSwapSrc?'<span class="swap-pill">换位中</span>':''}
    </div>`;
  }).join('');

  // 实时阵容构成情报
  const pickedList = Object.values(d.picks[side]).filter(Boolean);
  const ci = compInfo(pickedList);
  const totalDmg = Math.max(1, ci.ad + ci.ap);
  const adPct = pickedList.length ? Math.round(ci.ad/totalDmg*100) : 50;
  const apPct = 100 - adPct;

  return `<aside class="hex-side ${isBlue?'blue':'red'} ${cur&&cur.side===side?(cur.kind==='ban'?'active-ban':'active-pick'):''}">
    <div class="side-head">
      <div class="side-id">
        <span class="side-badge ${isBlue?'blue':'red'}">${isBlue?'蓝色方 BLUE':'红色方 RED'}</span>
        <span class="ord-badge">${d.first===side?'BP先手':'BP后手'}</span>
      </div>
      <div class="side-team">${teamTag(key)} ${isMe?'<em class="me-pill">我方</em>':''}</div>
    </div>
    <div class="pk-list">${slotsHtml}</div>
    <div class="side-intel">
      <div class="intel-row">
        <span>伤害分布</span>
        <span><b class="c-ad">AD ${adPct}%</b> / <b class="c-ap">AP ${apPct}%</b></span>
      </div>
      <div class="dmg-bar"><i class="ad" style="width:${adPct}%"></i><i class="ap" style="width:${apPct}%"></i></div>
      <div class="intel-tags">
        ${pickedList.length?`<span class="style-chip">${STYLE_CN[ci.style]}体系</span>`:''}
        ${ci.notes.slice(0,2).map(n=>`<span class="note-chip ${/缺乏|纯/.test(n)?'warn':''}">${esc(n)}</span>`).join('')}
      </div>
      ${canSwap?`<div class="swap-hint">${M.swapFrom?`已选中 <b>${ROLE_CN[M.swapFrom]}</b>，点另一槽位互换（再点取消）`:'💡 点击己方槽位可摇摆换位'}</div>`:''}
    </div>
  </aside>`;
}

        <div class="hex-eyebrow">${M.games.length===0?'系列赛首局选边战':'BO5 决胜局选边战'} · 峡谷 1v1 SOLO</div>
        <h2>派出你的单挑王争夺选边权</h2>
        <p class="hex-sub">规则：中路 1v1 单挑，率先拿到 <b>一血</b>、<b>100 补刀</b> 或 <b>推掉一塔</b> 的选手获胜；10 分钟后火圈收缩，12 分钟前必分胜负，所在战队获得本局蓝/红方选边权（蓝色方永远为 BP 先手）。</p>
        <div class="solo-setup">
          <div class="solo-box">
            <h4>1. 选择出战选手（${teamName(myKey)}）</h4>
            <div class="solo-players">${ROLES.map(r=>{
              const p = myLu[r]; if(!p) return '';
              const on = M.soloMyRole===r;
              return `<button class="sp-btn ${on?'on':''}" data-a="soloRole" data-r="${r}">
                <span class="sp-r">${ROLE_SVG[r]}${ROLE_CN[r]}</span>
                <b>${esc(playerTag(p))}</b>
              </button>`;
            }).join('')}</div>
          </div>
          <div class="solo-box">
            <h4>2. 选择出战英雄（已自动推荐招牌）</h4>
            <div class="solo-champs">${soloChamps.map(c=>{
              const isSig = sigs.includes(c);
              const on = M.soloMyChamp===c;
              return `<button class="sc-btn ${on?'on':''}" data-a="soloChamp" data-c="${esc(c)}">
                ${champAvatar(c,'xs')}
                <span>${esc(champName(c))}${isSig?' 👑':''}</span>
              </button>`;
            }).join('')}</div>
          </div>
        </div>
        <div class="solo-go-row">
          <button class="lock-btn is-pick big-go" data-a="startSolo">⚔ 开始峡谷 1v1 选边赛</button>
          <button class="hex-btn ghost" data-a="autoSeries">跳过，自动模拟剩余系列赛</button>
        </div>
        ${intelPanel(M)}
      </div>
    </div>`;
  }

  // -------- 阶段 0B：峡谷 1v1 SOLO 实时观战（Canvas 中路对线，1x/2x/4x/8x、暂停、跳过） --------
  if(M.phase==='solo_watch' && !M.solo){
    return `<div class="match hex mode-choose mode-live">${head}
      <div class="hex-panel solo-watch-panel">
        <div class="solo-watch-hd"><span class="hex-eyebrow">⚔ 峡谷 1v1 SOLO 选边赛 · 观战直播</span><span class="w-rules">一血 · 100 补刀 · 一塔 · 10 分钟后火圈收缩</span></div>
        ${Watch.shellSolo()}
      </div>
    </div>`;
  }
  // -------- 阶段 0C：1v1 结果 + 选边 --------
  if(M.phase==='solo_watch' && M.solo){
    const s = M.solo;
    const myWon = s.winner === M.me;
    const card = side => {
      const f = s[side], tKey = side==='A' ? s.teamA : s.teamB, isWin = s.winner===side;
      return `<div class="solo-fighter ${side==='A'?'left':'right'} ${isWin?'winner':'loser'}">
        <div class="sf-top">${champAvatar(f.champ,'md')}
          <div class="sf-id"><div class="sf-team">${teamTag(tKey)} ${side===M.me?'<em class="me-pill">我方</em>':''}</div>
            <div class="sf-name"><b>${esc(f.tag)}</b> · ${esc(champName(f.champ))}</div><div class="sf-role">${ROLE_CN[f.role]||''} · ${f.lvl} 级</div></div></div>
        <div class="sf-substats"><span>🌾 补刀 <b>${f.cs}</b></span><span>${isWin?'🏆 胜者':'败者'}</span></div>
      </div>`;
    };
    return `<div class="match hex ${myWon?'mode-pick':'mode-ban'}">${head}
      <div class="hex-panel solo-watch-panel">
        <div class="solo-watch-hd"><span class="hex-eyebrow">⚔ 峡谷 1v1 SOLO 选边赛</span><span class="solo-done-tag">已完赛 · ${esc(s.winReason)} · ${fmtSec(s.dur)}</span></div>
        <div class="solo-arena">${card('A')}<div class="solo-clock-box"><div class="solo-time">${fmtSec(s.dur)}</div><div class="solo-vs">1 v 1</div><div class="solo-event-pill">${esc(s.winReason)}</div></div>${card('B')}</div>
        <div class="solo-result-bar">
          <h3>🏆 ${esc(s[s.winner].tag)}（${esc(champName(s[s.winner].champ))}）通过「${esc(s.winReason)}」获胜！${teamTag(s.winner==='A'?s.teamA:s.teamB)} 赢得本局选边权</h3>
          ${myWon ? `
            <p class="hex-sub">请你选择本局阵营（蓝色方永远为 BP 先手，红色方永远为 BP 后手）：</p>
            <div class="choose-cards single">
              <button class="hex-choice blue" data-a="chooseSideOnly" data-c="blue"><b>选择 蓝色方</b><small>BP 先手 · 一楼优先抢版本强势英雄</small></button>
              <button class="hex-choice red" data-a="chooseSideOnly" data-c="red"><b>选择 红色方</b><small>BP 后手 · 掌控五楼康特 Counter 位</small></button>
            </div>`
          : `
            <p class="hex-sub">对手已选择 <b>${M.soloAiBlue===opp?'蓝色方（BP 先手）':'红色方（BP 后手）'}</b>，本局你将位于 <b>${M.soloAiBlue===M.me?'蓝色方（BP 先手）':'红色方（BP 后手）'}</b>。</p>
            <button class="lock-btn is-pick" data-a="soloEnterDraft">进入 BP 阶段 ▶</button>`}
        </div>
        ${intelPanel(M)}
        <details class="solo-log"><summary>对线全过程</summary><div class="solo-feed">${s.log.slice().reverse().map(f=>`<div class="solo-line ${f.side==='A'?'sa':f.side==='B'?'sb':''} ${f.hl?'hl':''}"><span class="sl-t">${esc(f.t)}</span><span class="sl-tag">${esc(f.tag)}</span><span class="sl-txt">${esc(f.text)}</span></div>`).join('')}</div></details>
      </div>
    </div>`;
  }

  // -------- 阶段 L：5v5 召唤师峡谷实时观战 --------
  if(M.phase==='live'){
    return `<div class="match hex mode-live">${head}${Watch.shell5()}</div>`;
  }

  // -------- 阶段 1：经典蓝先红后选边（仅在第 2–4 局我方为上一局败者时显示） --------
  if(M.phase==='choose'){
    return `<div class="match hex ${modeCls}">${head}
      <div class="hex-panel choose-panel">
        <div class="hex-eyebrow">经典职业选边规则 · 败者选边</div>
        <h2>你拥有本局选边权</h2>
        <p class="hex-sub">请选择本局地图阵营：<b>蓝色方固定为 BP 先手</b>，<b>红色方固定为 BP 后手（五楼康特位）</b>。</p>
        <div class="choose-cards single">
          <button class="hex-choice blue" data-a="chooseSideOnly" data-c="blue"><b>选择 蓝色方</b><small>BP 先手 · 一楼先抢核心英雄</small></button>
          <button class="hex-choice red" data-a="chooseSideOnly" data-c="red"><b>选择 红色方</b><small>BP 后手 · 握有五楼康特位</small></button>
        </div>
        <div class="choose-foot">
          <button class="hex-btn ghost" data-a="autoSeries">跳过，自动模拟剩余系列赛</button>
        </div>
        ${intelPanel(M)}
      </div>
    </div>`;
  }

  // -------- 顶部独立 Ban 栏 + 中央阶段横幅（固定左蓝右红） --------
  const myTurn = cur && cur.side===M.me;
  const actingIsBlue = cur && cur.side===leftSide;
  let bannerHtml = '';
  if(M.phase==='draft' && cur){
    const isBan = cur.kind==='ban';
    bannerHtml = `<div class="phase-banner ${isBan?'is-ban':'is-pick'} ${myTurn?'my-turn':'opp-turn'}">
      <div class="pb-dir ${actingIsBlue?'left':'right'}">${actingIsBlue?'◀ 蓝色方行动':'红色方行动 ▶'}</div>
      <div class="pb-main">
        <span class="pb-tag">${isBan?'⚔ 禁用阶段 · BAN':'✦ 选择阶段 · PICK'}</span>
        <b class="pb-msg">${myTurn ? (isBan?'轮到你禁用一名英雄':'轮到你选择一名英雄') : (isBan?`${teamName(d[cur.side])} 正在禁用…`:`${teamName(d[cur.side])} 正在选人…`)}</b>
      </div>
      <div class="pb-clock">
        <span id="bp-clock-num" class="${M.clock<=5?'urgent':''}">${String(M.clock).padStart(2,'0')}</span>
        <div class="pb-clock-bar"><i id="bp-clock-fill" style="width:${M.clock/30*100}%"></i></div>
      </div>
    </div>`;
  } else if(M.phase==='ready'){
    bannerHtml = `<div class="phase-banner is-ready">
      <div class="pb-main"><span class="pb-tag">✓ 阵容锁定完毕</span><b class="pb-msg">可点击两侧己方位置互换摇摆位，确认后进入召唤师峡谷</b></div>
    </div>`;
  } else {
    const g = M.games[M.games.length-1];
    const won = g && g.w===M.me;
    bannerHtml = `<div class="phase-banner is-result ${won?'win':'lose'}">
      <div class="pb-main"><span class="pb-tag">${won?'🏆 VICTORY':'💀 DEFEAT'}</span><b class="pb-msg">第 ${M.games.length} 局结束 · ${g?`${g.dur}分钟 · 击杀 ${leftSide==='A'?g.kA:g.kB} : ${leftSide==='A'?g.kB:g.kA}`:''}</b></div>
    </div>`;
  }

  const banBar = `<section class="ban-bar">
    ${renderBanRow(d, leftSide, cur, true)}
    ${bannerHtml}
    ${renderBanRow(d, rightSide, cur, false)}
  </section>`;

  // -------- 中央主舞台（BP英雄池 / Ready赛前分析 / Result战报） --------
  let center = '';
  const un = unavailable(d);
  const bannedSet = new Set([...d.bans.A, ...d.bans.B]);
  const pickedSet = new Set([...Object.values(d.picks.A), ...Object.values(d.picks.B)].filter(Boolean));
  const lockedSet = new Set(M.locked);

  if(M.phase==='draft'){
    const isBan = cur && cur.kind==='ban';
    const myLu = lineupMap(d[M.me]), oppLu = lineupMap(d[opp]);
    const suggestions = myTurn ? coachSuggest(d, M.me) : [];
    const offroleFallback = myTurn && !isBan && !hasAnyOnRoleChamp(d, M.me);

    const list = CHAMP_KEYS.filter(k=>{
      if(M.filter!=='ALL' && !CH[k].roles.includes(M.filter)) return false;
      if(M.q && !(k+CH[k].cn).toLowerCase().includes(M.q.toLowerCase())) return false;
      if(M.onlyAvail){
        if(un.has(k)) return false;
        if(myTurn && !isBan && !canPickChamp(d, M.me, k).ok) return false;
      }
      return true;
    }).sort((a,b)=>{
      // 可用排前、版本强势略靠前
      const da = un.has(a)?1:0, db = un.has(b)?1:0;
      if(da!==db) return da-db;
      return (S.meta[b]||0) - (S.meta[a]||0);
    });

    // 选中英雄详情与锁定台（手机/触控轻点英雄即展示全部角标原因，再点右侧独立确认按键锁定）
    let selInfoHtml = `<div class="dock-empty">${myTurn ? (isBan?'轻点上方英雄查看详情，再点右侧「确认禁用」':'轻点上方英雄查看详情，再点右侧「确认选择」') : '等待对手完成本步操作…'}</div>`;
    if(myTurn && M.sel && CH[M.sel]){
      const ch = CH[M.sel];
      const info = champBadgeInfo(d, M, M.sel);
      const rolePickHtml = !isBan ? roleChooser(d, M.me, M.sel) : '';
      let fitLine = '';
      if(isBan){
        const oppMatches = openRolesFor(d, opp).filter(r=>ch.roles.includes(r));
        const threat = oppMatches.map(r=>({r, p:oppLu[r], f:champFit(oppLu[r],M.sel,r)})).sort((a,b)=>b.f-a.f)[0];
        fitLine = threat ? `敌方威胁：${ROLE_CN[threat.r]} ${esc(playerTag(threat.p))} · ${threat.f>=4.5?'招牌绝活':threat.f>=1.5?'熟练':'一般'}` : '对手该位置已锁定或非常规选位';
      } else {
        const chk = canPickChamp(d, M.me, M.sel);
        const r = (M.roleSel && chk.openRoles.includes(M.roleSel)) ? M.roleSel : bestRoleFor(d, M.me, M.sel, chk.offrole);
        const f = r ? champFit(myLu[r], M.sel, r) : -4;
        fitLine = r ? `分配给 ${ROLE_CN[r]} ${esc(playerTag(myLu[r]))} · ${!ch.roles.includes(r)?'⚠️ 跨位强选':f>=4.5?'👑 招牌英雄':f>=1.5?'熟练度良好':'较生疏'}` : '';
      }
      selInfoHtml = `<div class="dock-sel">
        ${champAvatar(M.sel,'sm')}
        <div class="dock-meta">
          <div class="dock-name"><b>${esc(ch.cn)}</b> <small>${esc(info.metaText)}</small></div>
          <div class="dock-fit">${fitLine}</div>
          ${info.badges.length?`<div class="dock-badges">${info.badges.map(b=>`<span class="dbadge ${b.cls}">${b.icon} ${esc(b.text)}</span>`).join('')}</div>`:''}
          ${rolePickHtml}
        </div>
      </div>`;
    }

    center = `<section class="hex-center ${isBan?'stage-ban':'stage-pick'}">
      ${myTurn && suggestions.length ? `<div class="coach-bar">
        <span class="coach-lbl">${isBan?'教练建议禁用':'教练建议选择'}</span>
        <div class="coach-list">${suggestions.map(s=>`<button class="coach-chip ${M.sel===s.c?'sel':''}" data-a="dSel" data-c="${esc(s.c)}" ${s.role?`data-r="${s.role}"`:''}>
          ${champAvatar(s.c,'xs')}<span><b>${esc(champName(s.c))}</b><small>${esc(s.reason)}</small></span>
        </button>`).join('')}</div>
      </div>` : ''}

      <div class="pool-tools">
        <div class="role-tabs">${['ALL',...ROLES].map(r=>`<button class="rtab ${M.filter===r?'on':''}" data-a="dFilter" data-r="${r}" title="${r==='ALL'?'全部位置':ROLE_CN[r]}">${ROLE_SVG[r]}<span>${r==='ALL'?'全部':ROLE_CN[r]}</span></button>`).join('')}</div>
        <div class="pool-search">
          <label class="avail-chk"><input type="checkbox" data-d="avail" ${M.onlyAvail?'checked':''}> 只看可选</label>
          <input data-d="q" placeholder="搜索英雄中/英文…" value="${esc(M.q)}">
        </div>
      </div>

      ${offroleFallback?`<div class="fallback-tip">⚠️ 本位置常规英雄已在无畏征召中耗尽，已自动解锁跨位强选保底！</div>`:''}

      <div class="cgrid-lol">${list.map(k=>{
        const isLocked = lockedSet.has(k);
        const isBanned = bannedSet.has(k);
        const isPicked = pickedSet.has(k);
        const unavail = un.has(k);
        const cantPick = myTurn && !isBan && !canPickChamp(d, M.me, k).ok;
        const dis = unavail || cantPick;
        const sel = M.sel === k;
        const mineSig = ROLES.find(r=>!d.picks[M.me][r] && myLu[r] && myLu[r].champs.some(x=>x.c===k && x.p>=4));
        const oppSig  = ROLES.find(r=>!d.picks[opp][r] && oppLu[r] && oppLu[r].champs.some(x=>x.c===k && x.p>=5));
        const stamp = isLocked ? `<span class="c-stamp fl">无畏锁</span>`
                    : isBanned ? `<span class="c-stamp bn">已禁</span>`
                    : isPicked ? `<span class="c-stamp pk">已选</span>` : '';
        return `<div class="ch-card ${dis?'dis':''} ${sel?(isBan?'sel-ban':'sel-pick'):''}" data-ch="${esc(k)}" ${dis||!myTurn?'':`data-a="dSel" data-c="${esc(k)}"`}>
          <div class="ch-thumb">
            ${champAvatar(k,'grid')}
            ${S.meta[k]>=2?'<span class="meta-dot t0">🔥</span>':S.meta[k]>=1?'<span class="meta-dot t1">↑</span>':''}
            ${mineSig?`<span class="sig-dot mine">👑</span>`:''}
            ${oppSig?`<span class="sig-dot opp">⚠</span>`:''}
            ${stamp}
            ${sel && isBan ? '<div class="sel-overlay ban"><span>BAN</span></div>' : ''}
            ${sel && !isBan ? '<div class="sel-overlay pick"><span>PICK</span></div>' : ''}
          </div>
          <div class="ch-name">${esc(CH[k].cn)}</div>
        </div>`;
      }).join('')}</div>

      <div class="lock-dock">
        ${selInfoHtml}
        <div class="dock-actions">
          ${myTurn ? `<button class="lock-btn ${isBan?'is-ban':'is-pick'}" data-a="dLock" ${M.sel?'':'disabled'}>
            ${isBan ? (M.sel?`🚫 确认禁用 · ${esc(champName(M.sel))}`:'确认禁用')
                    : (M.sel?`✓ 确认选择 · ${esc(champName(M.sel))}`:'确认选择')}
          </button>` : `<div class="ai-wait-pill">对手思考中…</div>`}
          <div class="dock-sub-btns">
            <button class="hex-btn sm ghost" data-a="dAuto">自动完成本局BP</button>
            <button class="hex-btn sm ghost" data-a="autoSeries">自动模拟剩余系列赛</button>
          </div>
        </div>
      </div>
    </section>`;

  } else if(M.phase==='ready'){
    const e = evalDraft(d);
    const leftE  = leftSide==='A' ? e.a : e.b;
    const rightE = rightSide==='A' ? e.a : e.b;
    const leftP  = Math.round((leftSide==='A' ? e.pA : 1-e.pA)*100);
    const rightP = 100 - leftP;
    const se = styleEdge(leftE.comp.style, rightE.comp.style);
    const curveBar = (label, lv, rv) => {
      const p = clamp(Math.round(sigmoid((lv-rv)/3.5)*100), 15, 85);
      return `<div class="curve-row"><span>${label}</span><div class="curve-bar"><i class="bl" style="width:${p}%"></i><i class="rd" style="width:${100-p}%"></i></div><span>${p}% / ${100-p}%</span></div>`;
    };
    center = `<section class="hex-center ready-stage">
      <h3>赛前阵容评估</h3>
      <div class="prob-box">
        <div class="prob-lbls"><span class="bl">${teamName(leftTeam)} <b>${leftP}%</b></span><small>预测胜率</small><span class="rd"><b>${rightP}%</b> ${teamName(rightTeam)}</span></div>
        <div class="prob-track"><div class="bl" style="width:${leftP}%"></div><div class="rd" style="width:${rightP}%"></div></div>
      </div>
      <div class="ready-compare">
        <div class="rc-card blue">
          <h4>${teamName(leftTeam)} · ${STYLE_CN[leftE.comp.style]}阵</h4>
          <p>${leftE.comp.notes.length?leftE.comp.notes.join(' · '):'均衡常规阵'}</p>
        </div>
        <div class="rc-vs">${se>0?'◀ 体系克制':se<0?'体系克制 ▶':'体系均势'}</div>
        <div class="rc-card red">
          <h4>${teamName(rightTeam)} · ${STYLE_CN[rightE.comp.style]}阵</h4>
          <p>${rightE.comp.notes.length?rightE.comp.notes.join(' · '):'均衡常规阵'}</p>
        </div>
      </div>
      <div class="curve-box">
        ${curveBar('前期对线 (0-14m)', leftE.early, rightE.early)}
        ${curveBar('中期资源 (14-24m)', leftE.mid, rightE.mid)}
        ${curveBar('后期团战 (25m+)', leftE.late, rightE.late)}
      </div>
      <p class="hex-sub">提示：开赛前仍可在侧栏点击己方两个槽位进行摇摆换位，胜率与熟练度将实时重算。</p>
      <div class="ready-actions">
        <button class="lock-btn is-pick big-go" data-a="playGame">⚔ 进入召唤师峡谷 · 开始对局</button>
      </div>
    </section>`;

  } else if(M.phase==='result'){
    const g = M.games[M.games.length-1];
    const won = g.w === M.me;
    const fin = Math.max(M.wa, M.wb) >= Math.ceil(m.bo/2);
    const lK = leftSide==='A'?g.kA:g.kB, rK = rightSide==='A'?g.kA:g.kB;
    const lTur = leftSide==='A'?g.turA:g.turB, rTur = rightSide==='A'?g.turA:g.turB;
    const lDrg = leftSide==='A'?g.dragA:g.dragB, rDrg = rightSide==='A'?g.dragA:g.dragB;
    const lBar = leftSide==='A'?g.baronA:g.baronB, rBar = rightSide==='A'?g.baronA:g.baronB;
    const gDiff = leftSide==='A' ? g.goldDiff : -g.goldDiff;

    const box = (side, isBlue) => {
      const rows = side==='A'?g.sa:g.sb;
      const totK = Math.max(1, side==='A'?g.kA:g.kB);
      return `<div class="res-team ${isBlue?'blue':'red'}">
        <div class="res-th">${teamTag(d[side])} <span>${g.w===side?'VICTORY':'DEFEAT'}</span></div>
        <table class="hex-tbl">
          <tr><th>位置</th><th>选手</th><th>英雄</th><th>K/D/A</th><th>补刀</th><th>经济</th><th>参团</th></tr>
          ${rows.map(x=>{
            const kp = Math.min(100, Math.round((x.k+x.a)/totK*100));
            return `<tr class="${x.pid===g.mvp?'is-mvp':''}">
              <td>${ROLE_CN[x.r]}</td>
              <td><b>${esc(x.tag||x.pid||'')}</b>${x.pid===g.mvp?' <span class="mvp-b">MVP</span>':''}</td>
              <td class="td-ch">${champAvatar(x.c,'xs')}<span>${esc(champName(x.c))}</span></td>
              <td class="td-kda">${x.k}/${x.d}/${x.a}</td>
              <td>${x.cs!=null?x.cs:'-'}</td>
              <td>${x.gold!=null?(x.gold/1000).toFixed(1)+'k':'-'}</td>
              <td>${kp}%</td>
            </tr>`;
          }).join('')}
        </table>
      </div>`;
    };

    center = `<section class="hex-center result-stage">
      <div class="res-hero ${won?'win':'lose'}">
        <h2>${won?'VICTORY · 胜利':'DEFEAT · 失利'}</h2>
        <div class="res-objs">
          <span>⏱ ${g.dur} 分钟</span>
          <span>⚔ 击杀 ${lK} : ${rK}</span>
          <span>🏰 防御塔 ${lTur} : ${rTur}</span>
          <span>🐉 小龙 ${lDrg} : ${rDrg}</span>
          <span>👾 大龙 ${lBar} : ${rBar}</span>
          <span>💰 经济差 ${gDiff>=0?teamName(leftTeam):teamName(rightTeam)} +${Math.abs(gDiff).toFixed(1)}k</span>
        </div>
      </div>

      <div class="res-tables">
        ${box(leftSide, true)}
        ${box(rightSide, false)}
      </div>

      ${g.events&&g.events.length ? `<div class="timeline-box">
        <h4>对局关键时间轴</h4>
        <ul class="ev-timeline">${g.events.map(ev=>`<li class="${ev.side===leftSide?'blue':'red'}">
          <span class="ev-t">${esc(ev.t)}</span>
          <span class="ev-tag">${esc(ev.tag||'事件')}</span>
          <span class="ev-txt">${esc(ev.text)}</span>
        </li>`).join('')}</ul>
      </div>` : ''}

      ${g.impacts&&g.impacts.length ? `<div class="impact-box">
        ${g.impacts.map(s=>`<span class="imp-chip">✦ ${esc(s)}</span>`).join('')}
      </div>` : ''}

      <div class="ready-actions">
        ${g.rid && findReplay(g.rid) && findReplay(g.rid).rec ? `<button class="hex-btn ghost" data-a="openReplay" data-id="${esc(g.rid)}">▶ 观看本局回放</button>` : ''}
        ${fin
          ? `<div class="series-fin">系列赛结束：${teamTag(m.a)} <b>${M.wa} : ${M.wb}</b> ${teamTag(m.b)}</div>
             <button class="lock-btn is-pick" data-a="finishSeries">确认赛果并返回 ▶</button>`
          : `<button class="lock-btn is-pick" data-a="nextGame">进入第 ${M.games.length+1} 局（无畏征召累计锁定 ${M.locked.length} 人）▶</button>`}
      </div>
    </section>`;
  }

  return `<div class="match hex ${modeCls}">
    ${head}
    ${banBar}
    <div class="draft-lol">
      ${renderSideColumn(M, d, leftSide, cur, true)}
      ${center}
      ${renderSideColumn(M, d, rightSide, cur, false)}
    </div>
    <div id="ch-tip" class="ch-tip" style="display:none"></div>
  </div>`;
}

function roleChooser(d, side, c){
  const chk = canPickChamp(d, side, c);
  const open = chk.openRoles;
  if(open.length<=1) return '';
  const M=UI.match;
  const cur = M.roleSel && open.includes(M.roleSel) ? M.roleSel : bestRoleFor(d, side, c, chk.offrole);
  return `<div class="rolesel-lol"><span>分配位置：</span>${open.map(r=>`<button class="rs-btn ${r===cur?'on':''}" data-a="dRole" data-r="${r}">${ROLE_CN[r]}</button>`).join('')}</div>`;
}

function endUserGame(g){
  const M=UI.match; M.games.push(g); if(g.w==='A')M.wa++; else M.wb++;
  M.locked = M.locked.concat(Object.values(g.picks.A),Object.values(g.picks.B)).filter(Boolean);
  M.chooser = g.w==='A'?'B':'A'; M.phase='result'; M.swapFrom=null;
  stopBpClock();
}

  startSolo:()=>{

    const myTeamKey = m[me==='A'?'a':'b'], oppTeamKey = m[op==='A'?'a':'b'];

    const myPl = myLu[M.soloMyRole];
    const myPick = { role: M.soloMyRole, pid: myPl?myPl.pid:null, champ: M.soloMyChamp };
    const oppPick = defaultSoloPick(oppTeamKey);
    const g = me==='A' ? createSolo(m.a, m.b, myPick, oppPick, {record:true}) : createSolo(m.a, m.b, oppPick, myPick, {record:true});

      const res = soloResult(w.g);
      M.solo = res;
      M.chooser = res.winner;
      M.pendingSolo = soloReplayData(res);
      if(M.chooser !== me){
        const opSide = aiChooseSide(oppTeamKey, myTeamKey, M.locked);
        M.soloAiBlue = opSide === 'blue' ? op : me;

      render();

  dSwap:d=>{
    const M=UI.match; if(!M||!M.draft) return;
    if(!M.swapFrom){
      if(!M.draft.picks[M.me][d.r]) return;
      M.swapFrom = d.r; render(); return;
    }
    if(M.swapFrom === d.r){ M.swapFrom = null; render(); return; }
    if(swapDraftRoles(M.draft, M.me, M.swapFrom, d.r)){
      toast(`已交换 ${ROLE_CN[M.swapFrom]} 与 ${ROLE_CN[d.r]} 英雄`);
    }
    M.swapFrom = null; render();

  dLock:()=>{
    const M=UI.match; if(!M||!M.sel) return;
    const cur=draftSide(M.draft); if(!cur || cur.side!==M.me) return;
    let role=null, allowOff=false;
    if(cur.kind==='pick'){
      const chk = canPickChamp(M.draft, M.me, M.sel);
      allowOff = chk.offrole;
      role = M.roleSel && chk.openRoles.includes(M.roleSel) ? M.roleSel : null;
    }
    if(draftAct(M.draft, M.sel, role, allowOff)){
      M.sel=null; M.roleSel=null; M.swapFrom=null;
      render(); queueAI();
    } else toast('该英雄无法选择（没有空余对应位置）');

  playGame:()=>{
    const M=UI.match; if(!M||!M.draft) return;
    stopBpClock();
    const G = createGame5(M.draft, {record:true});
    M.phase = 'live';
    Watch.start({ kind:'g5', g:G, me:M.me, onEnd: w=>{
      if(UI.match!==M) return;
      const g = game5Result(w.g);
      storeUserReplay(M, g);
      endUserGame(g);
      render();
    }});
    render();
  },
  nextGame:()=>{ const M=UI.match; enterNextGamePhase(M); render(); },
  autoSeries:()=>{
    const M=UI.match; const m=M.item.m; const need=Math.ceil(m.bo/2);
    stopBpClock(); Watch.stop();
    const play = d => { const g = playGame(d, {record:true}); storeUserReplay(M, g); endUserGame(g); };
    if(M.phase==='draft'||M.phase==='ready'){ autoDraftRest(M.draft); play(M.draft); }
    while(M.wa<need&&M.wb<need){
      if(!M.chooser || (m.bo===5 && M.wa===2 && M.wb===2)){ const r = simSolo1v1(m.a, m.b, null, null, {record:true}); M.chooser = r.winner; M.pendingSolo = soloReplayData(r); }
      const other = M.chooser==='A'?'B':'A';
      const sidePick = aiChooseSide(m[M.chooser==='A'?'a':'b'], m[other==='A'?'a':'b'], M.locked);
      const blue = sidePick==='blue' ? M.chooser : other;
      const d=newDraft(m.a,m.b,blue,M.locked); setDraftCtx(M, d); autoDraftRest(d); play(d);
    }
    ACT.finishSeries();
  },
  finishSeries:()=>{
    const M=UI.match; const m=M.item.m;
    stopBpClock(); Watch.stop();
    finishSeries(m,M.wa,M.wb,M.games,true); afterMatch(M.item.st,m);
    const won=m.w===S.user; addNews(`${won?'✅':'❌'} ${teamName(m.a)} ${M.wa}:${M.wb} ${teamName(m.b)}（${m.label}）`);
    UI.match=null; save(); render(); toast(won?'系列赛获胜！':'系列赛失利');
  },
};

async function bootApp(){
  await StorageBridge.init();
  const raw = await StorageBridge.readSaveText();
  if(raw){
    try{
      const parsed = migrateSave(JSON.parse(raw));
      UI.hasSave = true;
      UI.savePreview = makeSaveSummary(parsed);
    }catch(e){ UI.hasSave = false; }
  }
  await CloudSync.init();
  if(CloudSync.isLoggedIn()){
    // 已记住上次登录：若有云端恢复的档或本地档，直接进入第2屏（或已在主页）
    if(S) UI.savePreview = makeSaveSummary(S);
    UI.entry = 'lobby';
  } else {
    // 未登录：始终先展示第 1 屏（登录 / 游客独立门户），绝不与战队混在一起
    UI.entry = 'gate';
  }
  render();
}

});
// 桌面端鼠标悬停英雄卡片弹出海克斯情报浮层（解释 🔥 / ↑ / 👑 / ⚠，无括号数字）
document.addEventListener('mouseover', e=>{
  const card = e.target.closest('.ch-card[data-ch]');
  const tip = document.getElementById('ch-tip');
  if(!tip) return;
  if(!card || !UI.match || !UI.match.draft){ tip.style.display='none'; return; }
  const k = card.dataset.ch;
  const ch = CH[k]; if(!ch){ tip.style.display='none'; return; }
  const info = champBadgeInfo(UI.match.draft, UI.match, k);
  tip.innerHTML = `<div class="ct-hd"><b>${esc(ch.cn)}</b><small>${esc(ch.k)}</small></div>
    <div class="ct-meta">${esc(info.metaText)}</div>
    ${info.badges.length ? `<ul class="ct-list">${info.badges.map(b=>`<li class="${b.cls}"><span>${b.icon}</span>${esc(b.text)}</li>`).join('')}</ul>`
      : `<div class="ct-none">常规可用英雄，无特殊版本或招牌标记</div>`}`;
  tip.style.display = 'block';
  const r = card.getBoundingClientRect();
  const tw = tip.offsetWidth || 240, th = tip.offsetHeight || 90;
  let left = r.left + r.width/2 - tw/2;
  left = Math.max(10, Math.min(window.innerWidth - tw - 10, left));
  let top = r.top - th - 10;
  if(top < 10) top = r.bottom + 10;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
});
document.addEventListener('mouseout', e=>{
  if(e.target.closest('.ch-card[data-ch]') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.ch-card[data-ch]'))){
    const tip = document.getElementById('ch-tip');
    if(tip) tip.style.display='none';
  }
});
window.addEventListener('load', bootApp);
</script>
</body></html>
