plugins {
    id 'com.android.application'
}

android {
    namespace 'com.d3ceugod.riftmanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.d3ceugod.riftmanager"
        minSdk 24
        targetSdk 34
        versionCode 224
        versionName "2.1.14"
    }

    signingConfigs {
        release {
            def ks = System.getenv("RELEASE_STORE_FILE")
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: "riftmanager"
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "riftmanager"
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "riftmanager"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            def ks = System.getenv("RELEASE_STORE_FILE")
            if (ks != null && !ks.isEmpty()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
