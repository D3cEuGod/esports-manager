[package]
name = "rift-manager"
version = "2.1.11"
description = "峡谷经理人 · 英雄联盟电竞经理"
authors = ["D3cEuGod"]
edition = "2021"

[lib]
name = "rift_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
